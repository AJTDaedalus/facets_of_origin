# Comparator maps for the mapgen quality bar (docs/DESIGN_mapgen.md §7).
#
# These are the owner's own WotC map packs. They are copyrighted: mapgen only
# READS them in memory (from the zip) to compute numbers and contact sheets.
# Never extract them into the repo, never sample textures from them, never commit
# an image derived from them. Paths are relative to MAPGEN_REF_DIR
# (default "/mnt/e/books/DandD 5E"). Tests that need them skip when it's absent.
#
# px_per_square: measured 2026-11-13 by spectral periodicity of edge energy and
# checked by eye on full-resolution crops with tick marks (T28).
# crop / exclude: fractions of the image [x0, y0, x1, y1]; exclude boxes cover
# legends, titles, compasses and scale notes.

ref_dir_default: "/mnt/e/books/DandD 5E"


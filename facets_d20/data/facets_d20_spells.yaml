# Facets d20 — the Common list, domains (SRD 5.2.1 spell lists), slot tables and the
# spells the simulator models. v0.2. Contract: docs/DESIGN_facets_d20_v0_2.md §1.6 and §3.
# V24: no smite spells (Divine Smite, Searing Smite) on any list — Sworn Strike is the one
# weapon-hit rider bought with a resource, so slot count never buys weapon damage.
# Every name is an SRD 5.2.1 spell at its SRD level (verified: docs/RESEARCH_facets_d20_srd_check.md;
# pinned in software/tests/test_facets_d20_spells.py::SRD_521_VERIFIED).
# Slot rows list slots per spell level: [1st, 2nd, 3rd, 4th, 5th], read by CHARACTER level.
version: 0.2
source: SRD 5.2.1 (CC BY 4.0). Spell names only; rules text lives in the SRD.
traditions:
  thaumaturgy: {name: Thaumaturgy, facet: mind, ability: [int], style: scholarly}
  invocation: {name: Invocation, facet: soul, ability: [soul], style: intuitive}   # soul = higher of Wis/Cha
casting:
  known: all_on_lists            # cast any spell on your lists of a level you have a slot for; no preparation
  cantrips: all_on_lists
  domains_from: tracks           # domains come from `domains` effects: Spellcasting (Spell depth 1), Wider Study, Deep Magic (facets_d20.yaml tracks.spell)
  prismatic_from: deep_magic      # a prismatic domain only as Deep Magic's domain (Spell depth 3) — pending owner ruling, DESIGN §5.1
  domain_swap: retrain           # the once-per-level retrain (facets_d20.yaml advancement.retrain)
  table_index: character_level   # both tables; there is no separate caster level in v0.2
  save_dc: 8+pb+casting
  spell_attack: pb+casting
  rituals: any_list_spell_with_ritual_tag
full_table:
  1: [2]
  2: [3]
  3: [4, 2]
  4: [4, 3]
  5: [4, 3, 2]
  6: [4, 3, 3]
  7: [4, 3, 3, 1]
  8: [4, 3, 3, 2]
  9: [4, 3, 3, 3, 1]
  10: [4, 3, 3, 3, 2]
half_table:
  1: [2]
  2: [2]
  3: [3]
  4: [3]
  5: [4, 2]
  6: [4, 2]
  7: [4, 3]
  8: [4, 3]
  9: [4, 3, 2]
  10: [4, 3, 2]

      only (TP13, TP27, TP33). In the east-wing chase the household moves her, and the party
      holds the Radiant off from doors, corridors and stairs; Corval guides them, never to her
      (TP40). The Crossing is the one exception: Vell says "Take her. The gate. Don't stop."
      to the characters, and they carry or support her to the boat, as printed (TP41).
    source: owner TP13, TP27, TP33, TP40, TP41; T4.10

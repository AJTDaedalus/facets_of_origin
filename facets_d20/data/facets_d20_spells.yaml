# Facets d20 — domains to SRD 5.2.1 spell lists, and the caster tables.
# Contract: docs/DESIGN_facets_d20.md §2. Prose: facets_d20/07_Magic.md.
# Slot rows list slots per spell level: [1st, 2nd, 3rd, 4th, 5th].
# Tests: software/tests/test_facets_d20_spells.py
source: SRD 5.2.1 (CC BY 4.0). Spell names only; rules text lives in the SRD.
traditions:
- name: Thaumaturgy
  facet: Mind
  ability: [Intelligence]
  talent: Thaumaturgy
  style: scholarly
- name: Invocation
  facet: Soul
  ability: [Wisdom, Charisma]
  talent: Invocation
  style: intuitive
casting:
  domains_on_talent: 2
  third_domain_talent: Wider Study
  # Planner ruling (a): BOTH tables are read by caster level, never character level.
  caster_level: levels since the caster talent was taken, counting that level as 1
  full_table_index: caster_level
  half_table_index: caster_level
  cantrips_index: character_level
  prepared_full: casting_mod + caster_level
  prepared_half: 'casting_mod + half caster level (round down), min 1'
full_table:
  1: [2]
  2: [3]
  3: [4, 2]
  4: [4, 3]
  5: [4, 3, 2]
  6: [4, 3, 3]
  7: [4, 3, 3, 1]
  8: [4, 3, 3, 2]
  9: [4, 3, 3, 3, 1]
  10: [4, 3, 3, 3, 2]
half_table:
  1: [2]
  2: [2]
  3: [3]
  4: [3]
  5: [4, 2]
  6: [4, 2]
  7: [4, 3]
  8: [4, 3]
  9: [4, 3, 2]
  10: [4, 3, 2]
cantrips_known: {1: 2, 2: 2, 3: 2, 4: 3, 5: 3, 6: 3, 7: 3, 8: 3, 9: 3, 10: 4}
recommended_pairs:
  Priest: [The Tide, Presence]
  Druid: [Verdance, Beasts]
  Oracle: [Fate, Divination]

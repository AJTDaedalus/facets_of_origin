# Generic outdoor battle map (owner request 2026-11-14), homebrew, no canon:
#   "A battlemap of an eerie, white sand coast with occasional black stones washed up. A nearly
#    glowing mist covers the sands and the water, slightly transparent, dancing between the stones
#    and waves. It looks cold and threatening in the dim light."
# 60×40 ft, 5 ft squares. Sea to the east, white sand to the west, a wet-sand band and surf at the
# waterline, black stones scattered on the sand and in the shallows, pale mist over everything.
map:
  title: The Pale Strand
  width_ft: 60
  height_ft: 40
  feet_per_square: 5
  px_per_square: 70
  supersample: 2
  seed: 1114
  include: [styles/inked_parchment.yaml]

palette:
  # the black stones: every stone prop on this map draws from these
  stone_light: "#4a4d52"
  stone: "#2a2c30"
  stone_dark: "#141518"

materials:
  white_sand: {type: dirt, colors: ["#dadddb", "#ebeeec", "#fafbfa"], scale: 9, octaves: 5, grain: 0.06, speckle: 0.07}
  wet_sand:   {type: dirt, colors: ["#9ea5a6", "#b2b8b8", "#c4c9c8"], scale: 6, octaves: 4, grain: 0.05, speckle: 0.04}
  cold_sea:   {type: water, shallow: "#7d9399", deep: "#34505a", depth: 12, ripples: 2.0, ripple_color: "#c9d6d8", grain: 0.04}

steps:
  - {op: base}
  - {op: fill, material: cold_sea, id: sea_fill}
  # ---- the shore: sand west of a wandering waterline, with a small spit at mid-map
  - {op: polygon, out: shore_shape, points: [[0, 0], [41, 0], [38, 8], [40, 14], [46, 19], [43, 23], [37, 27], [36, 34], [33, 40], [0, 40]]}
  - {op: roughen_geom, out: land, src: shore_shape, amount: 1.2, scale: 5}
  - {op: rasterize, out: land_m, src: land}
  - {op: fill, mask: land_m, material: white_sand, id: sand_fill}
  - {op: rect, out: frame_r, x: 0, y: 0, w: 60, h: 40}
  - {op: subtract, out: sea, a: frame_r, b: [land]}
  - {op: rasterize, out: sea_m, src: sea}
  # ---- the waterline, built up in soft layers rather than one hard edge
  # the shallows: a pale wash fading out from the beach over five feet
  - {op: band, out: shallows_wash, src: land_m, inner: 0, outer: 5}
  - {op: blur, out: shallows_wash, src: shallows_wash, sigma: 1.6}
  - {op: fill, mask: shallows_wash, color: "#8ea4a8", opacity: 0.55, id: shallows_fill}
  # wet sand: darkest at the water, fading up the beach
  - {op: band, out: wet_m, src: sea_m, inner: 0, outer: 4.5, side: outside}     # from the sea, so only the waterline
  - {op: blur, out: wet_m, src: wet_m, sigma: 1.8}
  - {op: fill, mask: wet_m, material: wet_sand, opacity: 0.8, id: wet_fill}
  - {op: band, out: wet_edge, src: sea_m, inner: 0, outer: 1.5, side: outside}
  - {op: blur, out: wet_edge, src: wet_edge, sigma: 0.6}
  - {op: fill, mask: wet_edge, color: "#7f898b", opacity: 0.35, id: wet_dark}
  # wind ripples in the dry sand: fine dashed contour lines of a stretched noise
  - {op: noise, out: dunes, scale: 5, octaves: 2, stretch: 3, angle: 80, id: dune_noise}   # long ripples, wind off the sea
  - {op: isolines, out: ripples, src: dunes, interval: 0.2}
  - {op: intersect, out: ripples_land, of: [ripples, land]}
  - {op: stroke, src: ripples_land, width: 0.06, dash: [1.6, 0.9], jitter: 0.5, opacity: 0.25, color: "#5d6466"}
  - {op: stipple, mask: land_m, density: 2.5, falloff: null, size: 0.06, opacity: 0.35, color: "#4c5254", id: sand_grit}
  - {op: stipple, mask: wet_m, density: 4, falloff: 2.5, size: 0.07, opacity: 0.4, id: wet_grit}
  # swash marks: the wobbly lines each spent wave leaves on the wet sand
  - {op: offset, out: swash1_o, src: sea, by: 1.1}
  - {op: roughen_geom, out: swash1, src: swash1_o, amount: 0.45, scale: 2.5}
  - {op: stroke, src: swash1, width: 0.07, dash: [3.5, 0.8], jitter: 0.6, color: "#4a5254", opacity: 0.55}
  - {op: offset, out: swash2_o, src: sea, by: 2.4}
  - {op: roughen_geom, out: swash2, src: swash2_o, amount: 0.7, scale: 3}
  - {op: stroke, src: swash2, width: 0.06, dash: [2.5, 1.4], jitter: 0.7, color: "#4a5254", opacity: 0.4}
  - {op: offset, out: swash3_o, src: sea, by: 3.8}
  - {op: roughen_geom, out: swash3, src: swash3_o, amount: 0.9, scale: 3.5}
  - {op: stroke, src: swash3, width: 0.05, dash: [1.8, 2.0], jitter: 0.7, color: "#4a5254", opacity: 0.28}
  # the waterline itself: a medium, wobbling ink line (not the heavy coast stroke)
  - {op: stroke, src: land_m, width: 0.14, opacity: 0.9}                    # the mask's edge: the waterline only
  # surf: a bright broken foam band at the waterline, lace behind it
  - {op: band, out: foam_m, src: land_m, inner: 0, outer: 1.4}
  - {op: noise, out: foam_n, scale: 2.5, octaves: 3, stretch: 2, angle: 100, id: foam_noise}
  - {op: field_to_mask, out: foam_gaps, src: foam_n, lo: -0.4, hi: 0.05}
  - {op: combine, out: foam_m, of: [foam_m, foam_gaps], mode: min}
  - {op: warp, out: foam_m, src: foam_m, amount: 0.5, scale: 2, id: foam_curl}
  - {op: blur, out: foam_m, src: foam_m, sigma: 0.2}
  - {op: fill, mask: foam_m, color: "#eef4f3", opacity: 0.85, id: foam}
  - {op: stipple, mask: foam_m, density: 6, falloff: 1.2, side: outside, size: 0.07, color: "#e8f0f0", opacity: 0.7, id: foam_lace}
  # incoming waves: broken crest lines parallel to the shore, each with a dark trough line on its seaward
  # side (the water's shading), fading and spreading further out
  - {op: offset, out: w1_o, src: land, by: 2.2}
  - {op: roughen_geom, out: w1, src: w1_o, amount: 0.25, scale: 7}
  - {op: stroke, src: w1, width: 0.16, dash: [6.0, 1.0], jitter: 0.6, color: "#e6eff0", opacity: 0.8}
  - {op: offset, out: t1, src: w1, by: 0.3}
  - {op: stroke, src: t1, width: 0.08, dash: [3.0, 2.0], jitter: 0.6, color: "#16262c", opacity: 0.35}
  - {op: offset, out: w2_o, src: land, by: 4.0}
  - {op: roughen_geom, out: w2, src: w2_o, amount: 0.35, scale: 8}
  - {op: stroke, src: w2, width: 0.13, dash: [5.0, 1.6], jitter: 0.7, color: "#dce8ea", opacity: 0.65}
  - {op: offset, out: t2, src: w2, by: 0.3}
  - {op: stroke, src: t2, width: 0.07, dash: [2.4, 2.4], jitter: 0.7, color: "#16262c", opacity: 0.3}
  - {op: offset, out: w3_o, src: land, by: 6.5}
  - {op: roughen_geom, out: w3, src: w3_o, amount: 0.45, scale: 9}
  - {op: stroke, src: w3, width: 0.1, dash: [4.0, 2.2], jitter: 0.7, color: "#d2e0e3", opacity: 0.5}
  - {op: offset, out: w4_o, src: land, by: 9.5}
  - {op: roughen_geom, out: w4, src: w4_o, amount: 0.55, scale: 10}
  - {op: stroke, src: w4, width: 0.08, dash: [3.0, 2.8], jitter: 0.8, color: "#c8d8db", opacity: 0.38}
  - {op: offset, out: w5_o, src: land, by: 13}
  - {op: roughen_geom, out: w5, src: w5_o, amount: 0.65, scale: 11}
  - {op: stroke, src: w5, width: 0.07, dash: [2.4, 3.4], jitter: 0.8, color: "#c8d8db", opacity: 0.28}
  # open water: short fine swell strokes
  - {op: band, out: open_sea, src: land_m, inner: 7, outer: 40}
  - {op: hatch, mask: open_sea, spacing: 1.1, length: 0.8, width: 0.04, lines: 2, angle: 95, angle_jitter: 12,
     color: "#0f1d22", opacity: 0.3, id: swell_hatch}
  # ---- the black stones: scattered on the sand, clustered at the tideline, a few in the shallows
  - {op: scatter, kind: boulder, mask: land_m, density: 0.12, spacing: 6, size: 2.6, size_jitter: 0.45, shadow: 0.5, id: stones_sand}
  - {op: scatter, kind: pebbles, mask: wet_m, region: [[26, 0], [60, 0], [60, 40], [26, 40]], density: 0.9, spacing: 1.8, size: 1.8, shadow: 0.5, id: pebbles_tide}
  - {op: band, out: shallows_m, src: land_m, inner: 0.5, outer: 5}
  - {op: scatter, kind: boulder, mask: shallows_m, density: 0.25, spacing: 5, size: 3.0, size_jitter: 0.5, shadow: 0.3, id: stones_surf}
  - {op: scatter, kind: rubble, mask: wet_m, region: [[26, 0], [60, 0], [60, 40], [26, 40]], density: 0.08, spacing: 7, size: 2.4, shadow: 0.4, id: stone_heaps}
  # ---- dim, cold light
  - {op: fill, color: "#3c4a60", blend: multiply, opacity: 0.55, atmosphere: true, id: dim}
  # ---- the mist: broad banks drifting inland off the sea, curled into wisps by a warp, thickest where it
  # pools round the stones and along the surf; screen-blended so it glows faintly. Marked atmosphere, so
  # `quality` also judges the map beneath it.
  - {op: noise, out: mist_a, scale: 12, octaves: 4, stretch: 2.5, angle: 170, id: mist_a}
  - {op: noise, out: mist_b, scale: 5, kind: billow, octaves: 3, stretch: 3, angle: 165, id: mist_b}
  - {op: mix, out: mist_f, of: [mist_a, mist_b], weights: [0.8, 0.3]}
  - {op: warp, out: mist_f, src: mist_f, amount: 2.5, scale: 6, drift: [-3, 0.5], id: mist_curl}
  - {op: footprints, out: stones_m, kinds: [boulder, rubble]}
  - {op: band, out: stone_pool, src: stones_m, inner: 0.3, outer: 2.2}          # a ring round each stone, not over it
  - {op: blur, out: stone_pool, src: stone_pool, sigma: 0.8}
  - {op: band, out: surf_pool, src: sea_m, inner: 0, outer: 2.0, side: both}
  - {op: blur, out: surf_pool, src: surf_pool, sigma: 1.0}
  - {op: mix, out: mist_f, of: [mist_f, stone_pool, surf_pool], weights: [1, 0.45, 0.15]}
  - {op: field_to_mask, out: mist_m, src: mist_f, lo: -0.3, hi: 0.45}
  - {op: combine, out: mist_m, of: [mist_m, stones_m], mode: sub}                # stones stand up out of it
  - {op: fill, color: "#9fc4cf", blend: screen, opacity: 0.12, atmosphere: true, id: mist_ground}      # a low haze everywhere
  - {op: fill, mask: mist_m, color: "#d4ecf2", blend: screen, opacity: 0.72, atmosphere: true, id: mist_banks}
  - {op: blur, out: mist_glow, src: mist_m, sigma: 3.5}
  - {op: fill, mask: mist_glow, color: "#a6dbe6", blend: screen, opacity: 0.45, atmosphere: true, id: mist_glow}
  - {op: warp, out: wisp_f, src: mist_b, amount: 1.5, scale: 3, drift: [-1.5, 0], id: wisp_curl}
  - {op: field_to_mask, out: wisp_m, src: wisp_f, lo: 0.25, hi: 0.6}
  - {op: fill, mask: wisp_m, color: "#f0fafc", blend: screen, opacity: 0.55, atmosphere: true, id: mist_wisps}
  - {op: finish}
  - {op: vignette, strength: 0.55, start: 0.3, atmosphere: true}
  - {op: compass, at: ne, size: 5}
  - {op: scale_bar, at: nw}
  - {op: title, text: The Pale Strand, position: bottom, size: 2.2}

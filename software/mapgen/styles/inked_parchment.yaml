# inked_parchment: the default mapgen style (docs/DESIGN_mapgen.md §2.5).
#
# A hand-inked dungeon-map look: parchment base, hatched rock beyond the walls,
# textured floors, soft inner shadows, ink lines in three weights, a quiet grid.
# Include it with `include: [styles/inked_parchment.yaml]` and call the macros
# below like ops. Every colour and material here is procedural and original.

palette:
  ink: "#1c1814"
  parchment: "#e7ddc4"
  parchment_dark: "#d6c9a8"
  floor: "#c8c2b5"
  wall: "#8e8778"
  shadow: "#1d1914"
  door: "#efe7d4"
  secret: "#9c2a1f"
  stair: "#d3cbb9"
  grid: "#3a342c"
  water_deep: "#557f8f"
  water_shallow: "#a2bfc5"
  key_red: "#9c2a1f"

ink:
  bold: 0.62
  heavy: 0.42
  medium: 0.24
  fine: 0.1

materials:
  parchment:      {type: ramp_noise, colors: ["#cfc6ad", "#dfd7c2", "#e9e3d1"], scale: 45, octaves: 5, grain: 0.035}
  bedrock:        {type: bedrock_hatch, color: "#d9d0b9", ink: ink, spacing: 2.0, length: 1.7, width: 0.09, lines: 3, mottle: 0.05}
  flagstone:      {type: flagstone, pattern: ashlar, colors: ["#aea89c", "#c9c3b7", "#d6d0c4"], size: 2.5, ratio: 1.5,
                   mortar: 0.12, mortar_color: "#8a8478", bevel: 0.10, mottle: 0.35, grain: 0.05}
  flagstone_irregular: {type: flagstone, pattern: voronoi, colors: ["#958f83", "#ada79a", "#bfb9ac"], size: 2.2,
                   mortar: 0.14, mortar_color: "#6c665b", bevel: 0.14, mottle: 0.3, grain: 0.05}
  wall_stone:     {type: flagstone, pattern: ashlar, colors: ["#847d70", "#9b9486", "#a8a194"], size: 1.25, ratio: 1.7,
                   mortar: 0.1, mortar_color: "#5a544a", bevel: 0.15, mottle: 0.25, grain: 0.04}
  cave_floor:     {type: dirt, colors: ["#958d80", "#b2ab9c", "#cdc7b8", "#d9d4c6"], scale: 11, octaves: 5, contrast: 1.35, grain: 0.07,
                   speckle: 0.06, speckle_color: "#7d7565"}
  cave_rock:      {type: ramp_noise, colors: ["#8f887b", "#a8a193", "#b8b1a3"], scale: 5, octaves: 4, kind: ridged, grain: 0.06}
  wood_floor:     {type: planks, colors: ["#87653f", "#9e7a50", "#ad8a5f"], width: 1.25, length: 7, seam: 0.07,
                   seam_color: "#4a3420", grain: 0.4}
  cobble:         {type: cobble, colors: ["#8b877e", "#a7a297", "#b5b0a5"], size: 1.1, mortar_color: "#5f5a51", dome: 0.3}
  grass:          {type: grass, colors: ["#5a6845", "#707f5a", "#87936e"], scale: 9, speckle: 0.1, tufts: 0.35}
  meadow:         {type: grass, colors: ["#737a5f", "#989e85", "#bcc0aa"], scale: 4, speckle: 0.4, tufts: 2.2, light_tufts: 1.6, grain: 0.09, tuft_color: "#3f4630", tuft_length: 0.65, tuft_width: 0.09}
  thicket:        {type: grass, colors: ["#4f5a46", "#6a7660", "#8a947c"], scale: 3, speckle: 0.5, tufts: 2.6, light_tufts: 1.4, grain: 0.1, tuft_color: "#2f3826", tuft_length: 0.6, tuft_width: 0.09}
  earth:          {type: dirt, colors: ["#d2c7ab", "#e6dfca", "#f9f5ea"], scale: 18, octaves: 5, grain: 0.05, speckle: 0.05}
  dirt_path:      {type: dirt, colors: ["#b7a27a", "#c9b68f", "#d8c9a6"], scale: 6, grain: 0.06, speckle: 0.08}
  water:          {type: water, shallow: water_shallow, deep: water_deep, depth: 4.0, ripples: 1.1, grain: 0.03}
  crystal_floor:  {type: ramp_noise, colors: ["#3b2c39", "#594556", "#7a6274", "#9b8394"], scale: 9, octaves: 5, kind: ridged,
                   contrast: 1.3, grain: 0.09, veins: 0.95, vein_color: "#f4dcea", vein_dark: "#140c12",
                   vein_scale: 5, vein_width: 0.07}
  crystal_wall:   {type: ramp_noise, colors: ["#1f141e", "#3a2636", "#5e3f57"], scale: 3, octaves: 4, kind: ridged,
                   contrast: 1.2, grain: 0.05, veins: 0.6, vein_color: "#c99ab8", vein_scale: 2.5, vein_width: 0.08}
  sea:            {type: water, shallow: "#a9c6c8", deep: "#5d8ea0", depth: 9, ripples: 2.2, ripple_color: "#e6f0ef", grain: 0.03}
  lowland:        {type: grass, colors: ["#8aa060", "#b2bf80", "#dcdcaa"], scale: 12, speckle: 0.4, tufts: 3, grain: 0.1,
                   tuft_length: 0.4, tuft_width: 0.06, tuft_color: "#4c5733", light_tufts: 2.5, light_color: "#eeeccc"}
  upland:         {type: grass, colors: ["#bba875", "#d0c08f", "#e4d8b2"], scale: 8, speckle: 0.4, tufts: 2.4, grain: 0.1,
                   tuft_length: 0.35, tuft_width: 0.06, tuft_color: "#7a6a45", light_tufts: 1.5}
  marsh:          {type: grass, colors: ["#7f907a", "#97a68c", "#aab89d"], scale: 6, speckle: 0.3, tufts: 1.2, grain: 0.06,
                   tuft_length: 0.5, tuft_width: 0.08}
  forest_canopy:  {type: cobble, colors: ["#4f6e40", "#668a4f", "#7fa060"], size: 0.5, mortar_color: "#26361f", dome: 0.5, grain: 0.06}
  field_tilled:   {type: planks, colors: ["#a18a5c", "#b49d6c", "#c4ad7c"], width: 6, length: 2000, angle: 8,
                   seam: 0.7, seam_color: "#7d6a45", grain: 0.5}
  field_green:    {type: planks, colors: ["#8d9c5f", "#a0ae6e", "#b2bd80"], width: 7, length: 2000, angle: -12,
                   seam: 0.7, seam_color: "#6b7848", grain: 0.5}
  town_grass:     {type: ramp_noise, colors: ["#8a9c7c", "#a7b897", "#c7d2b4"], scale: 120, octaves: 5, grain: 0.07}
  garden:         {type: grass, colors: ["#506b3a", "#678448", "#7f9a59"], scale: 8, speckle: 0.08, tufts: 0.3}

defaults:
  grid: {color: grid, alpha: 0.28, weight: 0.05}
  stroke: {color: ink}
  shadow: {color: shadow}
  occlusion: {color: shadow}

macros:
  base:
    doc: "Parchment canvas. Start every map with it (makes the `canvas` layer)."
    params: {}
    steps:
      - {op: canvas, out: canvas, material: parchment, id: base_canvas}

  beyond:
    doc: "Hatched rock in a band `depth` feet beyond the walkable mask `floor` (the classic dungeon-map look)."
    params: {floor: floor, depth: 4, name: beyond}
    steps:
      - {op: band, out: "${name}_band", src: "${floor}", inner: 0, outer: "${depth}"}
      - {op: roughen, out: "${name}_band", src: "${name}_band", amount: 0.8, scale: 3}
      - {op: fill, mask: "${name}_band", material: bedrock, id: "${name}_hatch"}

  floor_fill:
    doc: "Fill a floor geometry with a material, plus soft inner shadow and occlusion; makes mask `${name}`."
    params: {src: room, name: floor, material: flagstone, shadow: 0.45, width: 2.5, falloff: 1.2, hatch: 2.0, cracks: 0.15}
    steps:
      - {op: rasterize, out: "${name}", src: "${src}"}
      - {op: fill, mask: "${name}", material: "${material}", id: "${name}_mat"}
      - {op: occlusion, mask: "${name}", falloff: "${falloff}", strength: 0.3}
      - {op: shadow, mask: "${name}", mode: inner, width: "${width}", offset: [0.6, 0.8], strength: "${shadow}", blur: 0.4}
      - {op: cracks, mask: "${name}", density: "${cracks}", width: 0.07, opacity: 0.6, id: "${name}_cracks"}
      - {op: shade_lines, mask: "${name}", length: "${hatch}", spacing: 0.28, width: 0.09, opacity: 0.85, id: "${name}_hatch"}

  stone_room:
    doc: "A single dressed-stone room from a floor geometry — hatched surround, floor, shadow, stone walls named `${wall}`."
    params: {src: room, name: floor, material: flagstone, wall: wall, thickness: 1.5, depth: 4}
    steps:
      - {op: rasterize, out: "${name}_pre", src: "${src}"}
      - {op: beyond, floor: "${name}_pre", depth: "${depth}", name: "${name}_beyond"}
      - {op: floor_fill, src: "${src}", name: "${name}", material: "${material}"}
      - {op: wall, src: "${src}", name: "${wall}", thickness: "${thickness}", material: wall_stone, weight: heavy}

  cave:
    doc: "A natural cave from a rough polygon geometry — hatched rock beyond, cave floor, rough walls named `${wall}`. `exclude` (a geometry) leaves a mouth open. Use cave_floor + cave_walls separately to draw water or paths between them."
    params: {src: cave, name: floor, material: cave_floor, wall: wall, thickness: 1.2, depth: 5, exclude: null}
    steps:
      - {op: cave_floor, src: "${src}", name: "${name}", material: "${material}", depth: "${depth}"}
      - {op: cave_walls, src: "${src}", wall: "${wall}", thickness: "${thickness}", exclude: "${exclude}"}

  cave_floor:
    doc: "First half of `cave` — hatched rock beyond and the cave floor (mask `${name}`)."
    params: {src: cave, name: floor, material: cave_floor, depth: 5}
    steps:
      - {op: rasterize, out: "${name}_pre", src: "${src}"}
      - {op: beyond, floor: "${name}_pre", depth: "${depth}", name: "${name}_beyond"}
      - {op: floor_fill, src: "${src}", name: "${name}", material: "${material}", shadow: 0.5, width: 5, falloff: 2.2,
         hatch: 3.0, cracks: 0.25}
      - {op: stipple, mask: "${name}", density: 6, falloff: 2.5, size: 0.08, opacity: 0.55, id: "${name}_grit"}
      - {op: scatter, kind: pebbles, mask: "${name}", density: 0.5, spacing: 3, size: 1.2, shadow: 0.15, id: "${name}_pebbles"}

  cave_walls:
    doc: "Second half of `cave` — rough rock walls named `${wall}` (heavy inner ink, fine outer)."
    params: {src: cave, wall: wall, thickness: 1.2, exclude: null}
    steps:
      - {op: wall, src: "${src}", name: "${wall}", style: rough, thickness: "${thickness}", material: cave_rock,
         weight: bold, outer_weight: fine, exclude: "${exclude}"}

  stream:
    doc: "Water along a smoothed path `width` feet wide, clipped to the walkable mask `clip`, with an inked bank; makes mask `${name}`."
    params: {points: [[0, 0], [10, 10]], width: 6, name: stream, clip: floor}
    steps:
      - {op: path, out: "${name}_g", points: "${points}", width: "${width}", smooth: 3}
      - {op: roughen_geom, out: "${name}_g", src: "${name}_g", amount: 0.5, scale: 5}
      - {op: rasterize, out: "${name}_raw", src: "${name}_g"}
      - {op: combine, out: "${name}", of: ["${name}_raw", "${clip}"], mode: min}
      - {op: fill, mask: "${name}", material: water, id: "${name}_water"}
      - {op: path, out: "${name}_c", points: "${points}", smooth: 3, line: true}
      - {op: roughen_geom, out: "${name}_c", src: "${name}_c", amount: 0.4, scale: 6}
      - {op: rasterize, out: "${name}_flow", src: "${name}_c", line_width: 0.14}
      - {op: shrink, out: "${name}_inner", src: "${name}", by: 0.8}
      - {op: combine, out: "${name}_flow", of: ["${name}_flow", "${name}_inner"], mode: min}
      - {op: fill, mask: "${name}_flow", color: "#eef4f4", opacity: 0.7}
      - {op: shade_lines, mask: "${name}", length: 1.0, spacing: 0.22, width: 0.07, color: "#1f3a45", opacity: 0.75,
         shadow: null, id: "${name}_bank"}
      - {op: stroke, src: "${name}", weight: medium, opacity: 0.9}

  ground_patches:
    doc: "Noise-shaped patches of a material over the ground, edged with a dashed ink contour (the hand-drawn terrain look). Makes mask `${name}`."
    params: {name: patches, material: meadow, scale: 14, cover: 0.0, edge: 0.06, avoid: null}
    steps:
      - {op: noise, out: "${name}_n", scale: "${scale}", id: "${name}_noise"}
      - {op: field_to_mask, out: "${name}", src: "${name}_n", lo: "${cover}", hi: "${cover}"}
      - {op: trace, out: "${name}_g", src: "${name}", simplify: 0.2, min_area: 20}
      - {op: roughen_geom, out: "${name}_g", src: "${name}_g", amount: 0.5, scale: 3, id: "${name}_rough"}
      - {op: rasterize, out: "${name}", src: "${name}_g"}
      - {op: fill, mask: "${name}", material: "${material}", id: "${name}_fill"}
      - {op: stroke, src: "${name}_g", width: "${edge}", dash: [1.4, 0.6, 0.25, 0.6], jitter: 0.6, opacity: 0.9}
      - {op: offset, out: "${name}_in", src: "${name}_g", by: -0.9}
      - {op: stroke, src: "${name}_in", width: "${edge}", dash: [0.9, 1.4], jitter: 0.7, opacity: 0.7}

  brush:
    doc: "Dense undergrowth masses inside mask `within`, minus `clear`: dark fill, drop shadow, heavy outline and an outer dashed contour. Makes mask `${name}`."
    params: {name: brush, within: edges, clear: clear, scale: 9, cover: 0.0}
    steps:
      - {op: noise, out: "${name}_n", scale: "${scale}", id: "${name}_noise"}
      - {op: field_to_mask, out: "${name}", src: "${name}_n", lo: "${cover}", hi: "${cover}"}
      - {op: combine, out: "${name}", of: ["${name}", "${within}"], mode: min}
      - {op: combine, out: "${name}", of: ["${name}", "${clear}"], mode: sub}
      - {op: trace, out: "${name}_g", src: "${name}", simplify: 0.2, min_area: 12}
      - {op: roughen_geom, out: "${name}_g", src: "${name}_g", amount: 0.45, scale: 1.6, id: "${name}_rough"}
      - {op: rasterize, out: "${name}", src: "${name}_g"}
      - {op: shadow, mask: "${name}", mode: drop, offset: [0.6, 0.7], blur: 0.7, strength: 0.45}
      - {op: fill, mask: "${name}", material: thicket, id: "${name}_fill"}
      - {op: shadow, mask: "${name}", mode: inner, width: 2.2, offset: [-0.4, -0.5], strength: 0.45, blur: 0.5}
      - {op: shade_lines, mask: "${name}", length: 1.4, spacing: 0.3, width: 0.06, color: "#26301f", opacity: 0.6,
         id: "${name}_hatch"}
      - {op: stroke, src: "${name}_g", weight: heavy, roughness: 0.15}
      - {op: offset, out: "${name}_halo", src: "${name}_g", by: 1.1}
      - {op: stroke, src: "${name}_halo", width: 0.16, dash: [1.2, 0.5, 0.25, 0.5], jitter: 0.6, opacity: 0.95}

  coastline:
    doc: "Ink a coast (a land geometry): heavy shoreline, a pale shallows band and offshore wave lines."
    params: {land: land, name: coast, waves: 3, spacing: 0.9}
    steps:
      - {op: rasterize, out: "${name}_land", src: "${land}"}
      - {op: band, out: "${name}_shallows", src: "${name}_land", inner: 0, outer: 2.5}
      - {op: blur, out: "${name}_shallows", src: "${name}_shallows", sigma: 0.8}
      - {op: fill, mask: "${name}_shallows", color: "#cfe0dc", opacity: 0.55}
      - {op: offset, out: "${name}_w1", src: "${land}", by: "${spacing}"}
      - {op: stroke, src: "${name}_w1", width: 0.12, opacity: 0.7, color: "#3d6475"}
      - {op: offset, out: "${name}_w2", src: "${land}", by: 2.0}
      - {op: stroke, src: "${name}_w2", width: 0.1, dash: [1.5, 0.8], jitter: 0.4, opacity: 0.5, color: "#3d6475"}
      - {op: offset, out: "${name}_w3", src: "${land}", by: 3.4}
      - {op: stroke, src: "${name}_w3", width: 0.08, dash: [1.0, 1.4], jitter: 0.5, opacity: 0.35, color: "#3d6475"}
      - {op: offset, out: "${name}_w4", src: "${land}", by: 5.0}
      - {op: stroke, src: "${name}_w4", width: 0.07, dash: [2.4, 1.2], jitter: 0.5, opacity: 0.3, color: "#3d6475"}
      - {op: offset, out: "${name}_w5", src: "${land}", by: 7.0}
      - {op: stroke, src: "${name}_w5", width: 0.07, dash: [3.0, 1.8], jitter: 0.5, opacity: 0.25, color: "#3d6475"}
      - {op: invert, out: "${name}_sea", src: "${name}_land"}
      - {op: hatch, mask: "${name}_sea", spacing: 0.7, length: 1.1, width: 0.05, lines: 2, angle: 90, angle_jitter: 25,
         color: "#2f5566", opacity: 0.45, id: "${name}_sea_hatch"}
      - {op: rasterize, out: "${name}_landm", src: "${land}"}
      - {op: shade_lines, mask: "${name}_landm", side: outside, length: 0.9, spacing: 0.35, width: 0.05, shadow: null,
         color: "#2f5566", opacity: 0.55, id: "${name}_shore_hatch"}
      - {op: stroke, src: "${land}", weight: heavy}

  forest_mass:
    doc: "A forest drawn as a mass of tree crowns: canopy texture, drop shadow, inked scalloped edge. `src` is a polygon geometry."
    params: {src: forest, name: forest}
    steps:
      - {op: roughen_geom, out: "${name}_g", src: "${src}", amount: 0.35, scale: 1.2, id: "${name}_rough"}
      - {op: rasterize, out: "${name}", src: "${name}_g"}
      - {op: shadow, mask: "${name}", mode: drop, offset: [0.3, 0.4], blur: 0.4, strength: 0.5}
      - {op: fill, mask: "${name}", material: forest_canopy, id: "${name}_canopy"}
      - {op: shadow, mask: "${name}", mode: inner, width: 1.2, offset: [-0.3, -0.3], strength: 0.35}
      - {op: shade_lines, mask: "${name}", length: 1.0, spacing: 0.3, width: 0.06, color: "#1d2a17", opacity: 0.6,
         id: "${name}_hatch"}
      - {op: stroke, src: "${name}_g", weight: medium}

  mountain_range:
    doc: "Mountain glyphs wherever height field `src` is above `level` (inside `within`), drawn north to south."
    params: {src: height, level: 0.6, within: land_m, name: mountains, size: 4, density: 1.2, spacing: 2.6}
    steps:
      - {op: field_to_mask, out: "${name}_m", src: "${src}", lo: "${level}", hi: "${level}"}
      - {op: combine, out: "${name}_m", of: ["${name}_m", "${within}"], mode: min}
      - {op: grow, out: "${name}_mass", src: "${name}_m", by: 1.2}
      - {op: blur, out: "${name}_mass", src: "${name}_mass", sigma: 1.0}
      - {op: fill, mask: "${name}_mass", color: "#8a7558", opacity: 0.55, blend: multiply, id: "${name}_shade"}
      - {op: hatch, mask: "${name}_mass", spacing: 0.9, length: 1.0, width: 0.06, lines: 3, angle: 60, angle_jitter: 30,
         color: "#4a3c2c", opacity: 0.5, id: "${name}_hatch"}
      - {op: scatter, kind: mountain, mask: "${name}_m", density: "${density}", spacing: "${spacing}", size: "${size}",
         size_jitter: 0.3, rotate_jitter: 0, shadow: 0.3, sort_y: true, id: "${name}_glyphs"}

  finish:
    doc: "Parchment grain, a light vignette and a double frame. No grid: the VTT draws its own (add {op: grid} if a printed grid is wanted)."
    params: {floor: floor, alpha: 0.28}
    steps:
      - {op: paper, strength: 0.12, scale: 40}
      - {op: vignette, strength: 0.18}
      - {op: frame, margin: 0.5, weight: 0.35}

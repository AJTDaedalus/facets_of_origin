# Continuity bible for Oraga Night, 5e edition (DESIGN_oraga_5e_review_fixes §2, task R0.1).
#
# One entry per load-bearing fact. `truth` is the TARGET truth after the owner rulings of
# 2026-10-08 (QR1–QR7) and the Planner decisions O28 and O32–O40. It is not a description
# of the current text: the first run of tools/fact_check.py lists every place the text
# still disagrees, and that list is the R2 worklist.
#
# `phrases` are the forms that express the fact (for a human reader; the checker does not
# need them). `checks` are what tools/fact_check.py runs:
#
#   forbid    pattern                     a phrasing that contradicts the fact
#   sentence  all: [regex, ...]           every regex in one sentence (scope: block = paragraph
#                                         or table row) contradicts the fact
#   count     noun, window, allowed       a number within `window` words before `noun` must be
#                                         one of `allowed` (noun windows avoid false positives)
#   size      subject, window, allowed    a measurement "N feet DIM" / "N-foot DIM" within
#                                         `window` characters after `subject` must be listed
#                                         for its DIM (dims not listed are ignored)
#   movement  subject, from               a Movement reference in the same sentence (table row)
#                                         as `subject` must not start before Movement `from`
#   require   pattern, file, anchor       `pattern` must appear in `file`; reported at `anchor`
#   rule_copy home, elements, max         a rule printed once (O36): a paragraph, list item or
#                                         table row outside the `home` file that matches more
#                                         than `max` (default 2) of the rule's `elements` is a
#                                         full restatement; outside copies are pointers plus
#                                         their local rule only
#
# Every check takes optional `files` (basename prefixes it applies to), `unless` (a regex
# that, found in the same sentence/block, cancels the hit) and `why`.
# Not scanned: INVENTIONS_5e.md and STYLE_5e.md (the same exclusions as the linter).

version: 1

facts:

  - id: household
    truth: >-
      The household was sixty. Twenty-two stayed (about two dozen). The staff was cut by
      nearly two-thirds. Nobody prints "four-fold" or a derived count of servants let go.
    source: owner QR1 (2026-10-08); O31
    phrases: ["The household was sixty", "Twenty-two", "two dozen staff", "cut by nearly two-thirds"]
    checks:
      - type: forbid
        pattern: '\bfour-?fold\b'
        why: QR1 — say "cut by nearly two-thirds"; sixty cut four-fold is 15, not 22
      - type: count
        noun: '\b(?:servants(?! of)|household|staff)\b'
        window: 3
        allowed: [60, 22, 24]
        why: QR1 — the household numbers are sixty, twenty-two, about two dozen

  - id: honor_guards
    truth: >-
      House Boranis has nine honor guards. At midnight two of them hold the east-wing doors
      (B9) and seven go to the dais. Positions in Movements I–V are chapter VIII's
      Table VIII–7 (R2.2, O48): all nine on the gate while the line comes in; from then
      on two at the east-wing doors (four in Movement V, when Corval doubles them), three
      in the trophy gallery (B7), and the rest with the household. S4's "two guards" are
      "the two nearest". If the wing was forced, it stays doubled all night (04 "When the
      east wing is forced"): at midnight four hold the east-wing doors and five go to the
      dais (L-085, T7.19).
    source: owner QR2 (2026-10-08); O48 (the Movement I–V posts)
    phrases: ["nine honor guards", "seven of the nine go to the dais", "two hold the east-wing doors", "Table VIII–7"]
    positions:
      movement_I: all nine on the gate (B1), facing inward, while the line comes in; then as Movement II
      movements_II_to_IV: {east_wing_doors: 2, trophy_gallery: 3, with_the_household: 4}
      movement_V: {east_wing_doors: 4, trophy_gallery: 3, with_the_household: 2}
      midnight: {dais: 7, east_wing_doors: 2}
      midnight_if_forced: {dais: 5, east_wing_doors: 4}
    checks:
      - type: require
        file: 08_Handouts.md
        pattern: '\| Two, who stay; four if the wing was forced \|'
        anchor: 'Table VIII–7'
        why: L-085 — a forced wing stays doubled at midnight (Table VIII–7)
      - type: sentence
        scope: block
        all: ['\bnine\b(?!\s+people)', '\bdais\b']
        unless: '(?i)\bseven\b'
        why: QR2 — seven go to the dais; two of the nine stay at the east-wing doors
      - type: forbid
        pattern: '\bonly guards left are dying on the dais\b'
        why: QR2 — two guards are still at the east-wing doors
      - type: sentence
        all: ['\bS4\b', '\btwo guards\b']
        unless: '\bnearest\b'
        why: QR2 / P1-2 — S4's guards are "the two nearest" of the nine

  - id: retinues
    truth: >-
      Each faction brought a retinue inside the ball. The Merchant's Circle brought four
      Circle Hired Knives and the Church four Church Wardens (QR3). The others keep their
      INVENTIONS #1 sizes: Draunel three Duelists, Boranis three Cousin's Blades, Phern two
      or three Bodyguards, the Thenya two or three Border Slingers.
    source: owner QR3 (2026-10-08); INVENTIONS #1
    sizes: {circle: 4, church: 4, draunel: 3, boranis: 3, phern: "2–3", thenya: "2–3"}
    phrases: ["four **Circle Hired Knives**", "four **Church Wardens**", "Kovaun brought four"]
    checks:
      - type: sentence
        all: ['\bbrought\b', '\b(?:two|three|five|2|3|5)\s+(?:\*\*)?(?:Circle Hired Knives|Church Wardens)\b']
        why: QR3 — the Circle and the Church each brought four
      - type: forbid
        pattern: '\b(?:Kovaun|Callun|the Circle|the Church) brought (?:two|three|five)\b'
        why: QR3 — the Circle and the Church each brought four
      - type: sentence
        all: ['\bbrought\b', '\b(?:two|four|five)\s+(?:\*\*)?(?:Draunel Duelists|Boranis Cousin.s Blades)\b']
        why: INVENTIONS #1 — Draunel and Boranis brought three each

  - id: bought_company
    truth: >-
      The Bought company is 16 Bought Blades, 4 sergeants and 1 captain: 21 in all, so
      "twenty blades" and "twenty sworn witnesses". Four Blades hold the gatehouse and
      twelve the perimeter.
    source: owner QR4 (2026-10-08); 05 B12 "The contract"
    size: {blades: 16, sergeants: 4, captain: 1, total: 21}
    phrases: ["sixteen **Bought Blades**, four sergeants and a captain", "twenty blades", "twenty sworn witnesses"]
    checks:
      - type: sentence
        all: ['\bforty (?:blades|sworn witnesses)\b']
        unless: '\bshould field\b'
        why: QR4 — the company is 21, so "twenty"; (the honor guard's "should field forty blades" is a different claim)
      - type: count
        noun: '\b(?:\*\*)?Bought Blades\b'
        window: 2
        allowed: [16, 4, 12]
        why: QR4 — sixteen Blades (four at the gatehouse, twelve on the perimeter)

  - id: arrivals
    truth: >-
      The Attendant has been at the ball since Movement I; it came in with the early guests
      (O35). The Uninvited arrive with the Movement III crush, so no Uninvited tell or
      sighting comes before Movement III. Master Vell is in the receiving line in Movement I
      and nobody sees him arrive. The Bought walked into the trade district at dusk and hold
      the gatehouse from the first bell of midnight.
    source: O35; 07 "They arrive with the Movement III crush"; 04 Movement I (Vell); 10 Bought Blade
    movements: {attendant: I, uninvited: III, vell: I, bought: "dusk; the gate from the first bell of midnight"}
    phrases: ["It came in with the early guests", "They arrive with the Movement III crush"]
    checks:
      - type: sentence
        all: ['\bat midnight\b', '\bcomes? through with the Uninvited\b']
        why: O35 — the Attendant has been at the ball since Movement I
      - type: movement
        subject: '\b(?:the )?(?:Uninvited|Wept|Radiant|Hollow)\b'
        from: III
        why: the Uninvited arrive with the Movement III crush; Table V–6's tells start at Movement III
      - type: sentence
        all: ['\bVell\b', '\barriv\w* (?:at midnight|with the Uninvited)\b']
        why: Vell is at the ball from Movement I
      - type: sentence
        all: ['\bBought\b', '\barriv\w* (?:in|during) Movement (?:I|II|III|IV|V)\b']
        why: the Bought are outside the walls until the bells of midnight

  - id: east_wing_floor
    truth: >-
      The Crystal Court (B2) is at ground level. The east wing (B9) is upstairs, at gallery
      level (12 feet up): the Court's east doors open on a stair that rises 12 feet, and
      O28's cleared corridor (10 × 60 feet) runs at gallery level to the wing's double doors.
      B8 is in the dark wing on the second floor.
    source: O33
    floors: {B2: ground, B3: "gallery, 12 ft", B8: "second floor (dark wing)", B9: "gallery level, 12 ft"}
    phrases: ["second floor, dark wing", "a stair that rises 12 feet", "at gallery level"]
    checks:
      - type: require
        file: 05_The_Longest_Night.md
        pattern: '(?:east doors|east wing)[^\n]{0,300}?(?:rises 12 feet|12 feet up|gallery level)'
        anchor: '\*The east wing \(B9\)\*'
        why: O33 — General Features must say the wing is up a 12-foot stair, at gallery level
      - type: sentence
        all: ['\beast wing\b', '\b(?:ground floor|ground level|same level as the Court)\b']
        unless: '\bCourt is at ground level\b'
        why: O33 — the east wing is upstairs

  - id: stairs
    truth: >-
      The east wing's private stair IS the garden stair: it runs down the wing's outer wall
      to the upper terrace. A separate stair rises 12 feet from the Court's east doors to the
      gallery-level corridor. Each terrace has a stair at either end.
    source: O33; O28
    phrases: ["the private stair (the garden stair)", "down the garden stair"]
    checks:
      - type: require
        file: 05_The_Longest_Night.md
        pattern: '(?:private stair[^.\n]{0,60}garden stair|garden stair[^.\n]{0,60}private stair)'
        anchor: 'private stair to the garden'
        why: O33 — name the private stair as the garden stair where the wing is described

  - id: gallery_geometry
    truth: >-
      L-032, T8.1 (TPN-52), following the palace brief §1.4–§1.5 and §7 item 4 (TP64). The
      banquet galleries (B3) are a mezzanine over a floor-level aisle: under each gallery,
      behind the row of piers that carries it, an aisle 20 feet deep runs at ground level.
      The two doors in the Court's west wall open from that aisle at floor level: the double
      door to the Audience Hall (B4) and the 5-foot gallery-side service door (card S11).
      Two stairs, one in each aisle at the main-doors end, climb 12 feet to the galleries
      and to the musicians' gallery over the main doors. The galleries run the Court's full
      length, so they look down on the dais (the toast; Table V–2's "Over the rail"). The
      east wing's corridor cannot be seen from a gallery: the stair and the cleared corridor
      run behind the east gallery's outer wall, which has no door to them.
    source: L-032; T8.1; palace brief §1.4–§1.5 and §7 item 4 (TP64)
    maps: {aisle_deep: 20, gallery_stairs: 2, stair_rise: 12, musicians_gallery_deep: 15}
    phrases: ["a mezzanine over a floor-level aisle", "look down on the dais", "at floor level"]
    checks:
      - type: require
        file: 05_The_Longest_Night.md
        pattern: 'mezzanine over a floor-level aisle'
        anchor: '\*The Crystal Court \(B2\)\*'
        why: L-032 — General Features says the galleries are a mezzanine with floor-level doors
      - type: require
        file: 04_The_Ball.md
        pattern: 'look down on the dais'
        anchor: 'The banquet is called, and the galleries fill'
        why: L-032 — the toast's sightline works because the galleries overlook the dais
      - type: require
        file: 09_The_Snakes.md
        pattern: 'service door at floor level'
        anchor: 'S11. The Phern Door'
        why: L-032 — the crowd on the floor can reach S11's door
      - type: forbid
        pattern: '(?i)\bguard change\b[^.|\n]{0,40}\bgallery rail\b'
        why: L-032 — the east wing's corridor is behind the east gallery's wall, out of its sight
      - type: forbid
        pattern: '(?i)\bwalk the gallery toward the east wing\b'
        why: L-032 — no door joins a banquet gallery to the cleared corridor

  - id: second_floor
    truth: >-
      T8.1 / T8.3 (L-062), following the palace brief §1.5 and §7 item 9 (TP64): "second
      floor" is the storey above the ground floor, in the American sense. The banquet
      galleries and the east wing are on it, at gallery level (12 feet up), and so is the dark
      wing with Raunu's study (B8), which has no door to the galleries. S10's lit window is
      an east-wing window at gallery level; the garden below the wing lies a little below the
      Court, so the wall from that garden to the window is the card's 20 feet.
    source: L-062; T8.1; T8.3; palace brief §1.5 and §7 item 9 (TP64)
    maps: {window_sill: 3, garden_below_court: 5, wall: 20}
    phrases: ["gallery level, 12 feet up: the second floor", "an east-wing window at gallery level"]
    checks:
      - type: require
        file: 05_The_Longest_Night.md
        pattern: 'at gallery level, 12 feet up: the second floor'
        anchor: '\*\*Elevations\.\*\*'
        why: L-062 — General Features says gallery level is the second floor
      - type: require
        file: 09_The_Snakes.md
        pattern: 'east-wing window at gallery level'
        anchor: 'S10. Over the Wall'
        why: L-062 — S10's terrain places the window, and the garden below it
      - type: sentence
        all: ['(?i)\bsecond floor\b', '(?i)\b(?:above|over) the (?:banquet )?galler(?:y|ies)\b']
        why: L-062 — the second floor is gallery level, not a storey above the galleries

  - id: terraces
    truth: >-
      Three garden terraces (B5), each about 40 feet deep and 120 feet wide, step down from
      the Court's garden doors with 10-foot balustrade drops; then about 150 feet of lower
      garden to the river gate. S9's duel is on the upper terrace, watched from the rail of
      the Court's garden walk above it. Vell at the river gate is "down at the river gate",
      not "two terraces below".
    source: O28; O34
    phrases: ["below the rail of the Court's garden walk", "down at the river gate"]
    checks:
      - type: forbid
        pattern: '(?i)\btwo terraces below\b'
        why: O34 — the river gate is 150 feet past the lowest terrace; say "down at the river gate"
      - type: forbid
        pattern: '\brail of the upper terrace\b'
        why: O34 — the crowd watches from the rail of the Court's garden walk, above the upper terrace


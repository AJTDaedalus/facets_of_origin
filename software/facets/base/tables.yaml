  - id: npc_traits
    name: "NPC Traits"
    die: "d66"
    pillar: npc
    use: "The one thing the party will remember about someone. Say it in the first sentence you describe them."
    entries:
      - {roll: "11", text: "Talks with their hands, and the hands are always holding something."}
      - {roll: "12", text: "Laughs a beat too late at everything."}
      - {roll: "13", text: "Wears far too much jewelry, all of it real."}
      - {roll: "14", text: "Never sits with their back to a door."}
      - {roll: "15", text: "Smells of woodsmoke and horses."}
      - {roll: "16", text: "Corrects everyone's pronunciation, gently, every time."}
      - {roll: "21", text: "Keeps one bandaged hand out of sight."}
      - {roll: "22", text: "Whistles the same four notes over and over."}
      - {roll: "23", text: "Eats constantly and neatly from a paper bag."}
      - {roll: "24", text: "Tall, stooped, and apologetic about the ceiling."}
      - {roll: "25", text: "Speaks in a whisper that makes everyone lean in."}
      - {roll: "26", text: "Wears mourning colors, freshly dyed."}
      - {roll: "31", text: "Missing a front tooth, and proud of how it happened."}
      - {roll: "32", text: "Ink stains up to both elbows."}
      - {roll: "33", text: "Cheerfully rude to anyone with a title."}
      - {roll: "34", text: "Carries a small and furious dog."}
      - {roll: "35", text: "Answers every question with a question."}
      - {roll: "36", text: "Remembers everyone's name after hearing it once."}
      - {roll: "41", text: "Keeps glancing at the sky."}
      - {roll: "42", text: "Dressed for somewhere much grander than here."}
      - {roll: "43", text: "Walks with a cane they very obviously don't need."}
      - {roll: "44", text: "Knits through every conversation without looking down."}
      - {roll: "45", text: "Counts coins when nervous, which is often."}
      - {roll: "46", text: "Quotes proverbs, most of them made up on the spot."}
      - {roll: "51", text: "Scarred knuckles and a gentle voice."}
      - {roll: "52", text: "Always slightly damp."}
      - {roll: "53", text: "Hums under their breath whenever they lie."}
      - {roll: "54", text: "Wears a hat whose feather has seen better years."}
      - {roll: "55", text: "Stares hard at anyone carrying a weapon."}
      - {roll: "56", text: "Sneezes whenever magic is worked nearby."}
      - {roll: "61", text: "Has an enormous laugh and uses it as a weapon."}
      - {roll: "62", text: "Checks a small notebook before answering anything."}
      - {roll: "63", text: "Treats the party like old friends from the first word."}
      - {roll: "64", text: "Pauses a long time before every answer."}
      - {roll: "65", text: "Barefoot, whatever the weather."}
      - {roll: "66", text: "Looks exactly like someone the party has already met."}

  - id: npc_wants
    name: "NPC Wants"
    die: "d66"
    pillar: npc
    use: "What someone is working toward, beyond this scene. Every NPC who comes back needs one."
    entries:
      - {roll: "11", text: "To buy back the family land."}
      - {roll: "12", text: "To be named heir ahead of a sibling."}
      - {roll: "13", text: "To leave town without anyone noticing."}
      - {roll: "14", text: "To clear a dead friend's name."}
      - {roll: "15", text: "To marry for love against everyone's advice."}
      - {roll: "16", text: "To be paid what they're owed, all of it."}
      - {roll: "21", text: "To find whoever sold them out."}
      - {roll: "22", text: "To learn to read, without anyone finding out they can't."}
      - {roll: "23", text: "To open a shop of their own."}
      - {roll: "24", text: "To be forgiven by one particular person."}
      - {roll: "25", text: "To see the sea, or the mountains, just once."}
      - {roll: "26", text: "To keep their child out of trouble."}
      - {roll: "31", text: "To win a contest everyone says is rigged."}
      - {roll: "32", text: "To get a rival thrown out of their guild."}
      - {roll: "33", text: "To publish a book that nobody wants published."}
      - {roll: "34", text: "To pay for a sibling's cure."}
      - {roll: "35", text: "To find a lost pet that matters more than they're letting on."}
      - {roll: "36", text: "To retire before the next master takes over."}
      - {roll: "41", text: "To go adventuring, like the party."}
      - {roll: "42", text: "To get their name in the records for something, anything."}
      - {roll: "43", text: "To sell a secret to the highest bidder."}
      - {roll: "44", text: "To see the party gone before trouble follows them in."}
      - {roll: "45", text: "To build something that will outlast them."}
      - {roll: "46", text: "To bury someone properly."}
      - {roll: "51", text: "To win back someone they lost."}
      - {roll: "52", text: "To be kept well out of whatever the party is doing."}
      - {roll: "53", text: "To free someone held for a debt."}
      - {roll: "54", text: "To stop a wedding."}
      - {roll: "55", text: "To find the place in an old story."}
      - {roll: "56", text: "To break a bad habit, with help."}
      - {roll: "61", text: "To get even with someone powerful."}
      - {roll: "62", text: "To keep a promise made to the dead."}
      - {roll: "63", text: "To hide something until spring."}
      - {roll: "64", text: "To become someone else entirely."}
      - {roll: "65", text: "To start a feud they'll come to regret."}
      - {roll: "66", text: "To protect the town from something only they believe in."}

  - id: npc_secrets
    name: "NPC Secrets"
    die: "1d20"
    pillar: npc
    use: "What someone isn't saying. Decide it before they speak, even if it never comes out."
    entries:
      - {roll: "1", text: "They owe money to someone dangerous."}
      - {roll: "2", text: "They aren't who they say they are, and the real one is dead or missing."}
      - {roll: "3", text: "They saw the crime and said nothing."}
      - {roll: "4", text: "They're informing for someone: the watch, a rival, a guild."}
      - {roll: "5", text: "They're hiding a fugitive in their home."}
      - {roll: "6", text: "They stole the thing everyone is looking for, and regret it."}
      - {roll: "7", text: "They're in love with someone they shouldn't be."}
      - {roll: "8", text: "They can work a little magic, and hide it."}
      - {roll: "9", text: "They've been paid to slow the party down."}
      - {roll: "10", text: "They know a way in that everyone else has forgotten."}
      - {roll: "11", text: "They're dying, and have told no one."}
      - {roll: "12", text: "They set the fire."}
      - {roll: "13", text: "Their famous deed was somebody else's."}
      - {roll: "14", text: "They send money to someone the town counts as an enemy."}
      - {roll: "15", text: "They forged the document everyone is relying on."}
      - {roll: "16", text: "They're leaving tonight, for good."}
      - {roll: "17", text: "Their family is not what it claims to be."}
      - {roll: "18", text: "They know the party's employer, and don't trust them."}
      - {roll: "19", text: "They're afraid of something in their own cellar."}
      - {roll: "20", text: "They wrote the anonymous letter."}


  - {op: window, wall: w_shops, at: [88, 32.5], width: 3}
  - {op: window, wall: w_shops, at: [88, 57.5], width: 3}
  - {op: window, wall: w_hall, at: [36, 36], width: 3}
  - {op: window, wall: w_hall, at: [63, 60.5], width: 3}
  # ---- guest wing: a corridor with three rooms north and two south, a landing down to the hall
  - {op: path, out: g_north, points: [[40, 16], [74, 16]], line: true}
  - {op: partition, src: g_north, name: p_gn, thickness: 0.6, material: wall_timber}
  - {op: path, out: g_south, points: [[40, 20], [52, 20]], line: true}
  - {op: partition, src: g_south, name: p_gs1, thickness: 0.6, material: wall_timber}
  - {op: path, out: g_south2, points: [[62, 20], [74, 20]], line: true}
  - {op: partition, src: g_south2, name: p_gs2, thickness: 0.6, material: wall_timber}
  - {op: path, out: g_v0, points: [[51.3, 8], [51.3, 16]], line: true}
  - {op: partition, src: g_v0, name: p_gv0, thickness: 0.6, material: wall_timber}
  - {op: path, out: g_v1, points: [[62.7, 8], [62.7, 16]], line: true}
  - {op: partition, src: g_v1, name: p_gv1, thickness: 0.6, material: wall_timber}
  - {op: path, out: g_s0, points: [[52, 20], [52, 27]], line: true}
  - {op: partition, src: g_s0, name: p_gsv0, thickness: 0.6, material: wall_timber}
  - {op: path, out: g_s1, points: [[62, 20], [62, 27]], line: true}
  - {op: partition, src: g_s1, name: p_gsv1, thickness: 0.6, material: wall_timber}
  - {op: door, wall: p_gn, at: [45.5, 16], width: 3}
  - {op: door, wall: p_gn, at: [57, 16], width: 3}
  - {op: door, wall: p_gn, at: [68.5, 16], width: 3}
  - {op: door, wall: p_gs1, at: [46, 20], width: 3}
  - {op: door, wall: p_gs2, at: [68, 20], width: 3}
  # ---- shop wing: four stalls off a north-south aisle, split by low partitions
  - {op: path, out: st0, points: [[78, 45], [84, 45]], line: true}
  - {op: partition, src: st0, name: p_st0, thickness: 0.5, material: blue_planks}
  - {op: path, out: st1, points: [[92, 45], [98, 45]], line: true}
  - {op: partition, src: st1, name: p_st1, thickness: 0.5, material: blue_planks}
  # ---- line-work on the floors: hatching inside the north and west walls of every wing
  - {op: union, out: floors, of: [tavern, kitchen, hall, guest, shops, back]}
  - {op: rasterize, out: floors_m, src: floors}
  - {op: shade_lines, mask: floors_m, side: inside, length: 1.6, spacing: 0.32, width: 0.04, opacity: 0.55}
  # ---- old tavern: a hearth on the west wall, the original bar, a few heavy tables

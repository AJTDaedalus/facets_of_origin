  - id: party_baseline
    truth: >-
      Three 4th-level characters are the printed baseline (TP10); four, and five at 5th, are
      adjustment lines. At three: 20 damage to one Uninvited in a round is a lump of Delay
      (30 at four); the Wept reaches Raunu on her 4th turn of moving toward him (her 3rd at
      four); the Radiant reaches the garden stair at the fall + 3 beats; the Attendant has
      178 HP (229 at four). A four-player value may appear only on its adjustment line.
    source: owner TP10 (2026-10-20); DESIGN_oraga_5e_3p_pass §2.2, §3.2, §4; ledger L-022
    values: {lump: {three: 20, four: 30}, wept_turn: {three: 4, four: 3}, radiant_stair: "fall + 3 beats", attendant_hp: {three: 178, four: 229}}
    phrases: ["20 damage in a round", "on her fourth turn", "178 Hit Points", "With four characters"]
    checks:
      - type: sentence
        all: ['\b30(?:\+| or more)? damage\b|\b30-damage\b']
        unless: '(?i)\bfour\b'
        why: TP10 — the lump is 20 at three; 30 belongs on the four-player line
      - type: sentence
        all: ['\bWept\b|\bShe\b|\bshe\b', '\bthird turn\b']
        unless: '(?i)\bfour\b'
        why: TP10 — the Wept reaches Raunu on her 4th turn at three; the 3rd is the four-player line
      - type: sentence
        all: ['\b229\b']
        unless: '(?i)\bfour\b'
        why: TP10 — the Attendant has 178 HP at three; 229 belongs on the four-player line
      - type: forbid
        pattern: '(?i)\b(?:built|written|tuned) for four\b'

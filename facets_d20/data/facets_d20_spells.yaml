# ---------------------------------------------------------------------------- sim_spells
# The subset the simulator models (DESIGN §9). Numbers are SRD 5.2.1; `model` is one of
# the engine's models (DESIGN §1.4a, answer to E-1). Cantrip dice double at 5th level
# (`scale: cantrip`); nothing in 1–10 reaches the 11th-level step. `targets` for an area
# spell is the sim's assumed number of foes caught, not the spell's limit.
# Models requested beyond E-1: ac_set, ac_bonus (DESIGN §9 S-4); `sustain` for spells that
# attack again on later turns; `per_hit` on weapon_rider (Hunter's Mark).
sim_spells:
  # cantrips
  - {name: Fire Bolt, level: 0, model: attack, dice: 1d10, damage_type: fire, scale: cantrip}
  - {name: Ray of Frost, level: 0, model: attack, dice: 1d8, damage_type: cold, scale: cantrip}
  - {name: Starry Wisp, level: 0, model: attack, dice: 1d8, damage_type: radiant, scale: cantrip}
  - {name: Sorcerous Burst, level: 0, model: attack, dice: 1d8, damage_type: fire, scale: cantrip}
  - {name: Produce Flame, level: 0, model: attack, dice: 1d8, damage_type: fire, scale: cantrip}
  - {name: Poison Spray, level: 0, model: attack, dice: 1d12, damage_type: poison, scale: cantrip}

# Proof D (built-interior generic proof, added 2026-11-13 so the built_interior band has a
# furnished map to judge; the canon Crystal Court is an empty hall — see LOG_mapgen ESCALATION).
# Homebrew description (the assistant's own, generic):
#   "A bandit cellar about 70×50 ft: a guard room with a table, chairs and a brazier; a
#    storeroom of crates and barrels; a barracks with four bunks and a chest; a corridor
#    joins them; stairs up in the guard room; one secret door out of the barracks."
map:
  title: The Bandit Cellar
  width_ft: 80
  height_ft: 62
  feet_per_square: 5
  px_per_square: 70
  supersample: 2
  seed: 55
  include: [styles/inked_parchment.yaml]

measure:
  guard_room: {w: 24, h: 18}
  storeroom: {w: 22, h: 16}
  barracks: {w: 30, h: 18}

steps:
  - {op: base}
  - {op: rect, out: guard_room, x: 8, y: 8, w: 24, h: 18}
  - {op: rect, out: storeroom, x: 48, y: 8, w: 22, h: 16}
  - {op: rect, out: barracks, x: 26, y: 36, w: 30, h: 18}
  - {op: path, out: hall_ew, points: [[32, 17], [48, 17]], width: 5, cap: flat}
  - {op: path, out: hall_ns, points: [[40, 19.5], [40, 36]], width: 5, cap: flat}
  - {op: union, out: cellar, of: [guard_room, storeroom, barracks, hall_ew, hall_ns]}
  - {op: rasterize, out: cellar_pre, src: cellar}
  - {op: beyond, floor: cellar_pre, depth: 5}
  - {op: floor_fill, src: cellar, name: floor, material: flagstone, shadow: 0.5, width: 3}
  - {op: rasterize, out: hall_m, src: hall_ew}
  - {op: rasterize, out: hall_m2, src: hall_ns}
  - {op: combine, out: halls, of: [hall_m, hall_m2], mode: max}
  - {op: fill, mask: halls, material: flagstone_irregular, id: hall_floor}
  - {op: shadow, mask: floor, mode: inner, width: 2.5, offset: [0.6, 0.8], strength: 0.35}
  - {op: stairs, x: 9, y: 9.5, w: 5, h: 10, down: n, id: stairs}
  - {op: wall, src: cellar, name: w, thickness: 2, material: wall_stone, weight: bold, outer_weight: heavy}
  # doors where the corridor meets each room
  - {op: path, out: gw, points: [[32, 14.5], [32, 19.5]], line: true}
  - {op: partition, src: gw, name: guard_door, thickness: 1.5, material: wall_stone}
  - {op: door, wall: guard_door, at: [32, 17], width: 4}
  - {op: path, out: sw, points: [[48, 14.5], [48, 19.5]], line: true}
  - {op: partition, src: sw, name: store_door, thickness: 1.5, material: wall_stone}
  - {op: door, wall: store_door, at: [48, 17], width: 4}
  - {op: path, out: bw, points: [[37.5, 36], [42.5, 36]], line: true}
  - {op: partition, src: bw, name: barracks_door, thickness: 1.5, material: wall_stone}
  - {op: door, wall: barracks_door, at: [40, 36], width: 4}
  - {op: secret_door, wall: w, at: [56, 46], width: 4}
  # guard room
  - {op: prop, kind: rug, at: [22, 17], size: 10, id: rug}
  - {op: prop, kind: table, at: [22, 17], size: 6, id: table}
  - {op: prop, kind: chair, at: [18.5, 14.3], rotate: 0, id: c1}
  - {op: prop, kind: chair, at: [22, 14.3], rotate: 0, id: c2}
  - {op: prop, kind: chair, at: [25.5, 19.7], rotate: 180, id: c3}
  - {op: prop, kind: chair, at: [18.5, 19.7], rotate: 180, id: c4}
  - {op: prop, kind: brazier, at: [29, 23], id: brazier}
  - {op: light, at: [29, 23], radius: 20, color: "#ffc070", intensity: 0.7, glow: true, glow_radius: 6}
  - {op: prop, kind: barrel, at: [29.5, 10.5], id: gb1}
  # storeroom
  - {op: scatter, kind: crate, region: [[49, 9], [69, 9], [69, 15], [49, 15]], density: 1.4, spacing: 2.7, size: 2.5, rotate_jitter: 30, id: crates}
  - {op: scatter, kind: barrel, region: [[54, 18], [69, 18], [69, 23], [54, 23]], density: 1.6, spacing: 2.6, size: 2.4, id: barrels}
  - {op: prop, kind: chest, at: [51, 21], size: 3, rotate: 90, id: store_chest}
  # barracks
  - {op: prop, kind: bunk, at: [31, 39.5], size: 6, rotate: 0, id: b1}
  - {op: prop, kind: bunk, at: [31, 50.5], size: 6, rotate: 0, id: b2}
  - {op: prop, kind: bunk, at: [51, 39.5], size: 6, rotate: 180, id: b3}
  - {op: prop, kind: bunk, at: [51, 50.5], size: 6, rotate: 180, id: b4}
  - {op: prop, kind: chest, at: [36, 45], size: 3, rotate: 90, id: b_chest}
  - {op: scatter, kind: pebbles, mask: floor, density: 0.3, spacing: 3, size: 1.2, shadow: 0.1, id: grit}
  - {op: finish, floor: floor, alpha: 0.16}
  - {op: label, text: "1", bold: true, at: [14, 22], size: 2.4, circle: true, color: key_red, halo: parchment}
  - {op: label, text: "2", bold: true, at: [65, 21], size: 2.4, circle: true, color: key_red, halo: parchment}
  - {op: label, text: "3", bold: true, at: [41, 46], size: 2.4, circle: true, color: key_red, halo: parchment}
  - {op: compass, at: ne, size: 6}
  - {op: scale_bar, at: nw}
  - {op: title, text: The Bandit Cellar, position: bottom, size: 2.4}

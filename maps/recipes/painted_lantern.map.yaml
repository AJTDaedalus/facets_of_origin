# Generic built map (owner request 2026-11-15, revised the same day), homebrew, no canon:
#   "A tavern/gambling hall in a forested area, without other buildings nearby. It started as a small
#    tavern long ago and has been expanded many times, adding rooms for guests, a gambling hall, and
#    shops, making it almost a small town. Each expansion had its own flair, so it seems like multiple
#    buildings strapped together. Simple architecture, not quite tribal but not advanced. Lots of
#    colours, but not an expensive venue. The gambling hall is the centre of attention, with many
#    tables for cards and other games of chance. Nice, but people would look the other way at crime,
#    unless it was violent."
#   Owner notes on the first draft: shapes far too ordered, colours too bright ("it should use colors
#   but still give off a dark vibe"), "a very chaotic place", "should be larger, it is a sprawling
#   place", and "at least one place where you walk a bridge made of a few wooden boards between
#   buildings".
# 160x120 ft, 5 ft squares. One building tacked together: each newer wing is built into the older one it
# joins, cut along that older wing's outer wall, so every join is one shared wall with a doorway through it,
# and the new wing keeps its own angle everywhere else. Only the cabin stands apart, over planks and mud;
# plank walks over mud join them. Deep, dirty colours under lamplight, dark corners (`darkness`).
#   old tavern (west, L-shaped, wattle and daub) and its leaning kitchen;
#   gambling hall (centre, oxblood timber, smoky-teal floor worn to the boards);
#   guest wing (north, timber, rooms off a corridor) and a bunkhouse beyond it;
#   a crooked cabin reached over planks from the bunkhouse;
#   shop wing (east, indigo planks), reached from the hall over planks across the mud;
#   a back shed behind the hall, through a secret door and a narrow passage;
#   a skewed plank porch at the front; junk, mud and paths all round; forest, no other buildings.
map:
  title: The Painted Lantern
  width_ft: 160
  height_ft: 120
  feet_per_square: 5
  px_per_square: 70
  supersample: 2
  seed: 2611
  include: [styles/inked_parchment.yaml]

palette:
  cloth: "#5a2240"
  rug: "#6a2a22"
  rug_trim: "#8f7330"
  felt: "#1d4a35"
  chip: "#9a7a30"
  bottle: "#2f4a34"
  spill: "#3a1418"

materials:
  hall_paint:   {type: planks, colors: ["#1d4646", "#245453", "#2c605e"], width: 1.25, length: 7, seam: 0.08, seam_color: "#0f2626", grain: 0.4}
  guest_paint:  {type: planks, colors: ["#5e4a1e", "#6e5726", "#7c632d"], width: 1.4, length: 7, seam: 0.08, seam_color: "#33270e", grain: 0.3}
  clay_floor:   {type: dirt, colors: ["#4e2a1e", "#5e3324", "#6e3d2b"], scale: 6, octaves: 4, grain: 0.07, speckle: 0.06}
  oxblood:      {type: ramp_noise, colors: ["#3c1614", "#4e1d19", "#5e2520"], scale: 1.5, octaves: 4, kind: ridged, grain: 0.06}
  indigo_planks: {type: ramp_noise, colors: ["#1a2438", "#212e46", "#293853"], scale: 1.2, octaves: 4, kind: ridged, grain: 0.06}
  porch_deck:   {type: planks, colors: ["#5e4630", "#6e5439", "#7c6042"], width: 1.0, length: 2000, angle: 80, seam: 0.09, seam_color: "#2a1d12", grain: 0.5}
  earth:        {type: dirt, colors: ["#6e624e", "#7e715b", "#8e8169"], scale: 18, octaves: 5, grain: 0.06, speckle: 0.06}
  patch_planks: {type: planks, colors: ["#4a3a28", "#5a4732", "#3e3022"], width: 1.0, length: 3, seam: 0.1, seam_color: "#1e160e", grain: 0.5}

steps:
  # ---- the forest clearing: trampled earth, meadow, mud where the feet go
  - {op: canvas, out: canvas, material: earth, id: ground}
  - {op: ground_patches, name: grass, material: meadow, scale: 14, cover: -0.05, edge: 0.14}
  - {op: ellipse, out: clearing_g, center: [80, 54], rx: 70, ry: 51}
  - {op: roughen_geom, out: clearing_g, src: clearing_g, amount: 6, scale: 18, id: clearing_rough}
  - {op: rasterize, out: clearing_m, src: clearing_g}
  # tracks beaten in from every side
  - {op: path, out: track, points: [[58, 123], [62, 108], [70, 96]], width: 6, smooth: 3}
  - {op: path, out: foot_w, points: [[22, 50], [14, 36], [6, 20], [-3, 12]], width: 3.5, smooth: 3}
  - {op: path, out: foot_e, points: [[150, 66], [158, 80], [163, 92]], width: 3.5, smooth: 3}
  - {op: path, out: foot_k, points: [[24, 100], [16, 110], [10, 123]], width: 3, smooth: 3}
  - {op: union, out: paths, of: [track, foot_w, foot_e, foot_k]}
  - {op: roughen_geom, out: paths, src: paths, amount: 0.7, scale: 5, id: path_rough}
  - {op: rasterize, out: paths_m, src: paths}
  - {op: fill, mask: paths_m, material: dirt_path, id: path_dirt}
  - {op: stroke, src: paths, width: 0.14, dash: [1.4, 0.5, 0.25, 0.5], jitter: 0.6, opacity: 0.9}
  # ---- the wings, oldest first, each drawn straight, knocked askew and cut along the older walls it meets
  - {op: polygon, out: tavern, points: [[12.15, 48.53], [22.05, 47.14], [21.49, 43.17], [30.41, 41.92], [30.96, 45.88], [37.89, 44.91], [39.01, 52.83], [47.92, 51.58], [50.98, 73.36], [25.23, 76.98], [24.4, 71.04], [15.49, 72.29]]}
  - {op: offset, out: tavern_wz, src: tavern, by: 1.55, join: mitre}
  - {op: polygon, out: kitchen, points: [[18.56, 77.81], [23.38, 90.99], [40.13, 84.11], [37.36, 76.79], [23.96, 78.68], [23.63, 76.35]]}
  - {op: offset, out: kitchen_wz, src: kitchen, by: 1.05, join: mitre}
  - {op: polygon, out: hall, points: [[63.01, 76.1], [96.96, 77.88], [103.22, 73.21], [104.68, 45.24], [100.9, 41.04], [70.94, 39.47], [71.3, 32.48], [63.32, 32.06], [62.95, 39.05], [58.64, 44.83], [58.33, 50.83], [49.26, 50.35], [51.81, 68.51], [57.38, 68.8], [57.33, 69.8]]}
  - {op: offset, out: hall_wz, src: hall, by: 1.05, join: mitre}
  - {op: polygon, out: shops, points: [[114.53, 64.65], [112.05, 75.37], [138.36, 81.44], [146.38, 42.24], [137.61, 40.22], [136.71, 44.11], [120.15, 40.29], [117.9, 50.03], [105.58, 47.19], [104.82, 61.76]]}
  - {op: offset, out: shops_wz, src: shops, by: 1.05, join: mitre}
  - {op: polygon, out: guest, points: [[84.3, 34.91], [84.9, 14.87], [77.93, 14.14], [78.3, 10.65], [67.36, 9.5], [66.99, 12.99], [49.09, 11.1], [47, 30.99], [62.29, 32.6], [62.37, 31.01], [72.36, 31.53], [72.24, 33.65]]}
  - {op: offset, out: guest_wz, src: guest, by: 1.05, join: mitre}
  - {op: polygon, out: bunk, points: [[115.11, 34.69], [107.93, 14.13], [88.5, 19.08], [89.02, 22.03], [85.66, 22.62], [85.26, 36.02], [83.33, 35.82], [83.74, 38.19], [91.62, 36.8], [91.8, 37.79]]}
  - {op: offset, out: bunk_wz, src: bunk, by: 0.85, join: mitre}
  - {op: polygon, out: shed, points: [[85.91, 91.45], [99.1, 86.35], [98.58, 77.93], [97.27, 78.9], [82.84, 78.15]]}
  - {op: offset, out: shed_wz, src: shed, by: 0.85, join: mitre}
  - {op: polygon, out: cabin, points: [[119, 26.31], [136.65, 30.01], [140.53, 15.52], [133.58, 10.55], [124.11, 11.12]]}
  - {op: offset, out: cabin_wz, src: cabin, by: 0.85, join: mitre}
  - {op: polygon, out: porch, points: [[61.75, 77.68], [60.24, 84.8], [82.33, 85.26], [80.35, 78.01], [65.32, 77.23]]}
  - {op: union, out: built, of: [hall, tavern, kitchen, guest, bunk, cabin, shops, shed, porch]}
  - {op: rasterize, out: built_m, src: built}
  - {op: grow, out: keep_clear, src: built_m, by: 6}
  - {op: grow, out: brush_clear, src: built_m, by: 3}
  # mud: in the gaps the plank walks cross, round the doors and along the eaves
  - {op: path, out: mud_bc, points: [[111.87, 22.06], [116.71, 21.39], [121.55, 18.72]], width: 8, smooth: 2}
  - {op: union, out: mud_g, of: [mud_bc]}
  - {op: roughen_geom, out: mud_g, src: mud_g, amount: 1.2, scale: 4, id: mud_rough}
  - {op: rasterize, out: mud_m, src: mud_g}
  - {op: noise, out: mud_n, scale: 5, id: mud_noise}
  - {op: field_to_mask, out: mud_spots, src: mud_n, lo: 0.35, hi: 0.55}
  - {op: grow, out: eaves, src: built_m, by: 3}
  - {op: combine, out: mud_spots, of: [mud_spots, eaves], mode: min}
  - {op: combine, out: mud_all, of: [mud_m, mud_spots], mode: max}
  - {op: blur, out: mud_all, src: mud_all, sigma: 0.4}
  - {op: fill, mask: mud_all, material: mud, opacity: 0.9, id: mud_fill}
  - {op: stipple, mask: mud_all, density: 10, falloff: 0.8, size: 0.06, color: "#2a2118", opacity: 0.6, id: mud_edge}
  - {op: stroke, src: mud_all, width: 0.06, color: "#1e1810", opacity: 0.7}
  # standing water in the ruts
  - {op: noise, out: puddle_n, scale: 1.6, id: puddle_noise}
  - {op: field_to_mask, out: puddles, src: puddle_n, lo: 0.3, hi: 0.32}
  - {op: combine, out: puddles, of: [puddles, mud_m], mode: min}
  - {op: fill, mask: puddles, material: water, opacity: 0.8, id: puddle_fill}
  - {op: stroke, src: puddles, width: 0.05, color: "#1e1810", opacity: 0.8}
  # ---- the forest
  - {op: invert, out: woods, src: clearing_m}
  - {op: brush, name: brush, within: woods, clear: brush_clear, scale: 16, cover: -0.25}
  - {op: combine, out: tree_avoid, of: [keep_clear, paths_m], mode: max}
  - {op: scatter, kind: tree, mask: brush, avoid: [tree_avoid], density: 0.55, spacing: 7, size: 11, shadow: 0.6, sort_y: true, id: trees}
  - {op: scatter, kind: bush, mask: clearing_m, avoid: [keep_clear, paths_m], density: 0.08, spacing: 6, size: 4, id: bushes}
  - {op: scatter, kind: tree, mask: clearing_m, avoid: [tree_avoid], density: 0.03, spacing: 14, size: 10, shadow: 0.6, id: lone_trees}
  # ---- floors
  - {op: floor_fill, src: tavern, name: tavern_f, material: wood_floor_rough, shadow: 0.5}
  - {op: floor_fill, src: kitchen, name: kitchen_f, material: flagstone_irregular, shadow: 0.5}
  - {op: floor_fill, src: hall, name: hall_f, material: hall_paint, shadow: 0.5}
  - {op: floor_fill, src: guest, name: guest_f, material: guest_paint, shadow: 0.5}
  - {op: floor_fill, src: bunk, name: bunk_f, material: wood_floor_rough, shadow: 0.5}
  - {op: floor_fill, src: cabin, name: cabin_f, material: wood_floor, shadow: 0.5}
  - {op: floor_fill, src: shops, name: shops_f, material: clay_floor, shadow: 0.5}
  - {op: floor_fill, src: shed, name: shed_f, material: wood_floor_rough, shadow: 0.5}
  # rushes on the old floor; the hall's cheap paint worn to the boards; repairs in odd boards
  - {op: noise, out: rush_n, scale: 4, id: rush_noise}
  - {op: field_to_mask, out: rush_m, src: rush_n, lo: 0.05, hi: 0.35}
  - {op: combine, out: rush_m, of: [rush_m, tavern_f], mode: min}
  - {op: fill, mask: rush_m, material: rushes, opacity: 0.6, id: tavern_rushes}
  - {op: noise, out: wear_n, scale: 7, octaves: 4, id: wear_noise}
  - {op: field_to_mask, out: wear_m, src: wear_n, lo: 0.2, hi: 0.45}
  - {op: combine, out: wear_m, of: [wear_m, hall_f], mode: min}
  - {op: fill, mask: wear_m, material: wood_floor_rough, opacity: 0.7, id: hall_wear}
  - {op: noise, out: patch_n, scale: 3, id: patch_noise}
  - {op: field_to_mask, out: patch_m, src: patch_n, lo: 0.55, hi: 0.56}
  - {op: combine, out: floor_union, of: [hall_f, guest_f, shops_f, bunk_f], mode: max}
  - {op: combine, out: patch_m, of: [patch_m, floor_union], mode: min}
  - {op: fill, mask: patch_m, material: patch_planks, id: floor_patches}
  - {op: stroke, src: patch_m, width: 0.06, opacity: 0.8}
  - {op: rasterize, out: porch_m, src: porch}
  - {op: fill, mask: porch_m, material: porch_deck, id: porch_deck}
  - {op: stroke, src: porch, width: 0.16}
  - {op: shade_lines, mask: porch_m, side: outside, length: 0.8, spacing: 0.3, width: 0.04, opacity: 0.6}
  # ---- walls: wattle and daub, oxblood timber, plain timber, indigo planks
  - {op: wall, src: tavern, name: w_tavern, thickness: 1.5, style: rough, material: wall_wattle, roughness: 0.12}
  - {op: union, out: kitchen_older, of: [tavern_wz]}
  - {op: wall, src: kitchen, name: w_kitchen, thickness: 1, style: rough, material: wall_wattle, roughness: 0.12, exclude: kitchen_older}
  - {op: union, out: hall_older, of: [tavern_wz, kitchen_wz]}
  - {op: wall, src: hall, name: w_hall, thickness: 1, style: dressed, material: oxblood, exclude: hall_older}
  - {op: union, out: shops_older, of: [tavern_wz, kitchen_wz, hall_wz]}
  - {op: wall, src: shops, name: w_shops, thickness: 1, style: dressed, material: indigo_planks, exclude: shops_older}
  - {op: union, out: guest_older, of: [tavern_wz, kitchen_wz, hall_wz, shops_wz]}
  - {op: wall, src: guest, name: w_guest, thickness: 1, style: dressed, material: wall_timber, exclude: guest_older}
  - {op: union, out: bunk_older, of: [tavern_wz, kitchen_wz, hall_wz, shops_wz, guest_wz]}
  - {op: wall, src: bunk, name: w_bunk, thickness: 0.8, style: rough, material: wall_timber, roughness: 0.12, exclude: bunk_older}
  - {op: union, out: shed_older, of: [tavern_wz, kitchen_wz, hall_wz, shops_wz, guest_wz, bunk_wz]}
  - {op: wall, src: shed, name: w_shed, thickness: 0.8, style: rough, material: patch_planks, roughness: 0.12, exclude: shed_older}
  - {op: union, out: cabin_older, of: [tavern_wz, kitchen_wz, hall_wz, shops_wz, guest_wz, bunk_wz, shed_wz]}
  - {op: wall, src: cabin, name: w_cabin, thickness: 0.8, style: rough, material: wall_timber, roughness: 0.12, exclude: cabin_older}
  # mismatched repairs in the walls
  - {op: polygon, out: rep0, points: [[81.08, 37], [89.07, 37.42], [88.81, 42.41], [80.82, 41.99]]}
  - {op: rasterize, out: rep0_m, src: rep0}
  - {op: wall_band, out: rep0_b, wall: w_hall}
  - {op: combine, out: rep0_m, of: [rep0_m, rep0_b], mode: min}
  - {op: fill, mask: rep0_m, material: patch_planks, id: repair0}
  - {op: stroke, src: rep0_m, width: 0.08}
  - {op: polygon, out: rep1, points: [[101.53, 67.11], [106.53, 67.37], [106.21, 73.36], [101.22, 73.1]]}
  - {op: rasterize, out: rep1_m, src: rep1}
  - {op: wall_band, out: rep1_b, wall: w_hall}
  - {op: combine, out: rep1_m, of: [rep1_m, rep1_b], mode: min}
  - {op: fill, mask: rep1_m, material: wall_wattle, id: repair1}
  - {op: stroke, src: rep1_m, width: 0.08}
  - {op: polygon, out: rep2, points: [[10.01, 54.89], [15.95, 54.05], [17.07, 61.97], [11.12, 62.81]]}
  - {op: rasterize, out: rep2_m, src: rep2}
  - {op: wall_band, out: rep2_b, wall: w_tavern}
  - {op: combine, out: rep2_m, of: [rep2_m, rep2_b], mode: min}
  - {op: fill, mask: rep2_m, material: patch_planks, id: repair2}
  - {op: stroke, src: rep2_m, width: 0.08}
  - {op: polygon, out: rep3, points: [[122.24, 75.67], [130.04, 77.47], [128.91, 82.34], [121.12, 80.54]]}
  - {op: rasterize, out: rep3_m, src: rep3}
  - {op: wall_band, out: rep3_b, wall: w_shops}
  - {op: combine, out: rep3_m, of: [rep3_m, rep3_b], mode: min}
  - {op: fill, mask: rep3_m, material: wall_wattle, id: repair3}
  - {op: stroke, src: rep3_m, width: 0.08}
  # one doorway through the older wall at each join (the back shed's is a secret door)
  - {op: opening, wall: w_tavern, at: [29.67, 76.36], width: 4, floor_material: wood_floor_rough}
  - {op: opening, wall: w_tavern, at: [49.05, 59.64], width: 4, floor_material: wood_floor_rough}
  - {op: opening, wall: w_hall, at: [104.2, 54.42], width: 4, floor_material: hall_paint}
  - {op: opening, wall: w_hall, at: [67.5, 32.28], width: 4, floor_material: hall_paint}
  - {op: opening, wall: w_guest, at: [84.45, 29.91], width: 4, floor_material: guest_paint}
  - {op: secret_door, wall: w_hall, at: [90.82, 77.56], width: 3}
  # the plank walk to the cabin: a door each side of the mud, a few loose boards between
  - {op: door, wall: w_bunk, at: [111.87, 22.06], width: 3}
  - {op: door, wall: w_cabin, at: [121.55, 18.72], width: 3}
  - {op: prop, kind: boards, at: [116.71, 20.39], size: 11.44, rotate: -19, shadow: 0.5, id: plank_walk}
  # outside doors, the front double door, and the secret door to the back shed
  - {op: double_door, wall: w_hall, at: [70, 76.47], width: 6}
  - {op: door, wall: w_tavern, at: [20.07, 47.41], width: 4}
  - {op: door, wall: w_shops, at: [142.21, 63.86], width: 4}
  - {op: door, wall: w_kitchen, at: [20.97, 84.4], width: 3}
  - {op: door, wall: w_cabin, at: [127.82, 28.16], width: 3}
  - {op: door, wall: w_shed, at: [98.72, 80.28], width: 3}
  - {op: window, wall: w_tavern, at: [12.98, 54.47], width: 3}
  - {op: window, wall: w_tavern, at: [14.65, 66.35], width: 3}
  - {op: window, wall: w_hall, at: [80.99, 77.05], width: 3}
  - {op: window, wall: w_guest, at: [61.03, 12.36], width: 3}
  - {op: window, wall: w_guest, at: [48.05, 21.05], width: 3}
  - {op: window, wall: w_shops, at: [132.82, 43.21], width: 3}
  - {op: window, wall: w_bunk, at: [99.33, 17.17], width: 3}
  - {op: window, wall: w_cabin, at: [138.72, 22.28], width: 3}
  # ---- guest wing: a crooked corridor, rooms of every size; the bunkhouse is one long room
  - {op: path, out: gp0, points: [[48.15, 20.06], [83.96, 23.82]], line: true}
  - {op: partition, src: gp0, name: p_g0, thickness: 0.6, material: wall_timber}
  - {op: path, out: gp1, points: [[47.73, 24.03], [59.67, 25.29]], line: true}
  - {op: partition, src: gp1, name: p_g1, thickness: 0.6, material: wall_timber}
  - {op: path, out: gp2, points: [[69.61, 26.33], [83.54, 27.8]], line: true}
  - {op: partition, src: gp2, name: p_g2, thickness: 0.6, material: wall_timber}
  - {op: path, out: gp3, points: [[58.04, 12.05], [57.1, 21]], line: true}
  - {op: partition, src: gp3, name: p_g3, thickness: 0.6, material: wall_timber}
  - {op: path, out: gp4, points: [[71.97, 13.51], [71.03, 22.46]], line: true}
  - {op: partition, src: gp4, name: p_g4, thickness: 0.6, material: wall_timber}
  - {op: path, out: gp5, points: [[76.58, 27.06], [75.84, 34.03]], line: true}
  - {op: partition, src: gp5, name: p_g5, thickness: 0.6, material: wall_timber}
  - {op: door, wall: p_g0, at: [52.13, 20.47], width: 2.5}
  - {op: door, wall: p_g0, at: [64.06, 21.73], width: 2.5}
  - {op: door, wall: p_g0, at: [79.98, 23.4], width: 2.5}
  - {op: door, wall: p_g1, at: [52.71, 24.56], width: 2.5}
  - {op: door, wall: p_g2, at: [72.6, 26.65], width: 2.5}
  - {op: door, wall: p_g2, at: [80.55, 27.48], width: 2.5}
  - {op: path, out: sp0, points: [[132.82, 43.21], [129.89, 55.88]], line: true}
  - {op: partition, src: sp0, name: p_s0, thickness: 0.5, material: indigo_planks}
  - {op: path, out: sp1, points: [[127.64, 65.63], [124.72, 78.29]], line: true}
  - {op: partition, src: sp1, name: p_s1, thickness: 0.5, material: indigo_planks}
  # ---- line-work on every floor: hatching inside the north and west walls
  - {op: union, out: floors, of: [hall, tavern, kitchen, guest, bunk, cabin, shops, shed]}
  - {op: rasterize, out: floors_m, src: floors}
  - {op: shade_lines, mask: floors_m, side: inside, length: 1.6, spacing: 0.32, width: 0.04, opacity: 0.55}
  # ---- old tavern: hearth, the original bar, tables shoved wherever they fit
  - {op: prop, kind: hearth, at: [16.29, 60.06], size: 6, rotate: 82, id: t_hearth}
  - {op: prop, kind: counter, at: [31.52, 49.84], size: 9, rotate: -10.8, id: t_bar}
  - {op: prop, kind: barrel, at: [26.04, 48.19], size: 1.8, rotate: -8, id: t_keg0}
  - {op: prop, kind: barrel, at: [28.59, 47.83], size: 1.8, rotate: -8, id: t_keg1}

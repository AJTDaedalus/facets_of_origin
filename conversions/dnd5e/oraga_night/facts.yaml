      - type: forbid
        pattern: 'Raunu[^.]{0,80}(sends?|sent) (her|Veier) (away|off)'
        why: TP11 — Raunu planned to keep her until the birth

  - id: midnight_wing_routes
    truth: >-
      At the lights, Raunu's first crystal seals only the double doors at the head of the east
      stair. The service stair beside them (with the wing's service door) and the garden stair
      from the upper terrace stay open, as drawn on Map VIII–5: they are the party's routes to
      intercept the Radiant, and an open route can still be guarded. The inner doors lock behind
      Veier on Raunu's last charge (his twin crystal), as printed. Anha's passages reach the
      wing's service door; they are never a way to Veier.
    source: owner TP13, TP28 (C1, C1b); ledger L-027, R-01
    phrases: ["the double doors at the head of the east stair", "The ways into the east wing"]
    checks:
      - type: forbid
        pattern: '(?i)\beast wing corridor booms? shut\b'
        why: TP28 — the first crystal seals the double doors at the head of the east stair; name them
      - type: forbid
        pattern: '\bspent sealing the corridor\b'
        why: TP28 — the first crystal sealed the double doors, not the corridor
      - type: forbid
        pattern: '(?i)\b(?:service|garden) stairs? (?:(?:is|are|was|were) )?(?:sealed|seals?|booms? shut)\b|\bseals? (?:the|its) (?:service|garden) stair'

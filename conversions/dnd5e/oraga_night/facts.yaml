  - id: threat_rule
    truth: >-
      The threat rule (TP6; DESIGN §3.1) replaces the Uninvited's blanket "Down, Not Out". It is
      printed in full once, in chapter V ("Midnight Rules", under "Down, Not Out"); every other
      chapter (the DM sheet, the fight cards, the stat blocks) points to it and adds only its
      local rule. A creature becomes a threat to one of the Uninvited when it lands a Stop on
      it, earns Delay against it three times in one scene, or deals its last blow; the DM says
      the mark aloud ("She looks at you — properly, for the first time."). Unmarked, a creature
      dropped to 0 HP is set aside, Unconscious and Stable, and the crowd rule applies. Marked,
      normal dying rules apply; the Uninvited finishes a marked creature only if it is
      still in the way on its next turn. The quarry is unchanged; the mark lasts the scene. The
      crowd rouses a dropped creature at the start of "the round after" the round it was still
      down, never "the round after next". Nothing prints "only ever in mortal danger by choice"
      or "deadly but not lethal".
    source: owner TP6 (2026-10-20); DESIGN_oraga_5e_3p_pass §3.1; ledger L-010 (replaces O36's down_not_out; review P2-18)
    phrases: ['(see chapter V, "Down, Not Out")', "the crowd rule", "properly, for the first time"]
    checks:
      - type: rule_copy
        home: "05"
        max: 2
        elements:
          - '\bStable\b'
          - '\bno Death Saving Throws\b'
          - '\bwithin 5 (?:feet|ft\.)[^.]{0,80}\baction\b'
          - '\b1 (?:Hit Point|HP)\b'
          - '\b(?:drags?|dragged) (?:them |it |him |her )?clear\b|\bthe crowd does\b'
          - '\bhaul\w*[^.]{0,80}Heroic Inspiration\b'
          - '\blast blow\b'
          - '\b(?:within|longer than) two rounds\b'
          - '\bproperly, for the first time\b'
          - '\bthree times in (?:one|a) scene\b'
          - '\bstill (?:in the way|between (?:them|her|him) and)\b'
          - '\b(?:the )?mark lasts the scene\b'
        why: O36 / L-010 — the full rule lives in chapter V; elsewhere print a pointer plus the local rule
      - type: forbid
        pattern: '\bround after next\b'
        why: O36 / P2-18 — chapter V says "the round after"
      - type: forbid
        pattern: '(?i)\bonly ever in mortal danger by choice\b'
        why: TP6 / DESIGN §1 — retired; the threat rule replaces it
      - type: forbid
        pattern: '(?i)\bdeadly,? but not lethal\b'
        why: TP5 / DESIGN §1 — retired for the Attendant
      - type: require
        file: 05_The_Longest_Night.md
        pattern: '\*"She looks at you — properly, for the first time\."\*'
        anchor: 'Down, Not Out'
        why: TP6 / DESIGN §3.1 — the DM says the mark aloud

  - id: fracture_rule
    truth: >-
      The Stop and End rule (three ways to a Stop, DC 15 with +2 per tell, once per scene,
      the result bands, 2 Delay and the mark; an End's two tells, method, success and
      failure; "End once; Stop once per scene"; the trap as an End for all three) is printed
      in full once, in chapter V ("The Fractures"). Chapter X keeps a pointer; each block's
      Stop and End traits say only what lands. The DM sheet (08) is a quick reference and
      may compress it.
    source: O36 extended (review 2 N8, R6.2, O64); T4.5–T4.7 (DESIGN §3.3–§3.5, TP43)
    phrases: ['(see chapter V, "The Fractures")']
    checks:
      - type: rule_copy
        home: "05"
        max: 2
        files: ["01", "02", "03", "04", "06", "07", "09", "10", "11", "README"]
        elements:
          - '\bIntimidation never works\b|\bNever Intimidation\b'
          - '\b(?:Failure|miss(?:es)?|fails?) by 4 or less\b'
          - '\b(?:Failure|miss(?:es)?|fails?) by 5 or more\b'
          - '\bwithin 30 (?:feet|ft\.)[^.]{0,60}\bhear'
          - '\bHeroic Inspiration may be spent\b'
          - "\\b(?:isn't|is not|not) spent\\b"
          - '\+2 (?:for each|per) tell\b'
          - '\bonce per scene\b'
          - '\btwo or more (?:witnessed )?tells\b'
          - '\bread the check as a Stop\b|\bcounts as a Stop\b'
        why: O36 / review 2 N8 / DESIGN §3.3–§3.4 — the full Stop and End rule lives in chapter V; chapter X points to it
      - type: forbid
        pattern: '\bFracture (?:check|attempt)\b|\b(?:lands?|landed|earns?|earned|invoked?) (?:his |her |its |a |the |that Uninvited''s )?Fracture\b'
        why: DESIGN §3.3–§3.7 (T4.5) — the rule terms are Stop and End; "The Fractures" names only the seams and the section

# Generic built map (owner request 2026-11-15), homebrew, no canon:
#   "A tavern/gambling hall in a forested area, without other buildings nearby. It started as a small
#    tavern long ago and has been expanded many times, adding rooms for guests, a gambling hall, and
#    shops, making it almost a small town. Each expansion had its own flair, so it seems like multiple
#    buildings strapped together. Simple architecture, not quite tribal but not advanced. Lots of
#    bright colours, but not an expensive venue. The gambling hall is the centre of attention, with many
#    tables for cards and other games of chance. Nice, but people would look the other way at crime,
#    unless it was violent."
# 110x80 ft, 5 ft squares. Each wing has its own floor, wall material and colours, walled separately so
# the joins show (walls side by side where wings meet, doorways cut through both):
#   old tavern (west, wattle and daub, faded red and ochre) with its kitchen to the south;
#   gambling hall (centre, red-painted timber, teal floor worn to the boards, the brightest wing);
#   guest wing (north, plain timber, ochre floor, six rooms off a corridor);
#   shop wing (east, blue-painted planks, terracotta floor, four stalls off an aisle);
#   a back room behind the hall reached by a secret door (the business nobody asks about);
#   a plank porch at the front, a forest clearing round it all, no other buildings.
map:
  title: The Painted Lantern
  width_ft: 110
  height_ft: 80
  feet_per_square: 5
  px_per_square: 70
  supersample: 2
  seed: 2611
  include: [styles/inked_parchment.yaml]

palette:
  cloth: "#c23b6e"        # blankets: a loud magenta by default; rooms override
  rug: "#d4552e"
  rug_trim: "#f2c230"
  felt: "#1f8a5c"
  chip: "#e8b820"

materials:
  hall_paint:  {type: planks, colors: ["#2a8c86", "#33a198", "#45b2a6"], width: 1.25, length: 7, seam: 0.08, seam_color: "#1b4f4b", grain: 0.35}
  guest_paint: {type: planks, colors: ["#c08a2a", "#d39e35", "#e2b24a"], width: 1.4, length: 7, seam: 0.07, seam_color: "#6b4a14", grain: 0.15}
  clay_floor:  {type: dirt, colors: ["#a9583a", "#bf6c47", "#d18459"], scale: 6, octaves: 4, grain: 0.07, speckle: 0.06}
  red_timber:  {type: ramp_noise, colors: ["#7e2620", "#9a3228", "#b0402f"], scale: 1.5, octaves: 4, kind: ridged, grain: 0.06}
  blue_planks: {type: ramp_noise, colors: ["#244f78", "#2f6390", "#3b74a3"], scale: 1.2, octaves: 4, kind: ridged, grain: 0.06}
  porch_deck:  {type: planks, colors: ["#8a6a45", "#a07f56", "#b28f64"], width: 1.0, length: 2000, angle: 90, seam: 0.08, seam_color: "#4a3420", grain: 0.5}

steps:
  # ---- the forest clearing: packed earth and meadow, trees and brush all round
  - {op: canvas, out: canvas, material: earth, id: ground}
  - {op: ground_patches, name: grass, material: meadow, scale: 14, cover: -0.1, edge: 0.14}
  - {op: ellipse, out: clearing_g, center: [56, 40], rx: 54, ry: 38}
  - {op: roughen_geom, out: clearing_g, src: clearing_g, amount: 4, scale: 14, id: clearing_rough}
  - {op: rasterize, out: clearing_m, src: clearing_g}
  # the track in from the south to the porch, and a footpath north from the old tavern door
  - {op: path, out: track, points: [[40, 83], [44, 76], [50, 70]], width: 6, smooth: 3}
  - {op: path, out: footpath, points: [[23, 35], [20, 24], [12, 10], [8, -3]], width: 3.5, smooth: 3}
  - {op: union, out: paths, of: [track, footpath]}
  - {op: roughen_geom, out: paths, src: paths, amount: 0.6, scale: 5, id: path_rough}
  - {op: rasterize, out: paths_m, src: paths}
  - {op: fill, mask: paths_m, material: dirt_path, id: path_dirt}
  - {op: stroke, src: paths, width: 0.14, dash: [1.4, 0.5, 0.25, 0.5], jitter: 0.6, opacity: 0.9}
  # ---- the wings: each its own floor, walled on its own
  - {op: rect, out: tavern, x: 14, y: 36, w: 20, h: 20}
  - {op: rect, out: kitchen, x: 16, y: 59, w: 16, h: 9}
  - {op: rect, out: hall, x: 36.5, y: 29, w: 39.5, h: 31}
  - {op: rect, out: guest, x: 40, y: 8, w: 34, h: 19}
  - {op: rect, out: shops, x: 78, y: 33, w: 20, h: 24}
  - {op: rect, out: back, x: 62, y: 62, w: 14, h: 8}
  - {op: rect, out: porch, x: 42, y: 61, w: 16, h: 7}
  - {op: union, out: built, of: [tavern, kitchen, hall, guest, shops, back, porch]}
  - {op: rasterize, out: built_m, src: built}
  - {op: grow, out: keep_clear, src: built_m, by: 6}
  - {op: grow, out: brush_clear, src: built_m, by: 3}
  - {op: invert, out: woods, src: clearing_m}
  - {op: brush, name: brush, within: woods, clear: brush_clear, scale: 16, cover: -0.25}
  - {op: combine, out: tree_avoid, of: [keep_clear, paths_m], mode: max}
  - {op: scatter, kind: tree, mask: brush, avoid: [tree_avoid], density: 0.6, spacing: 7, size: 11, shadow: 0.6, sort_y: true, id: trees}
  - {op: scatter, kind: bush, mask: clearing_m, avoid: [keep_clear, paths_m], density: 0.08, spacing: 6, size: 4, id: bushes}
  - {op: scatter, kind: tree, mask: clearing_m, avoid: [tree_avoid], density: 0.03, spacing: 12, size: 10, shadow: 0.6, id: lone_trees}
  # ---- floors, oldest first
  - {op: floor_fill, src: tavern, name: tavern_f, material: wood_floor_rough, shadow: 0.5}
  - {op: noise, out: rush_n, scale: 4, id: rush_noise}
  - {op: field_to_mask, out: rush_m, src: rush_n, lo: 0.05, hi: 0.35}
  - {op: combine, out: rush_m, of: [rush_m, tavern_f], mode: min}
  - {op: fill, mask: rush_m, material: rushes, opacity: 0.85, id: tavern_rushes}
  - {op: floor_fill, src: kitchen, name: kitchen_f, material: flagstone_irregular, shadow: 0.5}
  - {op: floor_fill, src: hall, name: hall_f, material: hall_paint, shadow: 0.4}
  # cheap paint, worn through to the boards where the crowds walk
  - {op: noise, out: wear_n, scale: 6, octaves: 4, id: wear_noise}
  - {op: field_to_mask, out: wear_m, src: wear_n, lo: 0.15, hi: 0.4}
  - {op: combine, out: wear_m, of: [wear_m, hall_f], mode: min}
  - {op: fill, mask: wear_m, material: wood_floor_rough, opacity: 0.75, id: hall_wear}
  - {op: floor_fill, src: guest, name: guest_f, material: guest_paint, shadow: 0.4}
  - {op: floor_fill, src: shops, name: shops_f, material: clay_floor, shadow: 0.4}
  - {op: floor_fill, src: back, name: back_f, material: wood_floor, shadow: 0.6}
  - {op: rasterize, out: porch_m, src: porch}
  - {op: fill, mask: porch_m, material: porch_deck, id: porch_deck}
  - {op: stroke, src: porch, width: 0.16}
  - {op: shade_lines, mask: porch_m, side: outside, length: 0.8, spacing: 0.3, width: 0.04, opacity: 0.6}
  # ---- walls: wattle and daub, red timber, plain timber, blue planks
  - {op: wall, src: tavern, name: w_tavern, thickness: 1.5, style: rough, roughness: 0.15, material: wall_wattle}
  - {op: wall, src: kitchen, name: w_kitchen, thickness: 1, style: rough, roughness: 0.12, material: wall_wattle}
  - {op: wall, src: hall, name: w_hall, thickness: 1, material: red_timber}
  - {op: wall, src: guest, name: w_guest, thickness: 1, material: wall_timber}
  - {op: wall, src: shops, name: w_shops, thickness: 1, material: blue_planks}
  - {op: wall, src: back, name: w_back, thickness: 1, material: wall_timber}
  # where wings meet: one doorway cut through each wing's wall
  - {op: opening, wall: w_tavern, at: [35, 46], width: 5, floor_material: wood_floor_rough}
  - {op: opening, wall: w_hall, at: [35.8, 46], width: 5, floor_material: hall_paint}
  - {op: opening, wall: w_guest, at: [57, 27.5], width: 5, floor_material: guest_paint}
  - {op: opening, wall: w_hall, at: [57, 28.3], width: 5, floor_material: hall_paint}
  - {op: opening, wall: w_hall, at: [76.5, 45], width: 5, floor_material: hall_paint}
  - {op: opening, wall: w_shops, at: [77.5, 45], width: 5, floor_material: clay_floor}
  - {op: door, wall: w_tavern, at: [24, 57], width: 3.5}
  - {op: door, wall: w_kitchen, at: [24, 58.5], width: 3.5}
  - {op: double_door, wall: w_hall, at: [50, 60.5], width: 6}
  - {op: door, wall: w_tavern, at: [24, 35], width: 4}
  - {op: door, wall: w_shops, at: [98.5, 45], width: 4}
  - {op: door, wall: w_kitchen, at: [15.5, 64], width: 3}
  # the back room: a secret door in the hall's south wall, and a plain one out to the woods
  - {op: secret_door, wall: w_hall, at: [70, 60.5], width: 3.5}
  - {op: opening, wall: w_back, at: [70, 61.5], width: 3.5, floor_material: wood_floor}
  - {op: door, wall: w_back, at: [76.5, 66], width: 3}
  - {op: window, wall: w_tavern, at: [13.3, 43], width: 3}
  - {op: window, wall: w_tavern, at: [13.3, 50], width: 3}
  - {op: window, wall: w_guest, at: [39.5, 13], width: 3}

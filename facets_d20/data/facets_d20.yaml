# ---------------------------------------------------------------------------- balance
# Ruling 3 and Amendment 2. The simulator runs every preset and every sim_build at these
# levels and reports each against the band (DESIGN §8). Sim builds must be legal.
balance:
  levels: [1, 4, 7, 10]
  # Primary measure (balance pass V32): the swap test. The reference party with the build
  # swapped in for each member in turn plays standard days (adventuring_day); the score is
  # the party's share of hit points lost per fight, as "vs median" = median ÷ build − 1
  # (positive = the party loses less = stronger). The power index (PI) is secondary.
  measure: swap
  band_pct: 15                      # every preset AND every sim_build within ±15% of the preset median
  facet_band_pct: 10                # each Facet's preset mean within ±10% of the overall median
  combo_ceiling_pct: 15             # (kept for the PI report) a sim_build's PI ceiling
  srd_band_pct: 15                  # PI report only; on the swap test the SRD baselines are reported, not banded
  srd_baselines: [srd_fighter_champion, srd_rogue_thief, srd_wizard_evoker, srd_cleric_life,
                  srd_paladin_devotion, srd_barbarian_berserker]
  reference_party: [fighter, rogue, wizard, priest]
  # Amendment 2: pure caster, pure martial and hybrids for every Facet (band item 7,
  # DESIGN §8). From 4th level each hybrid must: (a) its swap score ≤ its Facet's best pure
  # build's + swap_tolerance (sampling noise, in points); (b) if Steel is its main track,
  # DPR₁ ≤ its Facet's best pure-martial DPR₁ + job_tolerance; (c) DPR₃ ≤ the best pure
  # caster of its tradition's DPR₃ + job_tolerance. "Best" = the highest among the builds
  # listed for that role.
  roles:
    body:
      pure_martial: [fighter, rogue, barbarian, monk, unbreakable, reckless_striker]
      pure_caster: [body_caster]
      hybrids: [body_ranger, body_battlemage]
    mind:
      pure_martial: [investigator]
      pure_caster: [wizard, loremaster, mind_controller, double_cross]
      hybrids: [tinker, spellblade, armored_caster]
    soul:
      pure_martial: [soul_champion]
      pure_caster: [priest, druid, oracle, healer_engine, soul_blaster, summoner]
      hybrids: [oathsworn, battle_priest, battle_priest_deep, paladin_max]
  tradition_casters:
    thaumaturgy: [wizard, loremaster, mind_controller, double_cross]
    invocation: [priest, druid, oracle, healer_engine, soul_blaster, summoner, body_caster]
  hybrid_rule: {from_level: 4, swap_tolerance_pct: 3, pi_tolerance_pct: 15, job_tolerance_pct: 5}

# `role` names the Amendment 2 shape; `audit` the finding the build tests.
sim_builds:
  # ------------------------------------------------ Amendment 2: the missing pure builds
  - id: body_caster                 # Body's deepest caster: both cross picks on Spell talents (depth 2)
    audit: A2
    role: pure_caster
    facet: body
    tradition: invocation
    domain: the_tide
    abilities: {str: 10, dex: 13, con: 15, int: 8, wis: 16, cha: 12}
    talents: {1: channel, 3: wider_study, 5: alert, 7: hardy, 9: cunning}
    cross: [channel, wider_study]
    extra_domains: {3: presence}
    kit: {armor: chain_mail, shield: true, weapons: [mace]}
  - id: soul_champion               # Soul pure martial: Steel 3, no casting
    audit: A2
    role: pure_martial
    facet: soul
    abilities: {str: 16, dex: 10, con: 14, int: 8, wis: 12, cha: 15}
    talents: {1: sworn_strike, 3: weapon_expert, 5: guardian, 7: warden, 9: hardy}
    cross: [guardian]
    kit: {armor: chain_mail, shield: true, weapons: [longsword]}
  # ------------------------------------------------ hybrids and the audit's combos
  # Audit M8: Body archer with a cross-Facet Spell talent (Hunter's Mark). Steel 3 · Spell 1.
  - id: body_ranger
    audit: M8
    role: hybrid
    facet: body
    tradition: invocation
    domain: beasts
    abilities: {str: 10, dex: 16, con: 15, int: 8, wis: 14, cha: 11}
    talents: {1: marksman, 3: precision, 5: wider_study, 7: weapon_expert, 9: hardy}
    cross: [wider_study]
    extra_domains: {5: storm}
    kit: {armor: studded_leather, shield: false, weapons: [longbow, shortsword]}
  # Audit C1 on Body: heavy armor for free, Extra Attack at 5th, full casting at 7th. Steel 2 · Spell 2.
  - id: body_battlemage
    audit: C1
    role: hybrid
    facet: body
    tradition: invocation
    domain: presence
    abilities: {str: 16, dex: 10, con: 14, int: 8, wis: 15, cha: 12}
    talents: {1: weapon_expert, 3: channel, 5: cleave, 7: wider_study, 9: alert}
    cross: [channel, wider_study]
    extra_domains: {7: the_tide}
    kit: {armor: chain_mail, shield: true, weapons: [longsword]}
  # Audit C2, the Spellblade, rebuilt: Precision + True Strike (Divination) + Extra Attack
  # + casting. Steel 2 · Spell 2 (a tie, so Steel main: Extra Attack and the Half table).
  # Balance pass: its Spell picks are Clockwork Guardian and Turn the Odds (the strongest
  # Spell talents for a blade), not Wider Study and Evoker, so the build tests the shape
  # at its best.
  - id: spellblade
    audit: C2
    role: hybrid
    facet: mind
    domain: divination
    abilities: {str: 8, dex: 16, con: 13, int: 15, wis: 13, cha: 10}
    talents: {1: precision, 3: clockwork_guardian, 5: anatomist, 7: turn_the_odds, 9: hardy}
    kit: {armor: chain_shirt, shield: true, weapons: [rapier]}
  # Amendment 2: a full caster spending one pick on a Steel talent. Spell stays the main
  # track, so the talent brings martial weapons and its own +1 attack/+1 AC in armor, but
  # no armor training or hit die (DESIGN §3.2). Spell 3 · Steel 1.
  - id: armored_caster
    audit: A2
    role: hybrid
    facet: mind
    domain: constructed_force
    abilities: {str: 8, dex: 14, con: 14, int: 16, wis: 13, cha: 10}
    talents: {1: evoker, 3: wider_study, 5: weapon_expert, 7: turn_the_odds, 9: hardy}
    extra_domains: {3: illusion}
    deep_domain: the_arcane
    kit: {armor: null, shield: false, weapons: [quarterstaff]}
  # Audit C1, the Battle Priest: full casting at 3rd; two Steel talents at 5th and 7th make
  # it a 2/2 tie, Steel main — Extra Attack and heavy armor at 7th, and the Half table from
  # then on. Spell 2 · Steel 2.
  - id: battle_priest
    audit: C1
    role: hybrid
    facet: soul
    domain: presence
    abilities: {str: 15, dex: 10, con: 14, int: 8, wis: 16, cha: 12}
    talents: {1: channel, 3: wider_study, 5: sworn_strike, 7: weapon_expert, 9: warden}
    extra_domains: {3: the_tide}
    kit: {armor: scale_mail, shield: true, weapons: [mace]}
    kit_by_level: {5: {weapons: [longsword]}, 7: {armor: chain_mail}}   # heavy armor once Steel is main (7th)
  # Audit C1, worst case at 9th–10th: Steel first (Extra Attack at 5th), then three Spell
  # talents. At 7th it is a 2/2 tie (Steel main: Extra Attack, heavy armor, Half table); at
  # 9th Spell becomes main (Full table and Deep Magic) and the Steel ranks past martial
  # weapons lapse. It can never hold Full casting and Extra Attack together. Steel 2 · Spell 3.
  - id: battle_priest_deep
    audit: C1
    role: hybrid
    facet: soul
    domain: presence
    abilities: {str: 16, dex: 10, con: 14, int: 8, wis: 15, cha: 12}
    talents: {1: sworn_strike, 3: weapon_expert, 5: channel, 7: wider_study, 9: mending_hands}
    extra_domains: {7: the_tide}
    deep_domain: the_living_world
    kit: {armor: chain_mail, shield: true, weapons: [longsword]}
    kit_by_level: {9: {armor: scale_mail}}   # Spell becomes the main track at 9th: heavy armor training lapses
  # Audit C1 (other side): the Oathsworn shape with a second Spell talent (full at 7th).
  # Steel 2 · Spell 2.
  - id: paladin_max
    audit: C1
    role: hybrid
    facet: soul
    domain: presence
    abilities: {str: 16, dex: 10, con: 14, int: 8, wis: 12, cha: 15}
    talents: {1: sworn_strike, 3: mending_hands, 5: weapon_expert, 7: wider_study, 9: hardy}
    extra_domains: {7: binding}
    kit: {armor: chain_mail, shield: true, weapons: [longsword]}
  # Audit M3: the unkillable raging tank. Steel 4.
  - id: unbreakable
    audit: M3
    role: pure_martial
    facet: body
    abilities: {str: 16, dex: 14, con: 15, int: 8, wis: 12, cha: 10}
    talents: {1: rage, 3: hardy, 5: guardian, 7: cleave, 9: weapon_expert}
    kit: {armor: null, shield: true, weapons: [longsword]}
  # Rage + Precision via reckless advantage on a Strength finesse weapon. Steel 3.
  - id: reckless_striker
    audit: new
    role: pure_martial
    facet: body
    abilities: {str: 16, dex: 14, con: 15, int: 8, wis: 12, cha: 10}
    talents: {1: rage, 3: precision, 5: weapon_expert, 7: hardy, 9: alert}
    kit: {armor: null, shield: false, weapons: [rapier]}
  # Audit M1/M2: healing engine (Channel boost + Mending Hands + Field Medic + Goodberry). Spell 3.
  - id: healer_engine
    audit: M1
    role: pure_caster
    facet: soul
    domain: the_tide
    abilities: {str: 13, dex: 10, con: 14, int: 9, wis: 16, cha: 13}
    talents: {1: channel, 3: mending_hands, 5: wider_study, 7: warden, 9: hardy}
    extra_domains: {5: presence}
    deep_domain: the_living_world
    knacks: {2: field_medic}
    kit: {armor: scale_mail, shield: true, weapons: [mace]}
  # Ruling 4: the sorcerer shape — Soul blaster taking Evoker across. Spell 3.
  - id: soul_blaster
    audit: GF-M2
    role: pure_caster
    facet: soul
    domain: fire
    abilities: {str: 8, dex: 14, con: 14, int: 10, wis: 12, cha: 16}
    talents: {1: evoker, 3: wider_study, 5: turn_the_odds, 7: hardy, 9: alert}
    cross: [evoker]
    extra_domains: {3: storm}
    deep_domain: the_undying
    kit: {armor: null, shield: false, weapons: [dagger]}
  # Audit M6: control against bosses. Spell 3.
  - id: mind_controller
    audit: M6
    role: pure_caster
    facet: mind
    domain: illusion
    abilities: {str: 8, dex: 14, con: 14, int: 16, wis: 13, cha: 10}
    talents: {1: wider_study, 3: turn_the_odds, 5: master_plan, 7: clockwork_guardian, 9: hardy}
    extra_domains: {1: divination}
    deep_domain: the_arcane
    kit: {armor: null, shield: false, weapons: [quarterstaff]}
  # Audit M7: summons under exception E2 (Conjure Animals, Animate Dead via Deep Magic). Spell 3.
  - id: summoner
    audit: M7
    role: pure_caster
    facet: soul
    domain: beasts
    abilities: {str: 8, dex: 12, con: 14, int: 10, wis: 16, cha: 13}
    talents: {1: channel, 3: wider_study, 5: prophecy, 7: warden, 9: hardy}
    extra_domains: {3: the_tide}
    deep_domain: the_undying
    kit: {armor: scale_mail, shield: true, weapons: [mace]}
  # Audit m15: stun against a boss (the Monk preset, run against boss encounters).
  - id: monk_stunner
    audit: m15
    role: pure_martial
    preset: monk
  # Audit M4, cross cap: a Mind caster with both cross picks spent on Soul. Spell 3.
  - id: double_cross
    audit: M4
    role: pure_caster
    facet: mind
    domain: constructed_force
    abilities: {str: 8, dex: 14, con: 14, int: 16, wis: 13, cha: 10}
    talents: {1: evoker, 3: mending_hands, 5: wider_study, 7: warden, 9: hardy}
    cross: [mending_hands, warden]
    extra_domains: {5: warding}
    deep_domain: the_arcane
    kit: {armor: null, shield: false, weapons: [quarterstaff]}

# ---------------------------------------------------------------------------- encounters
# Ruling 2. Tier names and targets are fixed here; the budget numbers are derived by the
# simulator and written back into `encounter_table` (null until then). DESIGN §7.
encounter_tiers:
  - id: skirmish
    name: Skirmish
    targets: {win_pct_min: 99, rounds: [1.5, 2.5], party_hp_lost_pct: [5, 15], any_pc_down_pct_max: 5}   # "about 2 rounds" (balance pass)
  - id: clash
    name: Clash
    targets: {win_pct_min: 97, rounds: [3, 4], party_hp_lost_pct: [20, 35], any_pc_down_pct_max: 30}
  - id: battle
    name: Battle
    targets: {win_pct_min: 85, win_pct_max: 95, rounds: [3, 5], party_hp_lost_pct: [35, 55], any_pc_down_pct_max: 70}   # "85–95% with real risk" (balance pass)
  - id: desperate
    name: Desperate
    targets: {win_pct_min: 60, win_pct_max: 85, rounds: [4, 5], party_hp_lost_pct: [55, 90]}
encounter_baseline: {party_size: 4, level: 4, party: reference_party}
# The adventuring day the tables and the balance band assume (balance pass V34): three
# Clashes, a short rest after the first and the second. A single fight gets a third of
# each long-rest pool. Four Clashes with two short rests is a hard day (DESIGN §7).
adventuring_day: {clashes: 3, short_rests_after: [1, 2]}

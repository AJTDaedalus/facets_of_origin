# Facets of Origin — Core Ruleset, Lean Facets v1.0.0
#
# The single source of truth for every mechanic the engine needs (CLAUDE.md,
# Software-PHB Synchronization). The Lean Facets overhaul (docs/BRIEF_lean_facets.md,
# docs/DESIGN_lean_facets.md) replaced the v0.3 ruleset wholesale; the last v0.3
# state is pinned at git tag `pre-lean-facets`.
#
# Shape of the game, in one breath: 2d6 + stat (+1 knack) against 10+/7-9/6-.
# Three stats named for the three Facets. A Facet owns every number; a class owns
# words, kit and picks. HP is grit, weapons roll damage, armour subtracts, enemies
# roll their attacks in the open. Levels 1-10, called by the MM. Magic is
# Domain + Intent + Scope, paid for in Fatigue that fills inventory slots.

id: "base"
name: "Facets of Origin — Core Ruleset"
version: "1.0.0"
authors: ["AJTDaedalus"]
description: >
  The core Lean Facets ruleset: three stats, three Facets with class menus,
  HP and damage dice, one-roll resolution, domain magic paid in Fatigue, and
  levels 1-10.
priority: 0

# ---------------------------------------------------------------------------
# Stats (PHB II.2)
# ---------------------------------------------------------------------------
stats:
  - id: body
    name: Body
    description: >
      Strength, speed, toughness and coordination. Rolled to fight hand to
      hand, climb, run, endure, and to Hold On at 0 HP.
  - id: mind
    name: Mind
    description: >
      Knowledge, perception, reasoning and memory. Rolled to notice, recall,
      work out, and to cast Thaumaturgy.
  - id: soul
    name: Soul
    description: >
      Will, presence, intuition and luck. Rolled to persuade, read people,
      steady your nerve, and to cast Invocation.

stat_rules:
  creation:
    facet_stat: 2        # your Facet's stat
    second: 1            # one other stat of your choice
    third: 0             # the last
  maximum: 3
  increase_levels: [4, 8]
  increase_amount: 1

# ---------------------------------------------------------------------------
# Facets (PHB II.4). Each Facet is a specialization: it owns every number.
# ---------------------------------------------------------------------------
facets:
  - id: body
    name: "Facet of the Body"
    stat: body
    grit_die: 10
    grit_average: 6
    tradition: null
    description: >
      Warriors, scouts, guardians, brawlers. People who solve problems with
      their physical presence in the world.
  - id: mind
    name: "Facet of the Mind"
    stat: mind
    grit_die: 6
    grit_average: 4
    tradition: thaumaturgy
    description: >
      Scholars, investigators, physicians, tacticians and thaumaturges. People
      who solve problems by understanding them.
  - id: soul
    name: "Facet of the Soul"
    stat: soul
    grit_die: 8
    grit_average: 5
    tradition: invocation
    description: >
      Invokers, speakers, wanderers and captains. People who solve problems by
      moving the people around them, or by having it work out.

# ---------------------------------------------------------------------------
# Talents (PHB II.4a/b/c). Options and permissions, not +N bonuses.
#
#   kind: talent     — on the Facet's menu; has an improved form.
#   kind: signature  — taken at level 3 (the class commits); no improved form.
#   use:  passive | at_will | once_per_scene | once_per_session | once_per_rest
#   effects: machine-readable hooks the engine applies itself. A talent with no
#            effects is adjudicated at the table; the app shows its text and
#            tracks its uses.
#   normal: the baseline rule the talent departs from.
#   shared_with: a talent that appears on more than one Facet's menu.
# ---------------------------------------------------------------------------
talents:
  # ============================== BODY ==============================
  - id: weapon_master
    name: Weapon Master
    facet: body
    kind: talent
    use: passive
    choose: "A weapon kind: blades, blunt, polearms, bows, or thrown."
    text: >
      With your chosen kind of weapon, your damage die is one size larger
      (d6 becomes d8, d8 becomes d10, d10 becomes d12).
    improved: >
      When you roll 10+ attacking with your chosen kind, pick two options
      instead of one.
    normal: "A weapon deals the die its category gives it (Chapter IV.1)."
    effects: {weapon_die_step: 1}

  - id: sentinel
    name: Sentinel
    facet: body
    kind: talent
    use: passive
    text: >
      When you Intercept, you may take the attacks aimed at every ally within
      your reach, not just one.
    improved: >
      While you Defend or Intercept you may still attack, at Hard.
    normal: "Intercept protects one ally, and Defend means you do not attack."

  - id: tough
    name: Tough
    facet: body
    kind: talent
    use: passive
    text: "Your maximum HP increases by 4."
    improved: >
      Your Hold On rolls are Easy, and on a 7–9 you stay on your feet at 1 HP
      instead of dropping out of the fight.
    normal: "At 0 HP you take a Wound and roll Hold On at Standard."
    effects: {hp_bonus: 4}

  - id: unarmored_discipline
    name: Unarmored Discipline
    facet: body
    kind: talent
    use: passive
    text: "Wearing no armor and carrying no shield, you have armor 1."
    improved: "Your unarmored armor becomes 2, and your unarmed strikes deal d8."
    normal: "Without armor you have armor 0, and unarmed strikes deal d4."
    effects: {unarmored_armor: 1}
    improved_effects: {unarmored_armor: 2, unarmed_die: 8}

  - id: scouts_eye
    name: Scout's Eye
    facet: body
    kind: talent
    use: passive
    text: >
      You, and anyone following your lead, are never caught by surprise. When
      the MM rolls the Pressure die while you are scouting ahead, roll it twice
      and the MM uses the result you choose.
    improved: >
      Once per scene, ask the MM "what here is most dangerous to us?" and get a
      true answer.
    normal: "Surprise is the MM's call, and the Pressure die is rolled once."

  - id: brawler
    name: Brawler
    facet: body
    kind: talent
    use: passive
    text: >
      Grapples, shoves and throws are attacks for you. On a 7+ you deal your
      unarmed die and also pin, trip or hurl the target, as a stunt.
    improved: "On a 10+ with a brawling attack, take a stunt and +1d6 damage both."
    normal: "A stunt is one of the options on a 10+, in place of extra damage."

  - id: cleave
    name: Cleave
    facet: body
    kind: talent
    use: passive
    text: >
      When your attack drops a foe, deal the damage left over to another foe
      within your reach.
    improved: >
      Against a mob of Mooks, a 7–9 drops two of them and a 10+ drops three.
    normal: "Leftover damage is lost, and one hit drops one Mook."

  - id: marksman
    name: Marksman
    facet: body
    kind: talent
    use: passive
    text: >
      Your ranged attacks ignore the difficulty cover adds, and ignore 1 point
      of the target's armor.
    improved: >
      Once per scene, spend an exchange taking aim (no attack). If your next
      ranged attack rolls 7+, it counts as 10+.
    normal: "Cover can make a ranged attack Hard, and armor subtracts in full."
    effects: {ranged_armor_pierce: 1}

  - id: iron_lungs
    name: Iron Lungs
    facet: body
    kind: talent
    use: passive
    text: >
      You have 2 extra inventory slots. Forced marches, cold, hunger and thirst
      are Easy for you.
    improved: "A breather restores all your HP instead of half."
    normal: "Slots are 10 + Body; a breather restores half your maximum HP."
    effects: {slots_bonus: 2}

  - id: dread_presence
    name: Dread Presence
    facet: body
    kind: talent
    use: once_per_scene
    text: >
      Once per scene, when you drop a foe or land a 10+, force an immediate
      morale check on its allies.
    improved: "Morale checks you force are rolled with +2, so foes break more easily."
    normal: "Morale is checked at the MM's triggers only."

  - id: athlete
    name: Athlete
    facet: body
    kind: talent
    use: passive
    text: >
      Climbing, swimming, jumping and running need no roll unless the danger
      is real; when it is, the roll is Easy.
    improved: >
      Once per scene, move to anywhere you could plausibly reach and still act
      in the same exchange.
    normal: "Athletic feats under pressure are rolled at the MM's difficulty."

  - id: fast_hands
    name: Fast Hands
    facet: body
    kind: talent
    use: passive
    text: >
      Drawing, stowing, swapping or passing an item is a free part of any
      action. Picking locks and sleight of hand are Easy.
    improved: >
      Once per session, pull a mundane item from your pack that you never
      listed. It takes a slot you had free.
    normal: "Juggling gear takes an action, and fine handwork is rolled normally."

  # Body signatures (level 3)
  - id: unstoppable
    name: Unstoppable
    facet: body
    kind: signature
    use: once_per_scene
    text: "Once per scene, when damage would drop you to 0 HP, drop to 1 instead."
    normal: "Damage that takes you to 0 HP means a Wound and a Hold On roll."
  - id: whirlwind
    name: Whirlwind
    facet: body
    kind: signature
    use: once_per_scene
    text: "Once per scene, one attack roll strikes every foe within your reach."
    normal: "An attack roll strikes one foe."
  - id: bulwark
    name: Bulwark
    facet: body
    kind: signature
    use: passive
    text: >
      While you Intercept, allies behind you cannot be targeted by ranged
      attacks at all.
    normal: "Intercept redirects attacks aimed at allies within reach."
  - id: deadeye
    name: Deadeye
    facet: body
    kind: signature
    use: passive
    text: "When a ranged attack rolls 10+, roll your weapon die twice and add them."
    normal: "A 10+ deals your weapon die once, plus one option."
  - id: ghost
    name: Ghost
    facet: body
    kind: signature
    use: passive
    text: >
      Moving alone, you are unseen unless you choose to be seen or roll 6− on
      something loud.
    normal: "Staying hidden is rolled whenever someone might notice you."
  - id: second_wind
    name: Second Wind
    facet: body
    kind: signature
    use: once_per_scene
    text: "Once per scene, take a breather as a free part of any action, mid-fight."
    normal: "A breather takes a few quiet minutes."

  # ============================== MIND ==============================
  - id: thaumaturgy
    name: Thaumaturgy
    facet: mind
    kind: talent
    use: passive
    choose: "A Mind domain (not a prismatic one), and two signature workings."
    text: >
      You cast. Choose a domain from the Mind list; you cast in it with Mind
      (Chapter II.3). Name two signature workings; they are one step Easier.
    improved: "Once per scene, reduce one working's Fatigue by 1."
    normal: "Without a casting talent you have no domain and cannot cast."
    effects: {grants_tradition: thaumaturgy}

  - id: wider_domain
    name: Wider Domain
    facet: mind
    shared_with: [soul]
    kind: talent
    use: passive
    requires: {any_talent: [thaumaturgy, invocation]}
    choose: "A second domain from your tradition."
    text: "You hold a second domain. Workings in it are one step Harder."
    improved: >
      The second domain is no longer Harder, or trade it for a prismatic
      domain of your tradition, which is always one step Harder (level 5+).
    normal: "A caster holds one domain."
    effects: {extra_domain: 1}

  - id: loremaster
    name: Loremaster
    facet: mind
    kind: talent
    use: passive
    text: "When you recall what you know and roll 7+, ask the MM one extra question."
    improved: >
      Once per session, state a fact about history, a creature or a place. It
      is true; the MM may attach a complication.
    normal: "A recall roll answers the question you asked."

  - id: tactician
    name: Tactician
    facet: mind
    kind: talent
    use: passive
    text: >
      Shouting advice across a fight is Help that costs you nothing: you may
      Help an ally and still take your own action.
    improved: >
      Before the first exchange of a fight, each ally may reposition, and one
      ally may make an attack.
    normal: "Help uses your action for the exchange."

  - id: investigator
    name: Investigator
    facet: mind
    kind: talent
    use: passive
    text: >
      When you search, read a scene or catch a lie and roll 7–9, you learn
      what a 10+ would have told you, at a cost.
    improved: >
      Once per scene, ask "what happened here?" and reconstruct the last hour
      from what is in front of you.
    normal: "A 7–9 gives a partial answer."

  - id: tinker
    name: Tinker
    facet: mind
    kind: talent
    use: passive
    text: >
      With tools and a scene, you can repair, jury-rig or build a simple
      device. You may carry one extra curio.
    improved: >
      Once per session, make a curio of your choice from the curio table out
      of salvage (the MM approves).
    normal: "You may carry three curios."
    effects: {curio_bonus: 1}

  - id: physician
    name: Physician
    facet: mind
    kind: talent
    use: passive
    text: >
      During a breather you can treat one Wound, which clears, and everyone
      you tend recovers 2 extra HP.
    improved: "You treat every Wound on one patient, or one Wound on everyone."
    normal: "Wounds clear one per night of rest."

  - id: linguist
    name: Linguist
    facet: mind
    kind: talent
    use: passive
    text: "Given a scene, you read, speak or decode any common tongue or script."
    improved: >
      Once per session, communicate meaningfully with anything that thinks,
      whatever it speaks.
    normal: "Unfamiliar languages need a translator or a roll."

  - id: pathfinder
    name: Pathfinder
    facet: mind
    kind: talent
    use: passive
    text: >
      You never get lost, and journeys you guide roll the Pressure die one
      fewer time.
    improved: "Once per session, find a shortcut, a hidden route or a safe haven."
    normal: "The Pressure die is rolled once per leg of a journey."

  - id: studied_foe
    name: Studied Foe
    facet: mind
    kind: talent
    use: at_will
    text: >
      Spend your action studying a foe. Until the end of the next exchange,
      your allies' attacks on it are Easy.
    improved: "Studying a foe also tells you its SPECIAL or its WHEN BLOODIED line."
    normal: "Observation informs the fiction but sets no difficulty."

  - id: alchemist
    name: Alchemist
    facet: mind
    kind: talent
    use: once_per_rest
    text: >
      During a night's rest, brew one draught: a healing draught (restores
      d6 + your level HP), a clearing tonic (removes 1 Fatigue) or a smoke
      flask (the whole party slips away from one fight). It is a curio.
    improved: "Brew two draughts each night's rest."
    normal: "Draughts come from loot or purchase."

  # Mind signatures (level 3)
  - id: arcane_mastery
    name: Arcane Mastery
    facet: mind
    kind: signature
    use: passive
    requires: {any_talent: [thaumaturgy, invocation]}
    text: "One of your signature workings costs 1 less Fatigue (minimum 0)."
    normal: "A working costs the Fatigue its scope sets."
  - id: counterspell
    name: Counterspell
    facet: mind
    kind: signature
    use: once_per_scene
    text: >
      Once per scene, when a working is cast within your sight, roll Mind. On
      a 10+ it fails; on a 7–9 it is weakened.
    normal: "Only a caster's own dice decide a working."
  - id: master_plan
    name: Master Plan
    facet: mind
    kind: signature
    use: once_per_session
    text: >
      Once per session, flash back to a preparation you made earlier. Within
      reason, the MM accepts that you made it.
    normal: "Preparation has to happen on screen."
  - id: anatomist
    name: Anatomist
    facet: mind
    kind: signature
    use: passive
    text: "Your attacks, and your allies' attacks, on a foe you have studied ignore its armor."
    normal: "Armor subtracts from every hit."
  - id: field_surgeon
    name: Field Surgeon
    facet: mind
    kind: signature
    use: passive
    text: "An ally you tend when they are dying counts their Hold On as 10+."
    normal: "Tending a dying ally only saves them; they still take the Wound."
  - id: polymath
    name: Polymath
    facet: mind
    kind: signature
    use: passive
    text: "Take two talents from any Facet's menu without a teacher (never a casting talent)."
    normal: "Talents from another Facet need a teacher found in play."

  # ============================== SOUL ==============================
  - id: invocation
    name: Invocation
    facet: soul
    kind: talent
    use: passive
    choose: "A Soul domain (not a prismatic one), and two signature workings."
    text: >
      You cast. Choose a domain from the Soul list; you cast in it with Soul
      (Chapter II.3). Name two signature workings; they are one step Easier.
    improved: "Once per scene, reduce one working's Fatigue by 1."
    normal: "Without a casting talent you have no domain and cannot cast."
    effects: {grants_tradition: invocation}

  - id: silver_tongue
    name: Silver Tongue
    facet: soul
    kind: talent
    use: passive
    text: >
      When you persuade, bargain or deceive and roll 7–9, the MM offers two
      costs and you choose.
    improved: >
      Once per scene, shift a reaction one step warmer: hostile to wary, wary
      to open.
    normal: "On a 7–9 the MM names the cost."

  - id: lucky
    name: Lucky
    facet: soul
    kind: talent
    use: once_per_session
    text: >
      Once per session, reroll any roll you can see, yours or anyone's, and
      keep whichever result you prefer.
    improved: "Twice per session."
    normal: "A roll stands."
    effects: {rerolls_per_session: 1}
    improved_effects: {rerolls_per_session: 2}

  - id: inspiring
    name: Inspiring
    facet: soul
    kind: talent
    use: once_per_scene
    text: >
      Once per scene, speak a rousing word. Each ally who hears it adds a d6 to
      their next roll and keeps the best two.
    improved: "Each ally who hears it also recovers d6 HP."
    normal: "Help gives one ally one extra die."

  - id: empath
    name: Empath
    facet: soul
    kind: talent
    use: passive
    text: >
      You can always tell what the person in front of you feels most strongly,
      and ask the MM one question about what they want.
    improved: "Once per scene, calm a creature or a crowd one step (hostile to wary) without a roll."
    normal: "Reading people is a roll."

  - id: beast_friend
    name: Beast Friend
    facet: soul
    kind: talent
    use: passive
    text: >
      Animals are never hostile to you unless provoked. You may keep a loyal
      animal companion: a Mook of your level with one trick.
    improved: "Your companion becomes a Standard foe of your level, fighting at your side."
    normal: "Animals react as the reaction roll says."

  - id: performer
    name: Performer
    facet: soul
    kind: talent
    use: at_will
    text: >
      When you perform for a crowd, roll Soul. On a 10+ they are yours: a
      favor, coin, or a distraction you choose. On a 7–9, some of them are.
    improved: "Your performance can hold a hostile group still for one exchange."
    normal: "Performing is a roll with no set reward."

  - id: captain
    name: Captain
    facet: soul
    kind: talent
    use: passive
    text: >
      You may keep up to two retainers, loyal hirelings who follow you into
      danger. Their morale uses your Soul.
    improved: "Up to four retainers, and theirs never breaks while you are standing."
    normal: "Hirelings are NPCs with their own morale."

  - id: warding_presence
    name: Warding Presence
    facet: soul
    kind: talent
    use: once_per_scene
    text: >
      Once per scene, before an enemy rolls against an ally within your reach,
      make that roll Hard.
    improved: "Twice per scene."
    normal: "Enemy attacks roll at the difficulty the fight sets."

  - id: streetwise
    name: Streetwise
    facet: soul
    kind: talent
    use: passive
    text: >
      In any settlement, a scene of looking finds the person, fence, rumor or
      safe house you need. Rumors rolled for you are true.
    improved: "You have a contact in every sizable town; name them when you need them."
    normal: "Finding people is a roll, and rumors may be false."

  - id: hunch
    name: Hunch
    facet: soul
    kind: talent
    use: once_per_scene
    text: >
      Once per scene, ask the MM a yes-or-no question ("is this a trap?",
      "is this the way?") and get a truthful yes, no or maybe.
    improved: "Twice per scene."
    normal: "The MM answers what your character could perceive."

  # Soul signatures (level 3)
  - id: miracle
    name: Miracle
    facet: soul
    kind: signature
    use: once_per_session
    requires: {any_talent: [thaumaturgy, invocation]}
    text: "Once per session, cast a Major working for no Fatigue."
    normal: "A Major working costs 2 Fatigue."
  - id: rallying_cry
    name: Rallying Cry
    facet: soul
    kind: signature
    use: once_per_session
    text: >
      Once per session, every ally at 0 HP within earshot stands with d6 HP,
      and every ally adds a d6 to their next roll.
    normal: "An ally at 0 HP stays down until tended or rested."
  - id: beloved
    name: Beloved
    facet: soul
    kind: signature
    use: passive
    text: "Reaction rolls toward you are never hostile unless you have given them cause."
    normal: "The reaction roll can come up hostile."
  - id: serendipity
    name: Serendipity
    facet: soul
    kind: signature
    use: once_per_session
    text: "Once per session, declare a coincidence that helps you. It happens; the MM adds a twist."
    normal: "The world's coincidences are the MM's."
  - id: unbreakable_will
    name: Unbreakable Will
    facet: soul
    kind: signature
    use: passive
    text: >
      You shrug off fear, charm and possession without a roll, unless the
      source is 3 or more levels above you.
    normal: "Resisting fear, charm and possession is an avoid roll."
  - id: voice_of_command
    name: Voice of Command
    facet: soul
    kind: signature
    use: once_per_scene
    text: >
      Once per scene, give a one-word command to a foe of your level or lower.
      It obeys for one exchange, unless obeying would kill it.
    normal: "Foes do as their conduct says."

# ---------------------------------------------------------------------------
# Classes (PHB II.4). A preset is a saved bundle from its Facet's menu; a custom
# class is the same five lines written by the player.
# ---------------------------------------------------------------------------
classes:
  - id: warrior
    name: Warrior
    facet: body
    concept: "I am a trained fighter who stands where the fighting is thickest."
    knack: "Soldiering"
    talents: [weapon_master, tough]
    signature: unstoppable
    kit: [standard_weapon, heavy_armor, shield, rope, rations]
  - id: scout
    name: Scout
    facet: body
    concept: "I am a pathfinder and bowman who sees trouble first."
    knack: "Wild country"
    talents: [scouts_eye, marksman]
    signature: deadeye
    kit: [longbow, arrows, light_weapon, light_armor, rope, rations]
  - id: guardian
    name: Guardian
    facet: body
    concept: "I am a shield for the people behind me."
    knack: "Bodyguard work"
    talents: [sentinel, tough]
    signature: bulwark
    kit: [standard_weapon, shield, heavy_armor, rations]
  - id: brawler
    name: Brawler
    facet: body
    concept: "I am a fighter who needs nothing but my hands."
    knack: "Street fighting"
    talents: [brawler, unarmored_discipline]
    signature: second_wind
    kit: [light_weapon, rope, rations, torches]

  - id: thaumaturge
    name: Thaumaturge
    facet: mind
    concept: "I am a scholar whose study became a working art."
    knack: "Arcane theory"
    talents: [thaumaturgy, loremaster]
    signature: arcane_mastery
    kit: [staff, books, ink_and_chalk, light_armor, rations]
  - id: investigator
    name: Investigator
    facet: mind
    concept: "I am the one who notices what everyone else missed."
    knack: "Crime and its habits"
    talents: [investigator, studied_foe]
    signature: master_plan
    kit: [light_weapon, lantern, oil, ink_and_chalk, rations]
  - id: physician
    name: Physician
    facet: mind
    concept: "I am a healer who keeps the others alive."
    knack: "Medicine"
    talents: [physician, alchemist]
    signature: field_surgeon
    kit: [light_weapon, healers_kit, bandages, rations]
  - id: tactician
    name: Tactician
    facet: mind
    concept: "I am a strategist who sees the fight before it starts."
    knack: "Warfare"
    talents: [tactician, studied_foe]
    signature: anatomist
    kit: [standard_weapon, light_armor, maps, rations]

  - id: invoker
    name: Invoker
    facet: soul
    concept: "I am a channel for a power that answers when I call."
    knack: "Rites and spirits"
    talents: [invocation, empath]
    signature: miracle
    kit: [staff, holy_symbol, light_armor, rations]
  - id: speaker
    name: Speaker
    facet: soul
    concept: "I am the voice that ends fights before they start."
    knack: "Courts and bargains"
    talents: [silver_tongue, streetwise]
    signature: voice_of_command
    kit: [light_weapon, fine_clothes, rations]
  - id: wanderer
    name: Wanderer
    facet: soul
    concept: "I am luck-touched, and it has always worked out, somehow."
    knack: "The open road"
    talents: [lucky, hunch]
    signature: serendipity
    kit: [light_weapon, bedroll, rope, rations]
  - id: captain
    name: Captain
    facet: soul
    concept: "I am the one people follow into danger."
    knack: "Command"
    talents: [captain, inspiring]
    signature: rallying_cry
    kit: [standard_weapon, light_armor, shield, rations]

# ---------------------------------------------------------------------------
# Core resolution (PHB III.1)
# ---------------------------------------------------------------------------
roll_resolution:
  dice: "2d6"
  modifier_source: stat
  knack_bonus: 1            # one knack, never stacked
  bonus_cap: 4              # stat + knack + any talent bonus never exceeds +4
  thresholds:
    full_success: 10
    partial_success: 7
  outcomes:
    full_success:
      label: "Full Success"
      description: "You achieve your goal cleanly."
    partial_success:
      label: "Success with Cost"
      description: "You succeed, but with a complication or cost. The story moves forward at a price."
    failure:
      label: "Things Go Wrong"
      description: "Things go wrong — but the story always moves forward."
  critical:
    natural: high
    min_outcome: full_success
    label: "Natural 12"
    description: "A full success, and something more besides — the player names it."
  fumble:
    natural: low
    label: "Natural 2"
    description: "If the roll failed, the Graceful Fail is confirmed without asking."
  borrowed_trouble:
    extra_dice: 1
    spark_cost: 0
    max_per_roll: 1
  help:
    extra_dice: 1
    max_per_roll: 1
    helper_shares_cost: true
  difficulty_modifiers:
    - label: Easy
      modifier: 1
      description: "Clear advantage, weak or inattentive opposition, favorable conditions."
    - label: Standard
      modifier: 0
      description: "The default — uncertain outcome, no special advantage or impediment."
    - label: Hard
      modifier: -1
      description: "Skilled opposition, poor conditions, acting against the grain."
    - label: "Very Hard"
      modifier: -2
      description: "Extraordinary opposition, severe circumstances, nearly impossible odds."
  outcome_tiers:
    - id: full_success
      threshold: 10
      label: "Full Success"
      description: "You achieve your goal cleanly."
    - id: partial_success
      threshold: 7
      label: "Success with Cost"
      description: "You succeed, but with a complication or cost. The story moves forward at a price."
    - id: failure
      threshold: null
      label: "Things Go Wrong"
      description: "Things go wrong — but the story always moves forward."
  avoid:
    # The old saving throw: 2d6 + the stat that fits what is acting on you.
    modifier_source: stat
    default_difficulty: Standard
    outcomes:
      full_success: "You avoid it entirely."
      partial_success: "You avoid the worst of it; something lingers."
      failure: "It takes hold."
  contested_roll:
    vs_npc: {only_pc_rolls: true}
    vs_pc: {both_roll: true, higher_wins: true, tie_result: both_partial_success}
  group_roll:
    majority_rule: partial_success_or_better_counts

# ---------------------------------------------------------------------------
# Sparks (PHB III.1) — unchanged in substance from v0.3.
# ---------------------------------------------------------------------------
spark:
  base_sparks_per_session: 3
  mechanic:
    spend: per_spark_add_d6_drop_lowest
    description: >
      Each Spark adds a d6 to your roll; you keep the best two dice. Spend
      Sparks before you roll.
  earn_methods:
    - id: act_break_nomination
      label: "Act Break Nomination"
      description: >
        After a major scene transition, each player may nominate one other
        player for something they did in the scene just past. The MM confirms.
    - id: graceful_fail
      label: "The Graceful Fail"
      description: >
        On any 6-, narrate how you make the failure worse or richer for the
        story and claim a Spark; the MM confirms.
    - id: peer_call
      label: "\"Spark?\" — the Peer Call"
      description: >
        Any player may call out "Spark?" for another player's moment. The MM
        confirms.
    - id: mm_award
      label: "MM Award"
      description: >
        The MM gives a Spark for exceptional roleplay, creative problem-solving,
        or playing your character's traits and weaknesses at a real cost.

# ---------------------------------------------------------------------------
# Advancement (PHB II.4) — levels 1-10, called by the MM.
# ---------------------------------------------------------------------------
advancement:
  max_level: 10
  starting_talents: 2
  signature_level: 3
  respec_until_level: 3          # free rebuilds before the class commits
  stat_increase_levels: [4, 8]
  signature_working_levels: [5, 9]   # casters name one more signature working
  damage_bonus:                  # added to every damage roll you make
    - {level: 3, bonus: 1}
    - {level: 6, bonus: 2}
    - {level: 9, bonus: 3}
  improve_requires_levels_held: 1    # improve a talent you have held a level
  off_facet_requires: teacher        # a teacher found in play
  prompts:
    - id: discovery
      text: "Did we discover something new about the world?"
    - id: treasure
      text: "Did we bring treasure home?"
    - id: goal
      text: "Did someone pursue their character's goal?"
    - id: change
      text: "Did we change the world, for better or worse?"
    - id: moment
      text: "Did someone make a moment the whole table will remember?"
  pacing:
    - {level: 2, after_session: 1}
    - {level: 3, after_session: 3}
    - {level: 4, after_session: 5}
    - {level: 5, after_session: 7}
    - {level: 6, after_session: 10}
    - {level: 7, after_session: 13}
    - {level: 8, after_session: 16}
    - {level: 9, after_session: 19}
    - {level: 10, after_session: 22}

# ---------------------------------------------------------------------------
# Durability, recovery and death (PHB III.2)
# ---------------------------------------------------------------------------
hp:
  level_one: grit_die_max_plus_body   # die maximum + Body
  per_level: grit_die_or_average      # roll the die, or take the average
  minimum_gain: 1
recovery:
  breather: {restores: half_max_hp, pressure_roll_if_dangerous: true}
  night_rest: {restores: full_hp, clears_fatigue: all, clears_wounds: 1}
wounds:
  takes_slot: true
  effect: "Rolls that strain the injury are Hard."
  table: wounds
hold_on:
  stat: body
  outcomes:
    full_success: "You stand at 1 HP."
    partial_success: "You are out of the fight, but conscious."
    failure: "You are dying. An ally who tends you before the scene ends saves you."
death:
  broken_is_lethal: false
  death_choice: [permanent_scar, heroic_death]
  scar_table: scars
slots:
  base: 10
  plus_stat: body
  coin_per_slot: 100
  curio_limit: 3

# ---------------------------------------------------------------------------
# Magic (PHB II.3)
# ---------------------------------------------------------------------------
magic:
  traditions:
    thaumaturgy: {stat: mind, facet: mind, style: scholarly}
    invocation: {stat: soul, facet: soul, style: intuitive}
  scopes:
    - id: minor
      label: Minor
      difficulty: Standard
      fatigue: 0
      min_level: 1
      damage: null
      description: "Small, local, brief. Never deals damage and never decides anything; in a fight it is a stunt."
    - id: significant
      label: Significant
      difficulty: Standard
      fatigue: 1
      min_level: 1
      damage: "1d8"
      targets: one
      description: "Meaningful power or precision: a door fused, a person bound, one foe struck."
    - id: major
      label: Major
      difficulty: Hard
      fatigue: 2
      min_level: 3
      damage: "2d8"
      targets: group
      description: "Scene-changing: a building, a crowd, a group of foes, an effect that endures."
  signature_step: 1              # signature workings are one step Easier
  starting_signature_workings: 2
  wider_domain_step: -1          # a second domain is one step Harder until improved
  prismatic_step: -1
  heavy_armor_extra_fatigue: 1
  fatigue_takes_slot: true
  fatigue_clears_on: night_rest
  complication_table: magic_complications
  mishap_table: magic_mishaps
  lineage_gift_scope: minor      # a gifted lineage casts Minor only, free

# ---------------------------------------------------------------------------
# Combat (PHB III.3). Players roll to act; enemies roll their attacks in the
# open. `app/game/combat.py` is the only implementation; the simulator drives it.
# ---------------------------------------------------------------------------
combat:
  exchange_steps: [telegraph, players_act, enemies_attack, narrate, end_exchange]
  attack:
    full_success:
      damage: weapon_die
      pick_one: [extra_damage, stunt, cover]
    partial_success:
      damage: weapon_die
      exposed: true          # next enemy attack on you this exchange: +1 die, keep best two
    failure:
      damage: none
      mm_move: true
  options:
    extra_damage: {label: "+1d6 damage", dice: "1d6"}
    stunt: {label: "Stunt", description: "Push, disarm, pin, trip, or open it up: an ally's next attack on it is Easy."}
    cover: {label: "Cover", description: "Attacks on an ally you name are Hard this exchange."}
  exposure:
    applies_when: partial_success_within_reach
    extra_enemy_dice: 1
  enemy_attack:
    dice: "2d6"
    full_success: {hit: true, damage_bonus: 2, label: "Hard hit"}
    partial_success: {hit: true, damage_bonus: 0, label: "Hit"}
    failure: {hit: false, label: "Miss"}
    natural_high: "The MM names something more."
    natural_low: "The target gets an opening: their next attack on this foe is Easy."
  defend:
    enemy_difficulty: Hard     # attacks on a defender roll at -1
  intercept:
    as_defend: true
  armor:
    minimum_damage: 1
    cap: 3
  level_gap:                   # your attacks on a foe above your level
    - {gap: 3, difficulty: Hard}
    - {gap: 6, difficulty: "Very Hard"}
  unarmed_die: 4

# ---------------------------------------------------------------------------
# Monsters (MM1). One dial (level) and a role. The card holds the texture.
# ---------------------------------------------------------------------------
monsters:
  level_table:
    - {level: 1,  hp: 8,  damage: 3, attack: 1}
    - {level: 2,  hp: 11, damage: 3, attack: 1}
    - {level: 3,  hp: 14, damage: 4, attack: 2}
    - {level: 4,  hp: 17, damage: 4, attack: 2}
    - {level: 5,  hp: 20, damage: 5, attack: 2}
    - {level: 6,  hp: 23, damage: 5, attack: 3}
    - {level: 7,  hp: 26, damage: 6, attack: 3}
    - {level: 8,  hp: 29, damage: 6, attack: 3}
    - {level: 9,  hp: 32, damage: 7, attack: 4}
    - {level: 10, hp: 35, damage: 7, attack: 4}
  roles:
    mook:     {hp: drops_to_any_hit, damage_mod: -1, attack_mod: -1, attacks: 1, mob: true, mob_damage_per_extra: 1, mob_damage_cap: 4}
    standard: {hp_mult: 1, damage_mod: 0, attack_mod: 0, attacks: 1}
    elite:    {hp_mult: 2, damage_mod: 0, attack_mod: 0, attacks: 2}
    boss:     {hp_mult: 4, damage_mod: 1, attack_mod: 0, attacks: 2, bloodied_phase: true}
  morale:
    dice: "2d6"
    breaks_when: roll_exceeds_morale
    default: 7
    fearless: 12
    triggers: [first_to_fall, half_down, leader_down, lone_and_hurt]
  bloodied_at: half_hp
  armor_range: [0, 2]

# ---------------------------------------------------------------------------
# Hazards and exploration (PHB III.2, MM6)
# ---------------------------------------------------------------------------
hazards:
  threat_clock:
    segments: 4
    advances_on: [partial_success, failure]
    wind_back_cost: 1_action
    wind_back_requires_roll: false
exploration:
  pressure_die:
    dice: "1d6"
    table: pressure_generic
    rolled: [each_exploration_turn, each_journey_leg, breather_in_danger]
  reaction_roll:
    dice: "2d6"
    table: reaction
  usage_die:
    steps: [8, 6, 4]
    steps_down_on: [1, 2]

# ---------------------------------------------------------------------------
# Equipment (PHB IV.1) and treasure (PHB IV.2)
# ---------------------------------------------------------------------------
equipment:
  weapon_categories:
    unarmed:  {die: 4, slots: 0, examples: "Fists, feet, grappling."}
    light:    {die: 6, slots: 1, examples: "Dagger, short sword, hand crossbow, sling.", notes: "Easy to hide; can be thrown."}
    standard: {die: 8, slots: 1, examples: "Longsword, mace, spear, axe, staff."}
    heavy:    {die: 10, slots: 2, examples: "Greatsword, maul, halberd.", notes: "Two hands. Loud."}
    ranged:   {die: 8, slots: 1, examples: "Longbow, crossbow.", notes: "Needs ammunition (usage die)."}
  weapon_kinds: [blades, blunt, polearms, bows, thrown]
  armor:
    none:  {armor: 0, slots: 0}
    light: {armor: 1, slots: 1, notes: "Leather, padded, a chain shirt."}
    heavy: {armor: 2, slots: 2, notes: "Plate, full mail. Stealth is Hard; a caster's full workings cost 1 extra Fatigue."}
    shield: {armor: 1, slots: 1, notes: "Adds to worn armor. Needs a hand."}
  items:
    - {id: light_weapon, name: "Light weapon", slots: 1, weapon: light}
    - {id: standard_weapon, name: "Standard weapon", slots: 1, weapon: standard}
    - {id: heavy_weapon, name: "Heavy weapon", slots: 2, weapon: heavy}
    - {id: longbow, name: "Longbow", slots: 1, weapon: ranged, kind: bows}
    - {id: staff, name: "Staff", slots: 1, weapon: standard, kind: blunt}
    - {id: arrows, name: "Arrows", slots: 1, usage_die: 8}
    - {id: light_armor, name: "Light armor", slots: 1, armor: light}
    - {id: heavy_armor, name: "Heavy armor", slots: 2, armor: heavy}
    - {id: shield, name: "Shield", slots: 1, armor: shield}
    - {id: rations, name: "Rations", slots: 1, usage_die: 6}
    - {id: torches, name: "Torches", slots: 1, usage_die: 6}
    - {id: lantern, name: "Lantern", slots: 1}
    - {id: oil, name: "Lamp oil", slots: 1, usage_die: 6}
    - {id: rope, name: "Rope, 50 ft", slots: 1}
    - {id: bedroll, name: "Bedroll", slots: 1}
    - {id: books, name: "Books and notes", slots: 1}
    - {id: ink_and_chalk, name: "Ink, chalk and paper", slots: 1}
    - {id: maps, name: "Maps and charts", slots: 1}
    - {id: healers_kit, name: "Healer's kit", slots: 1, usage_die: 6}
    - {id: bandages, name: "Bandages", slots: 1, usage_die: 6}
    - {id: holy_symbol, name: "Holy symbol", slots: 1}
    - {id: fine_clothes, name: "Fine clothes", slots: 1}
    - {id: tools, name: "Tools of a trade", slots: 1}
    - {id: crowbar, name: "Crowbar", slots: 1}
  starting_coin: "2d6x10"
  price_guide:
    - {label: "Cheap", coin: 1, examples: "A meal, a night in a common room, a torch."}
    - {label: "Fair", coin: 10, examples: "A weapon, rope, a week of rations, a mule for a day."}
    - {label: "Costly", coin: 100, examples: "Heavy armor, a horse, a favor from someone important."}
treasure:
  curio_limit: 3
  tables: [trinkets, curios, relics]
  relics_usable_by_anyone: true   # a relic's power is the item's; it does not make its bearer a caster

# ---------------------------------------------------------------------------
# MM tables live in tables.yaml beside this file (MM6 is generated from them).
# ---------------------------------------------------------------------------
tables_file: tables.yaml

# ---------------------------------------------------------------------------
# Lineages (PHB II.5). A gifted lineage gives a gift knack and, optionally, a
# Minor-only domain; the core ships only the ungifted baseline.
# ---------------------------------------------------------------------------
lineages:
  - id: human
    name: Human
    variants: [folk, people]
    description: >
      The default of the core rules and of Shattered Origin. Humans are what
      the rest of the book assumes: no gift, and nothing on the sheet that a
      Facet, a class and a background do not put there. Every example
      character in this book is human.
    gift: null
    gift_domain_scope: null
    playable: true

# ---------------------------------------------------------------------------
# Backgrounds (PHB II.6). A background is a history, a background knack and a
# Specialty. These fifteen are examples; a player may write their own.
# ---------------------------------------------------------------------------
backgrounds:
- id: city_watch_veteran
  name: City Watch Veteran
  facet: body
  knack: City Watch Veteran
  specialty: Knows the layout, regular occupants, and unofficial rules of one specific district or settlement
    from your service years.
- id: traveling_merchants_guard
  name: Traveling Merchant's Guard
  facet: body
  knack: Traveling Merchant's Guard
  specialty: Can read road conditions and assess the likelihood of ambush or delay based on terrain, weather,
    and recent traffic sign.
- id: arena_fighter
  name: Arena Fighter
  facet: body
  knack: Arena Fighter
  specialty: Reads an opponent's fighting style and general skill level within the first exchange of a
    fight, accurately enough to brief an ally.
- id: wilderness_scout
  name: Wilderness Scout
  facet: body
  knack: Wilderness Scout
  specialty: Can track a person or animal across terrain they've passed through within the last day, given
    minimal sign.
- id: dockworker
  name: Dockworker
  facet: body
  knack: Dockworker
  specialty: Knows how cargo manifests work, how they get falsified, and what a legitimate versus suspicious
    shipment looks like on paper and on the dock.
- id: guild_apprentice
  name: Guild Apprentice
  facet: mind
  knack: Guild Apprentice
  specialty: Knows the technical vocabulary, record-keeping, and internal personnel of the guild or institution
    that trained you, well enough to read its documents and recognise its work.
- id: physicians_assistant
  name: Physician's Assistant
  facet: mind
  knack: Physician's Assistant
  specialty: Recognizes symptoms of common diseases, poisons, and injuries accurately enough to name them
    and describe their progression.
- id: court_interpreter
  name: Court Interpreter
  facet: mind
  knack: Court Interpreter
  specialty: Fluent in two languages beyond your native tongue; can make oneself understood in a third
    through careful effort.
- id: archive_researcher
  name: Archive Researcher
  facet: mind
  knack: Archive Researcher
  specialty: Can navigate any organized record system to find what is actually there, including things
    that have been quietly misfiled.
- id: hedge_scholar
  name: Hedge Scholar
  facet: mind
  knack: Hedge Scholar
  specialty: Has read widely enough to have encountered at least a surface familiarity with almost any
    scholarly topic.
- id: street_performer
  name: Street Performer
  facet: soul
  knack: Street Performer
  specialty: Can assess a crowd's mood, attention, and the best angle of approach within a few moments
    of observation.
- id: temple_acolyte
  name: Temple Acolyte
  facet: soul
  knack: Temple Acolyte
  specialty: Recognizes the rituals, symbols, and internal politics of one specific religious tradition
    in detail.
- id: traveling_merchant
  name: Traveling Merchant
  facet: soul
  knack: Traveling Merchant
  specialty: Can accurately assess the fair market value of common goods and identify when a price represents
    opportunity, desperation, or a trap.
- id: former_criminal
  name: Former Criminal
  facet: soul
  knack: Former Criminal
  specialty: Knows how a particular type of criminal operation works from the inside and can recognize
    one when they see it.
- id: luck_touched_wanderer
  name: Luck-Touched Wanderer
  facet: soul
  knack: Luck-Touched Wanderer
  specialty: Has an uncanny sense for when a situation is about to turn — when the calm is the wrong kind
    of calm.

# ---------------------------------------------------------------------------
# Domain catalog (Appendix: Magic Domains). Types are gone: breadth is now a
# talent (Wider Domain) and identity is the signature working.
# ---------------------------------------------------------------------------
magic_domains:
- id: illusion
  name: Illusion
  facet: mind
  tradition: thaumaturgy
  prismatic: false
  description: 'The construction of false sensory experience: images, sounds, smells, textures, and temperatures
    that are not there.'
- id: warding
  name: Warding
  facet: mind
  tradition: thaumaturgy
  prismatic: false
  description: The inscription of protective limits into physical space or objects.
- id: inscription
  name: Inscription
  facet: mind
  tradition: thaumaturgy
  prismatic: false
  description: 'The encoding of magical effects into physical surfaces: runes, marks, glyphs, and patterns
    that hold an effect in suspended state until a defined trigger releases it.'
- id: transmutation
  name: Transmutation
  facet: mind
  tradition: thaumaturgy
  prismatic: false
  description: 'The structural alteration of non-living material: changing what something is made of,
    reshaping its form, altering its properties.'
- id: divination
  name: Divination
  facet: mind
  tradition: thaumaturgy
  prismatic: false
  description: 'The gathering of information through magical means: reading the history of an object or
    place, perceiving events at a distance, asking precise questions about the state of the world and
    receiving answers, sensing lies and hidden truths, and at Major scope, perceiving the broad shape
    of events across significant distances or time gaps (recent past and near future only).'
- id: constructed_force
  name: Constructed Force
  facet: mind
  tradition: thaumaturgy
  prismatic: false
  description: The generation and direction of invisible force — telekinesis, barriers, shaped pressure,
    and impact without physical source.
- id: the_arcane
  name: The Arcane
  facet: mind
  tradition: thaumaturgy
  prismatic: true
  description: The fundamental substrate of magical practice itself — the ability to perceive, manipulate,
    counter, and redirect magical workings regardless of their source or domain.
- id: the_constructed_mind
  name: The Constructed Mind
  facet: mind
  tradition: thaumaturgy
  prismatic: true
  description: 'The creation and direction of artificial intelligence: magical constructs with independent
    cognition, from simple automatons capable of following complex instructions to genuine minds capable
    of reasoning, learning, and independent action.'
- id: chronomancy
  name: Chronomancy
  facet: mind
  tradition: thaumaturgy
  prismatic: true
  description: Time.
- id: fire
  name: Fire
  facet: soul
  tradition: invocation
  prismatic: false
  description: Heat, flame, combustion, and the light produced by fire.
- id: shadow
  name: Shadow
  facet: soul
  tradition: invocation
  prismatic: false
  description: Darkness, the absence of light, and the physical sensation of cold that accompanies true
    shadow.
- id: storm
  name: Storm
  facet: soul
  tradition: invocation
  prismatic: false
  description: Wind, rain, lightning, thunder, and the behavior of weather within a scene.
- id: beasts
  name: Beasts
  facet: soul
  tradition: invocation
  prismatic: false
  description: Communication with, calming of, commanding of, and minor shaping of animals and mundane
    creatures.
- id: resonance
  name: Resonance
  facet: soul
  tradition: invocation
  prismatic: false
  description: Sound, vibration, and harmonic force.
- id: verdance
  name: Verdance
  facet: soul
  tradition: invocation
  prismatic: false
  description: 'Living plants: growing, shaping, animating, and communicating with plant life.'
- id: binding
  name: Binding
  facet: soul
  tradition: invocation
  prismatic: false
  description: The creation and enforcement of oaths, pacts, and spiritual constraints.
- id: presence
  name: Presence
  facet: soul
  tradition: invocation
  prismatic: false
  description: The force of a person's spiritual weight in a space — their warmth, authority, terror,
    or calm, projected outward as a tangible thing.
- id: the_tide
  name: The Tide
  facet: soul
  tradition: invocation
  prismatic: false
  description: The ebb and flow of natural energy between living things — vitality passing from one form
    to another.
- id: the_undying
  name: The Undying
  facet: soul
  tradition: invocation
  prismatic: true
  description: Death, the boundary between living and dead, spirits of the departed, and the animating
    force that lingers after life ends.
- id: fate
  name: Fate
  facet: soul
  tradition: invocation
  prismatic: true
  description: Probability, luck, and the threads of what is likely to happen.
- id: the_living_world
  name: The Living World
  facet: soul
  tradition: invocation
  prismatic: true
  description: The animating current that runs through all living things simultaneously — not specific
    to plants or beasts or people, but the shared force of existing as a creature in the world.

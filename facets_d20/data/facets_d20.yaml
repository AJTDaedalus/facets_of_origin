# Facets d20 — Facets, tracks, talents, knacks, backgrounds, presets, sim builds.
#
# v0.2 (Amendment 2 revision): no paths. Casting power and martial power are bought with
# the same five talent picks. Every talent is tagged `track: steel | spell | null`; how
# many you hold of a track (your *depth* in it) sets what the track gives you (`tracks:`
# below) and whether your tracked talents grow at 5th and 9th (`tracks.scaling_depth`).
# Contract and schema: docs/DESIGN_facets_d20_v0_2.md (§1 is the schema; every field and
# effect type used here is defined there; §3 is the chassis; §3.5 "Why this holds").
# Spells, domains and slot tables: facets_d20_spells.yaml.
# Engine: software/facets_d20/. Structure tests: software/tests/test_facets_d20_data.py.
#
# The chapter prose in facets_d20/*.md is still v0.1 until the prose pass.
#
# Includes material adapted from the System Reference Document 5.2.1 by Wizards of the
# Coast LLC, licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/legalcode).
# Talents with `basis: original` are this project's own mechanics (BRIEF Amendment 1, ruling 5).

version: 0.2
levels: {min: 1, max: 10}
proficiency_bonus: {1: 2, 2: 2, 3: 2, 4: 2, 5: 3, 6: 3, 7: 3, 8: 3, 9: 4, 10: 4}

advancement:
  talent_levels: [1, 3, 5, 7, 9]
  knack_levels: [2, 6, 10]          # plus the background's knack at 1st
  asi_levels: [4, 8]
  asi_rule: choice                  # V21: +2 to one ability, +1 to two, or one extra knack (max 20); presets: +2 primary
  hp_first: hit_die_plus_eight_plus_con   # V35 (balance pass): 1st level = hit die + 8 + Con
  hp_per_level: half_die_plus_one_plus_con   # fixed, never rolled
  retrain: once_per_level_on_long_rest       # swap one talent, knack or domain (never your Facet)

build_rules:
  cross_facet_talent_cap: 2
  one_tradition: true               # E3: Body names its tradition with its first Spell talent
  rider_limit_per_turn: 1           # exception E1
  controlled_creature_limit: 1      # exception E2
  max_hit_die: 12

# ---------------------------------------------------------------------------- tracks
# Amendment 2 (owner): balance by opportunity cost inside the talent budget, no gates.
# depth = the number of your talents tagged with that track (talents from any menu count).
# main track = the track you hold more talents in; Steel wins a tie. A Facet's
# `facet_weight` counts toward it (Body: Steel +2, so a Body character's main track is
# always Steel). Ranks marked `main: true` apply only while that track is your main
# track — recomputed whenever your talents change, so ranks can lapse (DESIGN §3.2).
# Every rank you qualify for applies; a higher rank's `casting` replaces a lower one's.
tracks:
  scaling_depth: {5: 2, 9: 3}       # a Steel or Spell talent's 5th-level line needs depth 2 in
                                    # its track, its 9th-level line depth 3 (general talents: none)
  main_track: {rule: more_talents, tie: steel}
  facet_weight: {body: {steel: 2}}  # part of exception E3 (Body has no tradition of its own)
  steel:
    name: Steel
    ranks:
      - id: martial_weapons
        name: Martial Weapons
        depth: 1
        main: false
        basis: "SRD 5.2.1 martial weapon proficiency"
        summary: Your first Steel talent gives you martial weapons, whatever your main track.
        effects:
          - {type: weapon_proficiency, categories: [martial]}
      - id: martial_training
        name: Martial Training
        depth: 1
        main: true
        basis: "SRD 5.2.1 Fighter/Paladin armor training and hit dice (redistributed)"
        summary: >-
          While Steel is your main track: one more armor step (Mind: medium armor and
          shields; Soul: heavy armor; Body already wears everything) and, for Mind and
          Soul, a hit die one size larger.
        effects:
          - {type: armor_proficiency, categories: {body: [], mind: [medium, shields], soul: [heavy]}}
          - {type: hit_die_step, value: 1, facets: [mind, soul]}
      - id: extra_attack
        name: Extra Attack
        depth: 2
        main: true
        level: 5
        basis: "SRD 5.2.1 Fighter: Extra Attack"
        summary: >-
          Two Steel talents, Steel your main track, from 5th level: when you take the
          Attack action, you attack twice instead of once.
        effects:
          - {type: extra_attack, attacks: 2}
      - id: veteran
        name: Veteran
        depth: 3
        main: true
        basis: original
        summary: >-
          Three Steel talents, Steel your main track: +1 hit point per level (retroactive)
          and +2 damage on your weapon hits (not a rider).
        effects:
          - {type: hp_per_level, value: 1}
          - {type: damage_bonus, value: 2, weapon: any}
  spell:
    name: Spell
    ranks:
      - id: spellcasting
        name: Spellcasting
        depth: 1
        main: false
        basis: "SRD 5.2.1 half-caster Spellcasting (Paladin/Ranger slot table)"
        summary: >-
          Your first Spell talent, whatever your main track: you cast your tradition (Mind:
          Thaumaturgy, Int; Soul: Invocation, the higher of Wis and Cha; Body: the one you
          name with this talent). Choose one domain of your tradition. You cast from the
          Common list and your domains; slots on the Half table by your level.
        effects:
          - {type: casting, progression: half}
          - {type: domains, count: 1}
      - id: full_casting
        name: Full Casting
        depth: 2
        main: true
        basis: "SRD 5.2.1 full-caster Spellcasting (Wizard/Cleric slot table)"
        summary: Two Spell talents, Spell your main track. Your slots use the Full table instead.
        effects:
          - {type: casting, progression: full}
      - id: deep_magic
        name: Deep Magic
        depth: 3
        main: true
        basis: original
        summary: >-
          Three Spell talents, Spell your main track: one more domain of your tradition,
          which may be a prismatic domain. (The only way to learn a prismatic domain;
          pending owner ruling, DESIGN §5.1.)
        effects:
          - {type: domains, count: 1, prismatic: true}

# ---------------------------------------------------------------------------- facets
# The Facet sets the chassis a character starts with; talents add to it (tracks above).
facets:
  body:
    name: Body
    hit_die: 10
    saves: [str, con]
    armor: [light, medium, heavy, shields]
    weapons: [simple, martial]
    skill_picks: 2
    skills: [acrobatics, animal_handling, athletics, intimidation, perception,
             sleight_of_hand, stealth, survival]
    tradition: null                 # E3: a Body caster names Invocation or Thaumaturgy with its first Spell talent
    casting_ability: null           # then the tradition's ability
    features:
      - id: second_wind
        name: Second Wind
        level: 1
        basis: "SRD 5.2.1 Fighter: Second Wind"
        summary: >-
          Bonus action: regain 1d10 + your level hit points. One use (two from 5th);
          one returns on a short rest, all on a long rest.
        effects:
          - {type: resource, id: second_wind, uses: 1, recharge: long, short_rest_regain: 1, by_level: {5: 2}}
          - {type: heal, amount: "1d10+level", action: bonus, targets: self, resource: second_wind}
      - id: action_surge
        name: Action Surge
        level: 2
        basis: "SRD 5.2.1 Fighter: Action Surge"
        summary: Once per short rest, take one additional action on your turn. It can't be used to cast a spell.
        effects:
          - {type: resource, id: action_surge, uses: 1, recharge: short}
          - {type: extra_action, resource: action_surge, forbid: [spell]}
      - id: indomitable
        name: Indomitable
        level: 9
        basis: "SRD 5.2.1 Fighter: Indomitable"
        summary: Once per long rest, reroll a failed saving throw and add your level to the new roll.
        effects:
          - {type: resource, id: indomitable, uses: 1, recharge: long}
          - {type: reroll, roll: failed_save, add: level, resource: indomitable}
  mind:
    name: Mind
    hit_die: 6
    saves: [int, wis]
    armor: [light]
    weapons: [simple]
    skill_picks: 2
    skills: [arcana, history, insight, investigation, medicine, nature, perception, religion]
    tradition: thaumaturgy
    casting_ability: int
    features:
      - id: study
        name: Study
        level: 1
        basis: original
        summary: >-
          Bonus action: study a creature you can see within 60 feet. It is your studied
          target until the fight ends or you study another. You learn its resistances,
          immunities and vulnerabilities, and your next attack roll or check against it
          this turn has advantage. Uses equal to your proficiency bonus; all return on a
          short rest.
        effects:
          - {type: resource, id: study, uses: pb, recharge: short}
          - {type: studied_target, action: bonus, range_ft: 60, duration: fight, resource: study}
          - {type: advantage, roll: [attack, check], scope: next_roll_vs_studied_this_turn}
          - {type: narrative, text: learn the target's resistances, immunities and vulnerabilities}
      - id: studied_recovery
        name: Studied Recovery
        level: 2
        basis: "SRD 5.2.1 Wizard: Arcane Recovery"
        summary: >-
          If you cast spells: once per long rest, when you finish a short rest, recover
          spent spell slots whose levels add up to half your level, rounded up. None can
          be 5th level. (No slots, nothing to recover: no rule needed.)
        effects:
          - {type: resource, id: studied_recovery, uses: 1, recharge: long}
          - {type: slot_recovery, amount: half_level_round_up, max_slot: 4, trigger: short_rest, resource: studied_recovery}
  soul:
    name: Soul
    hit_die: 8
    saves: [wis, cha]
    armor: [light, medium, shields]
    weapons: [simple]
    skill_picks: 2
    skills: [animal_handling, deception, insight, intimidation, medicine, nature,
             performance, persuasion, religion, survival]
    tradition: invocation
    casting_ability: soul           # the higher of Wis and Cha, always
    features:
      - id: kindle
        name: Kindle
        level: 1
        basis: original
        summary: >-
          Bonus action: a creature within 60 feet that can hear you gains a Spark (cap 3).
          Uses equal to your proficiency bonus; all return on a long rest.
        effects:
          - {type: resource, id: kindle, uses: pb, recharge: long}
          - {type: spark, grant: 1, targets: one_creature, range_ft: 60, action: bonus, resource: kindle}

# ---------------------------------------------------------------------------- talents
# menus: every Facet menu it is printed on (a talent on your own Facet's menu is never a
# cross-Facet pick). track: steel | spell | null — the talent counts toward that track's
# depth (tracks: above). A tracked talent's `scaling` line at 5th needs depth 2 in its
# track and at 9th depth 3 (tracks.scaling_depth); an untracked talent scales by level only.
# No talent has a path, Facet or "can't take" requirement.
talents:
  # ---------------------------------------------------------- shared by all three
  - id: alert
    name: Alert
    menus: [body, mind, soul]
    track: null
    requires: null
    basis: original
    summary: >-
      While you are conscious, your side's initiative roll has advantage.
    effects:
      - {type: advantage, roll: [initiative], scope: side_roll, condition: [conscious]}
  - id: hardy
    name: Hardy
    menus: [body, mind, soul]
    track: null
    requires: null
    basis: original
    summary: Your hit die is one size larger (d6→d8→d10→d12). Recalculate your hit points.
    effects:
      - {type: hit_die_step, value: 1}
  - id: weapon_expert
    name: Weapon Expert
    menus: [body, mind, soul]
    track: steel
    requires: null
    basis: "SRD 5.2.1 Fighter: Fighting Style (Archery, Defense) and Champion: Improved Critical, merged"
    summary: >-
      +1 to weapon attack rolls, and +1 AC while you wear armor. From 5th, your weapon
      attacks score a critical hit on a 19 or 20. From 9th, when you score one, regain
      hit points equal to half your level.
    effects:
      - {type: attack_bonus, value: 1, weapon: any}
      - {type: ac_bonus, value: 1, condition: [armored]}
    scaling:
      5: [{type: crit_range, min: 19, weapon: any}]
      9: [{type: heal, amount: half_level, trigger: on_crit, targets: self}]

  # ---------------------------------------------------------- shared by two
  - id: precision
    name: Precision
    menus: [body, mind]
    track: steel
    requires: null
    basis: "SRD 5.2.1 Rogue: Sneak Attack (smaller dice, because two Steel talents bring Extra Attack)"
    summary: >-
      Once per turn, when you hit with a finesse or ranged weapon and you had advantage,
      an ally was next to the target, or it is your studied target: +1d6 damage (2d6
      from 5th, 3d6 from 9th). This is a rider.
    effects:
      - {type: extra_damage_dice, dice: 1d6, rider: true, frequency: once_per_turn,
         weapon: [finesse, ranged], condition_any: [has_advantage, ally_adjacent_to_target, studied_target]}
    scaling:
      5: [{type: extra_damage_dice, dice: 2d6, rider: true, frequency: once_per_turn,
           weapon: [finesse, ranged], condition_any: [has_advantage, ally_adjacent_to_target, studied_target]}]
      9: [{type: extra_damage_dice, dice: 3d6, rider: true, frequency: once_per_turn,
           weapon: [finesse, ranged], condition_any: [has_advantage, ally_adjacent_to_target, studied_target]}]
  - id: turn_the_odds
    name: Turn the Odds
    menus: [mind, soul]
    track: spell
    requires: null
    basis: original
    summary: >-
      You bend chance with magic. You can spend a Spark on the d20 test of any creature
      you can see within 60 feet, adding the Spark die or subtracting it. Once per round.
      You start every fight with at least one Spark.
    effects:
      - {type: spark, spend_on: any_creature, range_ft: 60, subtract: true, frequency: once_per_round}
      - {type: spark, floor: 1, trigger: fight_start}
  - id: wider_study
    name: Wider Study
    menus: [mind, soul]
    track: spell
    requires: null
    basis: original
    summary: Take one more domain of your tradition. Its spells join your lists.
    effects:
      - {type: domains, count: 1}

  # ---------------------------------------------------------- Body
  - id: rage
    name: Rage
    menus: [body]
    track: steel
    requires: null
    basis: "SRD 5.2.1 Barbarian: Rage, Reckless Attack, Unarmored Defense, Relentless Rage (simplified)"
    summary: >-
      Bonus action, not in heavy armor: until the fight ends you resist bludgeoning,
      piercing and slashing damage, deal +2 damage with Strength weapon attacks (+3 from
      9th), have advantage on Strength checks and saves, and can't cast spells. While
      raging you can attack recklessly (advantage on your Strength melee attacks this
      turn; attacks against you have advantage until your next turn). Unarmored, your AC
      is 10 + Dex + Con (a shield counts). Two rages (three from 5th, four from 9th); one
      returns on a short rest. From 5th, once per long rest, when you drop to 0 HP while
      raging you drop to 1 instead.
    effects:
      - {type: resource, id: rage, uses: 2, recharge: long, short_rest_regain: 1}
      - {type: stance, id: raging, action: bonus, duration: fight, resource: rage, forbid_armor: [heavy]}
      - {type: resistance, damage_types: [bludgeoning, piercing, slashing], condition: [raging]}
      - {type: damage_bonus, value: 2, weapon: str_melee, condition: [raging]}
      - {type: advantage, roll: [check, save], scope: str, condition: [raging]}
      - {type: reckless, condition: [raging]}
      - {type: forbid, what: [spellcasting, concentration], condition: [raging]}
      - {type: ac_formula, base: 10, add: [dex, con], shield_allowed: true, condition: [unarmored]}
    scaling:
      5: [{type: resource, id: rage, uses: 3, recharge: long, short_rest_regain: 1},
          {type: resource, id: relentless, uses: 1, recharge: long},
          {type: drop_to_one, trigger: would_drop_to_0, condition: [raging], resource: relentless}]
      9: [{type: resource, id: rage, uses: 4, recharge: long, short_rest_regain: 1},
          {type: damage_bonus, value: 3, weapon: str_melee, condition: [raging]}]
  - id: martial_arts
    name: Martial Arts
    menus: [body]
    track: steel
    requires: null
    basis: "SRD 5.2.1 Monk: Martial Arts, Unarmored Defense, Monk's Focus, Stunning Strike"
    summary: >-
      Unarmored and without a shield: your unarmed strikes and simple or light melee
      weapons can use Dex and a d4 damage die (d6 from 5th, d8 from 9th); after you take
      the Attack action you can make one unarmed strike as a bonus action; your speed
      rises by 10 feet; your AC is 10 + Dex + Wis. You have focus points equal to half
      your level (all back on a short rest): spend 2 for Flurry (two bonus-action strikes
      instead of one), or 1 for Patient Defense (Dodge) or Step of the Wind (Dash and
      Disengage).
      From 5th: Stunning Strike (once per turn on a hit, 1 focus point, Con save against
      8 + prof + Wis or stunned until the start of your next turn).
    effects:
      - {type: martial_die, die: d4, ability: dex, applies: [unarmed, simple_melee, light_melee], condition: [unarmored, no_shield]}
      - {type: bonus_attack, count: 1, weapon: unarmed, condition: [unarmored, no_shield, attack_action]}
      - {type: speed_bonus, value: 10, condition: [unarmored, no_shield]}
      - {type: ac_formula, base: 10, add: [dex, wis], shield_allowed: false, condition: [unarmored]}
      - {type: resource, id: focus, uses: half_level, recharge: short}
      - {type: bonus_attack, count: 2, weapon: unarmed, resource: focus, cost: 2, replaces_free: true,
         condition: [unarmored, no_shield, attack_action]}
      - {type: narrative, text: "Patient Defense (1 focus: Dodge as a bonus action); Step of the Wind (1 focus: Dash and Disengage)"}
    scaling:
      5: [{type: martial_die, die: d6, ability: dex, applies: [unarmed, simple_melee, light_melee], condition: [unarmored, no_shield]},
          {type: condition_on_hit, inflicts: stunned, save: con, dc: "8+pb+wis", resource: focus, cost: 1,
           frequency: once_per_turn, duration: until_your_next_turn_start}]
      9: [{type: martial_die, die: d8, ability: dex, applies: [unarmed, simple_melee, light_melee], condition: [unarmored, no_shield]}]
  - id: cunning
    name: Cunning
    menus: [body]
    track: null
    requires: null
    basis: "SRD 5.2.1 Rogue: Cunning Action, Uncanny Dodge, Evasion"
    summary: >-
      You can Dash, Disengage or Hide as a bonus action. From 5th, when an attacker you
      can see hits you, you can use your reaction to halve the damage. From 9th, when a
      Dex save would halve damage, you take none on a success and half on a failure.
    effects:
      - {type: cunning_action, options: [dash, disengage, hide]}
    scaling:
      5: [{type: halve_damage, action: reaction, trigger: hit_by_seen_attacker}]
      9: [{type: evasion}]
  - id: guardian
    name: Guardian
    menus: [body]
    track: steel
    requires: null
    basis: original
    summary: >-
      Reaction, when a creature you can see hits an ally within 5 feet of you: you take
      the hit and everything it carries instead, reducing its damage by half your level
      (round up; before resistance).
    effects:
      - {type: redirect_hit, range_ft: 5, reduce_by: half_level_round_up, action: reaction}
  - id: marksman
    name: Marksman
    menus: [body]
    track: steel
    requires: null
    basis: "SRD 5.2.1 Rogue: Steady Aim; Fighting Style: Archery; Champion: Improved Critical (ranged)"
    summary: >-
      Bonus action, if you haven't moved this turn: your next ranged weapon attack this
      turn has advantage, and your speed is 0 until the turn ends. From 5th, +2 to ranged
      weapon attack rolls. From 9th, your ranged weapon attacks score a critical hit on
      a 19 or 20.
    effects:
      - {type: advantage, roll: [attack], scope: next_ranged_attack_this_turn, action: bonus, condition: [not_moved]}
    scaling:
      5: [{type: attack_bonus, value: 2, weapon: ranged}]
      9: [{type: crit_range, min: 19, weapon: ranged}]
  - id: cleave
    name: Cleave
    menus: [body]
    track: steel
    requires: null
    basis: "SRD 5.2.1 weapon mastery: Cleave (reworked as a talent)"
    summary: >-
      Once per turn, when you hit with a heavy or versatile melee weapon, a second
      creature within 5 feet of you and of the target takes damage equal to your
      Strength modifier (Strength + proficiency bonus from 5th). No attack roll; it isn't
      a rider.
    effects:
      - {type: aoe_rider, damage: str, targets: second_adjacent, weapon: heavy_or_versatile_melee, frequency: once_per_turn}
    scaling:
      5: [{type: aoe_rider, damage: "str+pb", targets: second_adjacent, weapon: heavy_or_versatile_melee, frequency: once_per_turn}]

  # ---------------------------------------------------------- Mind
  - id: evoker
    name: Evoker
    menus: [mind]
    track: spell
    requires: null
    basis: "SRD 5.2.1 Evoker: Sculpt Spells, Empowered Evocation; maximise is original"
    summary: >-
      When you cast an area spell, choose up to 1 + the spell's level creatures in it:
      they automatically succeed on its save and take no damage. Add your casting
      modifier to one damage roll of each damaging spell you cast (cantrips included).
      From 9th, once per long rest, a damaging spell deals the maximum on every die.
    effects:
      - {type: sculpt, count: "1+slot_level"}
      - {type: damage_bonus, value: casting, applies: spell, frequency: once_per_spell}
    scaling:
      9: [{type: resource, id: overcast, uses: 1, recharge: long},
          {type: maximize_spell, resource: overcast}]
  - id: anatomist
    name: Anatomist
    menus: [mind]
    track: steel
    requires: null
    basis: original
    summary: >-
      You know where to strike. Your weapon attacks against your studied target deal
      extra damage equal to your Intelligence modifier (not a rider) and score a critical
      hit on a 19 or 20 (18–20 from 9th). When you crit it, it is also knocked prone.
    effects:
      - {type: damage_bonus, value: int, weapon: any, condition: [studied_target]}
      - {type: crit_range, min: 19, weapon: any, condition: [studied_target]}
      - {type: condition_on_hit, inflicts: prone, trigger: crit, save: null, condition_target: [studied_target]}
    scaling:
      9: [{type: crit_range, min: 18, weapon: any, condition: [studied_target]}]
  - id: anticipate
    name: Anticipate
    menus: [mind]
    track: null
    requires: null
    basis: original
    summary: >-
      Reaction, when your studied target makes an attack roll against you or a creature
      you can see within 30 feet: it has disadvantage. No limit beyond your one reaction.
    effects:
      - {type: impose_disadvantage, roll: attack, trigger: studied_target_attacks, range_ft: 30, action: reaction}
  - id: iron_mind
    name: Iron Mind
    menus: [mind]
    track: null
    requires: null
    basis: original
    summary: >-
      Advantage on saves against being charmed or frightened. From 5th, when you succeed
      on a save against a spell, you take no damage from it. From 9th, advantage on all
      Int, Wis and Cha saves.
    effects:
      - {type: advantage, roll: [save], scope: vs_charmed_or_frightened}
    scaling:
      5: [{type: evasion, applies: spell_saves}]
      9: [{type: advantage, roll: [save], scope: [int, wis, cha]}]
  - id: master_plan
    name: Master Plan
    menus: [mind]
    track: null
    requires: null
    basis: original
    summary: >-
      Once per short rest, before a fight you had a scene to plan for, lay out the plan.
      In the first round, you and each ally who follows it have advantage on attack rolls
      and saving throws. From 5th, the plan holds through the second round too.
    effects:
      - {type: resource, id: master_plan, uses: 1, recharge: short}
      - {type: advantage, roll: [attack, save], scope: all, targets: [self, allies], condition: [first_round, planned], resource: master_plan}
    scaling:
      5: [{type: advantage, roll: [attack, save], scope: all, targets: [self, allies], condition: [first_round, planned], resource: master_plan, rounds: 2}]
  - id: clockwork_guardian
    name: Clockwork Guardian
    menus: [mind]
    track: spell
    requires: null
    basis: original
    summary: >-
      You build and animate a small construct (AC 15, HP 5 × your level, speed 30) that
      never attacks. It acts right after you: it Helps (an ally's next attack against a
      creature within 5 feet of it has advantage) or Guards (until your next turn, the
      first hit on an ally within 5 feet of it loses 1d8 + your Int modifier damage).
      Rebuild it on a long rest.
    effects:
      - {type: companion, ac: 15, hp: "5*level", speed: 30, attacks: false, actions: [help, guard],
         guard: {reduce: "1d8+int", hits: 1, range_ft: 5}}
  - id: field_kit
    name: Field Kit
    menus: [mind]
    track: null
    requires: null
    basis: original
    summary: >-
      After a long rest you rig the party's gear. At the start of each fight, you and up
      to your proficiency bonus of allies gain temporary hit points equal to half your
      level (round up).
    effects:
      - {type: temp_hp, amount: half_level_round_up, trigger: fight_start, targets: {self: true, allies: pb}}

  # ---------------------------------------------------------- Soul
  - id: channel
    name: Channel
    menus: [soul]
    track: spell
    requires: null
    basis: "SRD 5.2.1 Cleric: Divine Spark, and Life domain: Disciple of Life"
    summary: >-
      Magic action, one use (two from 5th, three from 9th), one back on a short rest: a creature within
      30 feet regains 1d8 + your casting modifier HP, or makes a Con save against your
      spell DC and takes that much radiant or necrotic damage (half on a success). 2d8
      from 5th, 3d8 from 9th. Also, when you cast a spell with a slot that restores hit
      points as you cast it, one creature it heals regains 2 + the slot's level extra.
    effects:
      - {type: resource, id: channel, uses: 1, recharge: long, short_rest_regain: 1}
      - {type: heal, amount: "1d8+casting", action: magic, range_ft: 30, targets: 1, resource: channel}
      - {type: save_damage, dice: 1d8, add: casting, save: con, dc: spell, half_on_success: true,
         damage_type: radiant, action: magic, range_ft: 30, resource: channel, alternative_to: heal}
      - {type: heal_boost, amount: "2+slot_level", trigger: slot_spell_heal_on_cast, targets: 1}
    scaling:
      5: [{type: resource, id: channel, uses: 2, recharge: long, short_rest_regain: 1},
          {type: heal, amount: "2d8+casting", action: magic, range_ft: 30, targets: 1, resource: channel},
          {type: save_damage, dice: 2d8, add: casting, save: con, dc: spell, half_on_success: true,
           damage_type: radiant, action: magic, range_ft: 30, resource: channel, alternative_to: heal}]
      9: [{type: resource, id: channel, uses: 3, recharge: long, short_rest_regain: 1},
          {type: heal, amount: "3d8+casting", action: magic, range_ft: 30, targets: 1, resource: channel},
          {type: save_damage, dice: 3d8, add: casting, save: con, dc: spell, half_on_success: true,
           damage_type: radiant, action: magic, range_ft: 30, resource: channel, alternative_to: heal}]
  - id: wild_shape
    name: Wild Shape
    menus: [soul]
    track: spell
    requires: null
    basis: "SRD 5.2.1 Druid: Wild Shape"
    summary: >-
      Bonus action: become a beast of CR 1/4 or lower (CR 1/2 from 5th, CR 1 from 9th; no
      flying speed before 9th) for the fight or an hour. You gain temporary HP equal to
      your level, keep your talents and Facet features, and can't cast spells. Two uses;
      one returns on a short rest.
    effects:
      - {type: resource, id: wild_shape, uses: 2, recharge: long, short_rest_regain: 1}
      - {type: wild_shape, max_cr: 0.25, temp_hp: level, action: bonus, keeps: [talents, facet_features],
         no_spells: true, flying: false, resource: wild_shape, sim_form: wolf}
    scaling:
      5: [{type: wild_shape, max_cr: 0.5, temp_hp: level, action: bonus, keeps: [talents, facet_features],
           no_spells: true, flying: false, resource: wild_shape, sim_form: black_bear}]
      9: [{type: wild_shape, max_cr: 1, temp_hp: level, action: bonus, keeps: [talents, facet_features],
           no_spells: true, flying: true, resource: wild_shape, sim_form: dire_wolf}]
  - id: sworn_strike
    name: Sworn Strike
    menus: [soul]
    track: steel
    requires: null
    basis: original
    summary: >-
      Once per turn, when you hit with a melee weapon, spend a use to deal an extra 2d8
      radiant damage (3d8 from 5th, 4d8 from 9th). Uses equal to your Soul modifier
      (minimum 1) per long rest; one returns on a short rest. From 9th, on a turn you hit
      and spend no use, add 1d8 radiant instead. Either way it is a rider. This is the
      game's one smite: no spell adds damage to a weapon hit (V24).
    effects:
      - {type: resource, id: sworn_strike, uses: soul, min: 1, recharge: long, short_rest_regain: 1}
      - {type: extra_damage_dice, dice: 2d8, rider: true, frequency: once_per_turn, weapon: [melee],
         damage_type: radiant, resource: sworn_strike}
    scaling:
      5: [{type: extra_damage_dice, dice: 3d8, rider: true, frequency: once_per_turn, weapon: [melee],
           damage_type: radiant, resource: sworn_strike}]
      9: [{type: extra_damage_dice, dice: 4d8, rider: true, frequency: once_per_turn, weapon: [melee],
           damage_type: radiant, resource: sworn_strike},
          {id: radiant_edge, type: extra_damage_dice, dice: 1d8, rider: true, frequency: once_per_turn,
           weapon: [melee], damage_type: radiant, fallback: true}]
  - id: mending_hands
    name: Mending Hands
    menus: [soul]
    track: spell
    requires: null
    basis: "SRD 5.2.1 Paladin: Lay On Hands"
    summary: >-
      A pool of healing magic equal to 5 × your level, refilled on a long rest. Bonus
      action, touch: restore any number of points from the pool, or spend 5 to end the
      poisoned condition.
    effects:
      - {type: heal_pool, size: "5*level", action: bonus, range_ft: 5, recharge: long}
  - id: warden
    name: Warden
    menus: [soul]
    track: null
    requires: null
    basis: "SRD 5.2.1 Paladin: Aura of Protection (earlier and smaller)"
    summary: >-
      While you are conscious, you and allies within 10 feet add +1 to saving throws
      (your Soul modifier, minimum +1, from 5th). From 9th, you can't be frightened.
    effects:
      - {type: save_bonus, value: 1, aura_ft: 10, targets: [self, allies]}
    scaling:
      5: [{type: save_bonus, value: soul, min: 1, aura_ft: 10, targets: [self, allies]}]
      9: [{type: condition_immunity, conditions: [frightened]}]
  - id: prophecy
    name: Prophecy
    menus: [soul]
    track: spell
    requires: null
    basis: original
    summary: >-
      After a long rest, speak one sentence about the day ahead: something you can't
      simply make happen (the MM can veto a trivial one). The first time the MM agrees it
      has come true, each ally who heard it gains a Spark (once per ally per day). From
      5th, you also regain every use of Kindle.
    effects:
      - {type: spark, grant: 1, targets: allies_who_heard, trigger: prophecy_fulfilled, frequency: once_per_day}
    scaling:
      5: [{type: resource_refill, resource: kindle, trigger: prophecy_fulfilled}]
  - id: oath_unbroken
    name: Oath Unbroken
    menus: [soul]
    track: null
    requires: null
    basis: original
    summary: >-
      Speak an oath of one sentence; it becomes one of your Drives. While you keep it,
      once per long rest, when you would drop to 0 HP you drop to 1 instead, and your
      next weapon or spell hit in that fight deals maximum damage. Break it and this does
      nothing until you make amends.
    effects:
      - {type: resource, id: oath, uses: 1, recharge: long}
      - {type: drop_to_one, trigger: would_drop_to_0, condition: [oath_kept], resource: oath}
      - {type: max_damage_next_hit, trigger: after_drop_to_one}

# ---------------------------------------------------------------------------- knacks
# Non-combat by rule: only effect types marked (N) in DESIGN §1.4, plus field_medic's
# hit_dice_bonus (between-fight healing, bounded by Hit Dice). Background gives one.
knacks:
  - id: expertise
    name: Expertise
    basis: "SRD 5.2.1 Rogue: Expertise"
    summary: Choose two skills you are proficient in. Your proficiency bonus is doubled for checks with them.
    effects: [{type: expertise, choose: 2}]
  - id: skilled
    name: Skilled
    basis: "SRD 5.2.1 origin feat: Skilled"
    summary: Gain proficiency in any three skills or tools, in any combination.
    effects: [{type: skill_proficiency, choose: 3, from: any_skill_or_tool}]
  - id: silver_tongue
    name: Silver Tongue
    basis: original
    summary: >-
      Once per NPC per scene, a failed Persuasion or Deception check doesn't move their
      attitude down; and beating the DC by 5 moves it two steps instead of by 10.
    effects: [{type: narrative, text: attitude-track protection and two-step shift (Chapter 06)}]
  - id: wild_kin
    name: Wild Kin
    basis: original
    summary: >-
      You can speak with beasts, and they start no worse than Neutral toward you. You have
      advantage on Survival checks to track or forage.
    effects:
      - {type: narrative, text: speak with beasts; beasts start Neutral}
      - {type: advantage, roll: [check], scope: survival_track_forage}
  - id: field_medic
    name: Field Medic
    basis: original
    summary: >-
      You can stabilize a creature as a bonus action. During a short rest, each Hit Die a
      creature you tend spends restores extra hit points equal to your proficiency bonus.
    effects:
      - {type: narrative, text: stabilize as a bonus action}
      - {type: hit_dice_bonus, amount: pb, trigger: short_rest}
  - id: gadgeteer
    name: Gadgeteer
    basis: original
    summary: >-
      With tinker's tools and a short rest you can make one simple non-combat device: a
      grapnel, a tripwire alarm, a lamp that won't gutter, a lock you can pick in a
      breath. It works until your next long rest.
    effects: [{type: tool_proficiency, choose: 1, from: [tinkers_tools]}, {type: narrative, text: non-combat gadgets}]
  - id: encyclopedic
    name: Encyclopedic
    basis: original
    summary: >-
      Once per long rest, state a fact about a creature, place or piece of history. It is
      true (the MM may add a complication).
    effects: [{type: narrative, text: once per long rest a stated fact is true}]
  - id: well_travelled
    name: Well-Travelled
    basis: original
    summary: >-
      You know two more languages, and in any settlement you can find someone to
      translate any other language for you within the hour.
    effects: [{type: languages, count: 2}, {type: narrative, text: find a translator in any settlement}]
  - id: streetwise
    name: Streetwise
    basis: original
    summary: In any settlement you can find someone who knows someone, given an hour and a few coins.
    effects: [{type: narrative, text: contacts in any settlement}]
  - id: performer
    name: Performer
    basis: original
    summary: >-
      You can earn a modest living by performing, and a crowd that watches you perform
      starts one step friendlier toward you.
    effects: [{type: narrative, text: crowd attitude +1 step after a performance}]
  - id: pathfinder
    name: Pathfinder
    basis: original
    summary: >-
      Your group can't get lost except by magic, travels stealthily at a normal pace, and
      finds twice as much food when you forage.
    effects: [{type: narrative, text: travel and foraging benefits}]
  - id: artisan
    name: Artisan
    basis: original
    summary: Gain proficiency with two artisan's tools; you craft nonmagical items in half the time.
    effects: [{type: tool_proficiency, choose: 2, from: artisans_tools}, {type: narrative, text: half crafting time}]
  - id: many_faces
    name: Many Faces
    basis: original
    summary: >-
      Gain proficiency with the disguise kit. You can put on a disguise in a minute
      without one, and your disguise holds up to a casual look without a roll; only close
      scrutiny calls for a check.
    effects: [{type: tool_proficiency, choose: 1, from: [disguise_kit]}, {type: narrative, text: disguise needs no roll against casual inspection}]


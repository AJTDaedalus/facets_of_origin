# measured shape in maps/*.svg against these numbers. fact_check.py ignores this block.
  - id: escape_route
    truth: >-
      Raunu meant to keep Veier in the sealed east wing until the child was born; the escape
      is Vell's, never Raunu's plan. Vell's boat leaves by the river gate and runs north up
      the tributary to the foothills, where he has horses waiting; from there they ride west
      toward the mountains. No cart, no carter, no "factor and his sick daughter".
    source: owner TP11, TP12 (2026-10-20); replaces invention #8 (Vell's escape logistics)
    checks:
      - type: forbid
